{"c":"規則","q":"リモートID機能により発信される情報に関する記述のうち、正しいものはどれか。","a":["静的情報(製造番号・登録記号)と動的情報(位置・速度・高度・時刻等)が1秒に1回以上発信され、所有者や使用者の情報は含まれない。","所有者及び使用者の氏名・住所が動的情報として発信される。","発信は10秒に1回程度であり、位置情報は含まれない。"],"ans":0,"ex":"リモートIDは静的情報と動的情報を<b>1秒に1回以上</b>発信し、<b>所有者・使用者の情報は含まない</b>。個人情報が発信されると誤解しやすい点に注意。"},
{"c":"規則","q":"「無操縦者航空機」に関する記述のうち、正しいものはどれか。","a":["操縦者が乗り組まないで飛行できる装置を有する航空機であり、航空機を改造したものなど航空機に近い構造・性能を有する場合は、無人航空機ではなく航空機に分類される。","重量100グラム以上のマルチコプター型ドローンはすべて無操縦者航空機に分類される。","無操縦者航空機は無人航空機の一種であり、無人航空機の機体登録の対象となる。"],"ans":0,"ex":"人が乗り組まないでも<b>航空機に近い構造・性能</b>を持つものは<b>航空機(無操縦者航空機)</b>に分類され、無人航空機ではない。一般的なドローンとの違いに注意。"},
{"c":"規則","q":"航空交通管制区に関する記述のうち、正しいものはどれか。","a":["地表又は水面から200メートル以上の高さの空域のうち国が指定した空域であり、計器飛行方式で飛行する航空機は管制機関の指示に従う。","地表又は水面から150メートル以上の高さの空域全域を指す。","航空機の離着陸が頻繁な空港等及びその周辺の空域のみを指す。"],"ans":0,"ex":"航空交通管制区は<b>地表・水面から200m以上</b>のうち国指定の空域。無人機の飛行禁止高度150mや、空港周辺の管制圏と混同しやすい。"},
{"c":"規則","q":"航空機の飛行方式に関する記述のうち、正しいものはどれか。","a":["計器飛行方式(IFR)は航空交通管制機関が与える指示等に常時従って行う飛行方式で、高高度を移動する旅客機は通常IFRで飛行する。","有視界飛行方式(VFR)は、常に航空交通管制機関の指示に従って飛行する方式である。","小型機や回転翼航空機は通常、計器飛行方式(IFR)のみで飛行する。"],"ans":0,"ex":"<b>IFR</b>は管制指示に常時従う方式で旅客機が用いる。<b>VFR</b>は操縦者の判断に基づく方式で、小型機・回転翼機に多い。"},
{"c":"規則","q":"機体認証の有効期間に関する記述のうち、正しいものはどれか。","a":["第一種機体認証は1年、第二種機体認証は3年である。","第一種・第二種ともに3年である。","第一種は3年、第二種は1年である。"],"ans":0,"ex":"機体認証の有効期間は<b>第一種1年・第二種3年</b>。技能証明(一等・二等とも3年)や機体登録(3年)と数値を混同しやすい。"},
{"c":"規則","q":"次のうち、カテゴリーIIA飛行に該当するものはどれか。","a":["立入管理措置を講じた上で行う、最大離陸重量25キログラム以上の無人航空機による飛行。","立入管理措置を講じた上で行う、夜間の目視外飛行(空港周辺・150m以上等を除く)。","立入管理措置を講じないで行う、第三者上空での特定飛行。"],"ans":0,"ex":"カテゴリーIIのうち<b>空港周辺・150m以上・催し・危険物・物件投下・25kg以上</b>がリスクの高いIIA。夜間目視外のみはIIB、立入管理措置なしはカテゴリーIII。"},
{"c":"規則","q":"無人航空機の事故が発生した際に、飛行を中止し負傷者を救護するなどの危険を防止するための措置を講じなかった場合の罰則として、正しいものはどれか。","a":["2年以下の懲役又は100万円以下の罰金","1年以下の懲役又は50万円以下の罰金","30万円以下の罰金"],"ans":0,"ex":"危険防止措置を講じなかった場合は最も重い<b>2年以下の懲役又は100万円以下の罰金</b>。無登録飛行(1年/50万円)よりも重い。"},
{"c":"規則","q":"アルコール又は薬物の影響下で無人航空機を飛行させた場合の罰則として、正しいものはどれか。","a":["1年以下の懲役又は30万円以下の罰金","2年以下の懲役又は100万円以下の罰金","10万円以下の罰金"],"ans":0,"ex":"アルコール・薬物影響下の飛行は<b>1年以下の懲役又は30万円以下の罰金</b>。同じ懲役1年でも無登録飛行(罰金50万円)とは罰金額が異なる。"},
{"c":"規則","q":"無人航空機操縦者技能証明に係る行政処分の点数制に関する記述のうち、正しいものはどれか。","a":["処分事由に対応する点数を基本に加重・軽減し、点数が15点以上の場合は技能証明の効力の取消しとなる。","点数の多少にかかわらず、1回でも違反すれば直ちに技能証明が取り消される。","点数が6点に達すると技能証明が取り消される。"],"ans":0,"ex":"点数制では<b>15点以上で取消し</b>、12〜14点で効力停止1年など段階的。6点は効力停止3月の区分であり取消しではない。"},
{"c":"規則","q":"すべての空港に設定される制限表面の組合せとして、正しいものはどれか。","a":["進入表面・水平表面・転移表面","円錐表面・延長進入表面・外側水平表面","進入表面・円錐表面・外側水平表面"],"ans":0,"ex":"全空港に設定されるのは<b>進入・水平・転移</b>の3表面。円錐・延長進入・外側水平表面は羽田・成田・中部・関西や政令空港で追加指定されるもの。"},
{"c":"規則","q":"空港に設定される「円錐表面」の目的として、正しいものはどれか。","a":["大型化・高速化により旋回半径が増大した航空機の、空港周辺での旋回飛行等の安全を確保する。","進入の最終段階及び離陸時における航空機の安全を確保する。","進入をやり直す場合等の側面方向への飛行の安全を確保する。"],"ans":0,"ex":"円錐表面は<b>旋回半径が増大した航空機</b>の旋回飛行の安全確保用。進入の最終段階・離陸時は進入表面、側面方向は転移表面の目的。"},
{"c":"規則","q":"重量100グラム未満の模型航空機を飛行させる際に、国土交通省への事前の届出が必要となる空域として、正しいものはどれか。","a":["空港等の周辺、航空路内の空域(高度150メートル以上)、又は高度250メートル以上の空域","地表からの高さが50メートル以上のすべての空域","人口集中地区(DID)の上空"],"ans":0,"ex":"模型航空機は<b>空港周辺・航空路内(150m以上)・高度250m以上</b>で事前届出が必要。管制圏等ではそもそも飛行が禁止される。"},
{"c":"規則","q":"無人航空機と航空機の関係に関する記述のうち、正しいものはどれか。","a":["飛行の進路が交差・接近する場合には無人航空機側が回避することが妥当であり、航空機は無人航空機に対して進路権を有する。","無人航空機は航空機より機動性が低いため、航空機側が回避することとされている。","航空機と無人航空機は対等であり、先に相手を認めた側が回避する。"],"ans":0,"ex":"航空機の航行の安全を最優先するため<b>航空機が進路権</b>を持ち、機動性の高い<b>無人航空機側が回避</b>する。"},
{"c":"規則","q":"登録を受けることができない無人航空機に該当するものとして、正しいものはどれか。","a":["製造者が安全性の懸念からリコール(回収)している機体や、表面に不要な突起物があり地上の人に衝突した際に安全を著しく損なうおそれのある機体","最大離陸重量が25キログラム以上の機体","製造から5年以上経過した機体"],"ans":0,"ex":"<b>リコール機体・危険な突起物のある機体・制御が著しく困難な機体</b>は登録できない。重量が大きいことや経過年数は登録拒否事由ではない。"},
{"c":"規則","q":"国土交通大臣への報告が義務付けられる無人航空機の「事故」に関する記述のうち、正しいものはどれか。","a":["人の死傷は重傷以上を対象とし、物件の損壊は第三者の所有物であれば損害額の大小を問わず全ての損傷が対象となる。","人の負傷は軽傷であってもすべて事故として報告が必要である。","物件の損壊は、損害額が一定額以上のもののみが対象となる。"],"ans":0,"ex":"事故のうち人の死傷は<b>重傷以上</b>が対象。物件損壊は第三者所有物なら<b>規模・損害額を問わず全て</b>対象。重傷に至らない負傷は重大インシデント側。"},
{"c":"規則","q":"無人航空機に関する「重大インシデント」の対象に含まれるものとして、正しいものはどれか。","a":["飛行中に無人航空機が発火した事態や、無人航空機の制御が不能となった事態","飛行前の点検中にプロペラの損傷を発見した事態","バッテリー残量の低下により予定より早く着陸した事態"],"ans":0,"ex":"重大インシデントには<b>制御不能・飛行中の発火・航空機との衝突接触のおそれ・重傷に至らない負傷</b>が含まれる。飛行前の発見や通常の早期着陸は該当しない。"},
{"c":"規則","q":"特定飛行を行う場合の飛行計画の通報に関する記述のうち、正しいものはどれか。","a":["あらかじめ通報するのが原則だが、あらかじめ通報することが困難な場合には事後の通報でもよい。","特定飛行であっても飛行計画の通報は一切不要である。","事後の通報は一切認められておらず、事前通報のみが有効である。"],"ans":0,"ex":"飛行計画は原則<b>事前通報</b>だが、困難な場合は<b>事後通報も可</b>。通報せず特定飛行を行うと30万円以下の罰金の対象となる。"},
{"c":"規則","q":"十分な強度を有する紐等(30メートル以下)による係留飛行に関する記述のうち、正しいものはどれか。","a":["自動車等の移動する物件に紐等を固定して、又は人が紐等を持って移動しながら飛行させる行為(えい航)は、係留には該当しない。","えい航による飛行も係留として扱われ、夜間飛行等の手続きが不要となる。","係留する紐の長さに上限はなく、100メートルでも係留飛行として認められる。"],"ans":0,"ex":"係留は紐の長さ<b>30m以下</b>が要件で、<b>えい航(移動しながらの飛行)は係留に該当しない</b>。係留により人口集中地区・夜間・目視外・30m未満・物件投下の手続きが不要になる。"},
{"c":"規則","q":"多数の者の集合する催しが行われている場所の上空で飛行を行う場合に必要な措置として、正しいものはどれか。","a":["風速5メートル毎秒以上の場合は飛行を中止し、機体が第三者及び物件に接触した場合の危害を軽減する構造を用意すること。","風速10メートル毎秒以上の場合にのみ飛行を中止すればよい。","危害を軽減する構造は不要で、補助者を配置すれば飛行を継続できる。"],"ans":0,"ex":"催し場所上空の飛行では<b>風速5m/s以上で中止</b>し、接触時の<b>危害軽減構造</b>が必要。他の飛行の風速目安と混同しやすい。"},
{"c":"規則","q":"無人航空機による輸送が原則禁止される「危険物」に該当しないものとして、正しいものはどれか。","a":["無人航空機の飛行のために必要な燃料や電池、パラシュートを開傘するために必要な火薬類や高圧ガス","引火性液体や可燃性物質","毒物類や放射性物質"],"ans":0,"ex":"火薬類・高圧ガス・引火性液体等は危険物だが、<b>その無人航空機の飛行のために積む燃料・電池・安全装置用の火薬類等は危険物の対象外</b>となる。"},
{"c":"規則","q":"無人航空機からの「物件の投下」に関する記述のうち、正しいものはどれか。","a":["水や農薬等の液体や霧状のものの散布も物件の投下に含まれるが、輸送した物件を地上の人員に受け渡す行為は含まれない。","液体や霧状のものの散布は物件の投下には含まれない。","輸送した物件を地表に置く行為も物件の投下に含まれる。"],"ans":0,"ex":"物件投下には<b>液体・農薬等の散布も含まれる</b>。一方、<b>地上の人員への受け渡しや地表に置く行為は投下に含まれない</b>。"},
{"c":"規則","q":"無人航空機と30メートル以上の距離を保つ規制における「物件」に該当しないものとして、正しいものはどれか。","a":["土地や樹木・雑草などの自然物","ビル・住居・鉄塔・電線などの工作物","自動車・鉄道車両・船舶などの車両等"],"ans":0,"ex":"「物件」は第三者の車両等や相当の大きさを有する工作物を指し、<b>土地や自然物(樹木・雑草等)は物件に該当しない</b>。"},
{"c":"規則","q":"地表又は水面から150メートル以上の空域の飛行禁止の例外に関する記述のうち、正しいものはどれか。","a":["煙突や鉄塔などの高層構造物の周辺は、150メートル以上の空域であっても当該構造物から30メートル以内の空域は飛行禁止空域から除外される。","150メートル以上の空域は、いかなる場合も無人航空機を飛行させることはできない。","高層構造物の周辺は、当該構造物から150メートル以内であれば飛行禁止空域から除外される。"],"ans":0,"ex":"高層構造物周辺は航空機の飛行が想定されないため<b>構造物から30m以内</b>は150m以上でも除外される。ただし第三者の物件から30m以内の飛行方法に関する手続きは別途必要。"},
{"c":"規則","q":"小型無人機等飛行禁止法における飛行禁止区域と罰則に関する記述のうち、正しいものはどれか。","a":["対象施設の敷地・区域の上空(レッド・ゾーン)で飛行した者は1年以下の拘禁刑等、その周囲おおむね1000メートルの上空(イエロー・ゾーン)で飛行した者は6月以下の拘禁刑等となる。","レッド・ゾーンとイエロー・ゾーンで罰則に差はなく、いずれも6月以下の拘禁刑である。","イエロー・ゾーンでの飛行には罰則が設けられていない。"],"ans":0,"ex":"レッドゾーンは<b>1年以下の拘禁刑</b>、周囲おおむね<b>1000m</b>のイエローゾーンは<b>6月以下の拘禁刑</b>と重さが異なる(罰金はともに50万円以下)。"},
{"c":"規則","q":"無人航空機の操縦に用いられる920メガヘルツ帯の無線設備に関する記述のうち、正しいものはどれか。","a":["最大送信出力20ミリワットで無線局免許・無線従事者資格は不要だが、技術基準適合証明等を受けた適合表示無線設備であることが必要である。","無線局免許及び第三級陸上特殊無線技士以上の資格が必要である。","出力に上限はなく、技適マークのない海外製機器でも自由に使用できる。"],"ans":0,"ex":"920MHz帯(操縦用)は出力<b>20mW</b>で免許・資格不要だが、<b>技適マーク(適合表示無線設備)</b>が必要。免許不要と無規制は別物である。"},
{"c":"規則","q":"無人移動体画像伝送システム等で169メガヘルツ帯・2.4ギガヘルツ帯(1ワット)・5.7ギガヘルツ帯を利用する場合に必要となる無線従事者資格として、正しいものはどれか。","a":["第三級陸上特殊無線技士以上の資格","アマチュア無線技士の資格","無線従事者資格は不要"],"ans":0,"ex":"これらの携帯局(無人移動体画像伝送システム)は無線局免許に加え<b>第三級陸上特殊無線技士以上</b>が必要。免許不要局(920MHzや2.4GHz10mW等)とは異なる。"},
{"c":"規則","q":"無人航空機にアマチュア無線を用いる場合に関する記述のうち、正しいものはどれか。","a":["アマチュア無線は金銭上の利益のためでなく個人的な興味により行う無線通信であるため、利益を目的とした業務にアマチュア無線を用いた無人航空機を利用することはできない。","アマチュア無線技士の資格があれば、業務用の空撮でも自由に利用できる。","アマチュア無線局免許は不要であり、資格のみで運用できる。"],"ans":0,"ex":"アマチュア無線は<b>非営利・個人的興味</b>のための通信であり<b>業務利用は不可</b>。利用にはアマチュア無線技士の資格と無線局免許の両方が必要となる。"},
{"c":"規則","q":"無人航空機操縦者技能証明の資格要件に関する記述のうち、正しいものはどれか。","a":["航空法等に違反する行為等により技能証明を取り消された日から2年以内の者は、技能証明の申請をすることができない。","技能証明を取り消された者は、翌日から再度申請することができる。","技能証明の申請ができるのは18歳以上の者に限られる。"],"ans":0,"ex":"取消しから<b>2年以内</b>(拒否からは1年以内)は申請できない。申請可能年齢は<b>16歳以上</b>であり18歳ではない。"},
{"c":"規則","q":"技能証明の交付手続きに関する記述のうち、正しいものはどれか。","a":["学科試験に合格しなければ、実地試験を受けることができない。","実地試験に合格しなければ、学科試験を受けることができない。","学科試験と実地試験は、どちらを先に受験してもよい。"],"ans":0,"ex":"手続きの順序は<b>学科試験合格が実地試験の前提</b>。なお登録講習機関の講習(学科・実地)を修了した者は実地試験が免除され得る。"},
{"c":"規則","q":"飛行自粛要請空域に関する記述のうち、正しいものはどれか。","a":["法令等に基づく規制ではないが、警備上の観点等から関係省庁等の要請に基づき国土交通省が飛行自粛を要請するもので、操縦者は飛行開始前に該当の有無を確認する。","航空法に基づく飛行禁止空域であり、違反すると罰則が科される。","一度設定されると恒久的に飛行が禁止される空域である。"],"ans":0,"ex":"飛行自粛要請空域は<b>法令に基づく規制ではない</b>が、操縦者は飛行前に該当を確認し要請に従う必要がある。設定時は国交省HP・Xで公示される。"},
{"c":"システム","q":"飛行機と回転翼航空機（マルチローター・ヘリコプター）の特徴の比較として、教則の記述上正しいものはどれか。","a":["飛行機は回転翼航空機に比べ飛行速度が速くエネルギー効率が高いため、長距離・長時間の飛行が可能である","飛行機は回転翼航空機と同様に、垂直離着陸やホバリングを行うことができる","回転翼航空機は飛行機に比べエネルギー効率が高く、長距離飛行に適している"],"ans":0,"ex":"飛行機は翼の揚力で自重を支えるため<b>少ないエネルギー</b>で長距離・長時間飛行できる。垂直離着陸やホバリングは回転翼航空機の特徴で、飛行機にはできない。"},
{"c":"システム","q":"飛行機が飛行中に故障などで推力を失った場合に関する記述として、正しいものはどれか。","a":["滑空飛行状態になればすぐには墜落しないが、落下・不時着する地点を狭い範囲に抑えることはできない","推力を失うと直ちに垂直に墜落するため、回避の余地はない","滑空により落下地点を狭い範囲に確実に限定できる"],"ans":0,"ex":"飛行機は推力を失っても<b>滑空</b>すればすぐには墜落しない。ただし滑空するため、墜落・不時着の落下地点を狭い範囲に抑えることはできない。"},
{"c":"システム","q":"回転翼航空機（マルチローター）のローターの数と特性に関する記述として、正しいものはどれか。","a":["モーター性能が同一の場合、ローターの数が多いほど故障に対する耐性が向上し、ペイロードが増える","ローターの数が多いほど故障に対する耐性は低下する","ローターが4つのものをオクトコプター、8つのものをクワッドコプターと呼ぶ"],"ans":0,"ex":"モーター性能が同じなら<b>ローター数が多い</b>ほど故障耐性が高くペイロードも増える。ローター4＝クワッド、6＝ヘキサ、8＝オクトコプター。"},
{"c":"システム","q":"回転翼航空機（ヘリコプター）の機構に関する記述として、正しいものはどれか。","a":["ローターの反トルクを打ち消したり、ヨー方向の操縦に用いたりするためにテールローターを備える","マルチローターに比べ機構が単純で、スワッシュプレートやテールローターを必要としない","テールローターは主に上昇・降下のための揚力を発生させる役割を担う"],"ans":0,"ex":"ヘリコプターはメインローターの<b>反トルク</b>をテールローターで打ち消し、ヨー方向の操縦にも用いる。スワッシュプレート等が必要で構造は複雑である。"},
{"c":"システム","q":"飛行中の機体に流入する空気の「迎角」に関する記述として、正しいものはどれか。","a":["機体の前後軸と空気流入方向のなす角であり、下方から空気が流入するときに正となる","機体の左右方向への空気の流入角であり、右側から流入するときに正となる","迎角とは機体のバンク角（ロール角）のことである"],"ans":0,"ex":"<b>迎角</b>は前後軸と空気流入方向のなす角で、下方から流入するとき正。左右方向の角は横滑り角で、右側流入時に正である。"},
{"c":"システム","q":"飛行機の姿勢を制御する舵の配置として、正しいものはどれか。","a":["ピッチを変える昇降舵（エレベーター）は水平尾翼、ロールを変える補助翼（エルロン）は主翼、ヨーを変える方向舵（ラダー）は垂直尾翼にある","エレベーターは主翼、エルロンは垂直尾翼、ラダーは水平尾翼にある","エルロンは水平尾翼にあり、機首の上げ下げ（ピッチ）を制御する"],"ans":0,"ex":"<b>エレベーター＝水平尾翼</b>（ピッチ）、<b>エルロン＝主翼</b>（ロール）、<b>ラダー＝垂直尾翼</b>（ヨー）。舵の位置と役割の組合せを押さえる。"},
{"c":"システム","q":"回転翼航空機（マルチローター）のプロペラの回転方向に関する記述として、正しいものはどれか。","a":["プロペラからの反トルクを相殺するため、偶数個のプロペラを半数ずつ異なる向きに回転させるのが一般的である","すべてのプロペラを同一方向に回転させ、反トルクを大きくすることで安定させる","反トルクは飛行に影響しないため、回転方向は考慮しなくてよい"],"ans":0,"ex":"マルチローターは<b>反トルクを相殺</b>するため偶数個を半数ずつ逆向き（CW/CCW）に回す。各回転数を変えてピッチ・ロール・ヨーを制御する。"},
{"c":"システム","q":"高度と空気密度、飛行に必要な速度・回転数の関係に関する記述として、正しいものはどれか。","a":["空気密度は高度が上がるほど小さくなり、標準大気では高度が1000m増加すると空気密度は約0.9倍になる","空気密度は高度が上がるほど大きくなるため、高高度ほど揚力が得やすい","空気密度は高度によって変化しないため、飛行速度への影響はない"],"ans":0,"ex":"標準大気で<b>高度1000m増で空気密度は約0.9倍</b>に減少。密度が下がると同じ揚力・推力を得るのに速度や回転数を増やす必要がある。"},
{"c":"システム","q":"無推力で定常滑空する飛行機の滑空距離に関する記述として、正しいものはどれか。","a":["滑空距離は揚抗比（L/D）に比例し、揚抗比が大きいほど遠くまで滑空できる","滑空距離は揚抗比に反比例し、揚抗比が大きいほど滑空距離は短くなる","滑空距離は揚抗比と無関係で、機体重量のみで決まる"],"ans":0,"ex":"滑空距離d＝h×(L/D)で<b>揚抗比に比例</b>する。例えば揚抗比15・高度100mなら滑空距離は約1500mとなる。"},
{"c":"システム","q":"ジャイロセンサの機能に関する記述として、正しいものはどれか。","a":["単位時間当たりの回転角度の変化（回転角速度）を検出し、機体の傾きや向きの変化を捉える","地球の磁力を検出して機体の方位を測定する","人工衛星の電波を受信して機体の位置を測定する"],"ans":0,"ex":"ジャイロセンサは<b>回転角速度</b>を検出し、風などで傾いた機体の変化をFCへ伝える。方位は地磁気センサ、位置はGNSSの役割。"},
{"c":"システム","q":"加速度センサの機能に関する記述として、正しいものはどれか。","a":["直交3軸方向の並進運動（慣性運動）を検出し、機体の速度の変化量を捉える","回転角速度のみを検出する装置で、並進運動は検出できない","気圧の変化から高度を検出する装置である"],"ans":0,"ex":"加速度センサは<b>3次元の並進運動</b>を検出し速度変化量を捉える。ジャイロセンサと合わせて機体の姿勢を制御する。"},
{"c":"システム","q":"高度を計測するセンサに関する記述として、正しいものはどれか。","a":["気圧センサは気圧変化を歪みゲージで読み取り、超音波センサは音波の反射時間から高度を計測する","LiDARは音波を照射し、その反射時間から高度を計測する","気圧センサは人工衛星の電波を受信して高度を計測する"],"ans":0,"ex":"気圧センサは<b>歪みゲージ</b>で気圧変化を読み、超音波は<b>音波反射</b>、LiDARは<b>レーザー光（赤外線）</b>の反射時間で計測する。"},
{"c":"システム","q":"バッテリーの電圧に関する記述として、正しいものはどれか。","a":["放電（飛行）中の電圧降下は、バッテリーの内部抵抗によって決まる","電池残量が減っても電池の電圧は一定に保たれる","電圧降下はバッテリー外部の気温のみで決まり、内部抵抗は関係しない"],"ans":0,"ex":"放電中の<b>電圧降下＝内部抵抗×電流</b>で内部抵抗により決まる。電池残量が減ると電圧は下がる点も押さえる。"},
{"c":"システム","q":"バッテリーの「容量（Ah）」に関する記述として、正しいものはどれか。","a":["満充電から終止電圧になるまでに利用できる電気量で、放電電流の大きさや温度によって利用可能な容量は変化する","容量は放電電流や温度に関係なく常に一定である","容量とはセル1個あたりの電圧をセル数で掛けたものである"],"ans":0,"ex":"容量(Ah)＝電流×時間で、満充電から<b>終止電圧</b>まで使える電気量。放電電流や温度で利用可能容量は変化する。"},
{"c":"システム","q":"バッテリーの出力（W）に関する記述として、正しいものはどれか。","a":["出力を一定に維持しようとする場合、電池残量が少なくなると放電電圧が低下するため、必要な電流は増大する","出力を一定に保つ場合、電池残量が減ると必要な電流は減少する","出力は放電電圧のみで決まり、電流とは無関係である"],"ans":0,"ex":"出力＝放電電圧×電流。残量減で<b>放電電圧が低下</b>すると、同じ出力を保つには<b>電流が増大</b>する。"},
{"c":"システム","q":"満充電のリチウムポリマーバッテリーで無人航空機を急上昇させた直後に、バッテリー残量が減ったように見えることがある理由として、正しいものはどれか。","a":["大きな電流が流れたことで一時的な電圧低下が生じたため","急上昇によりバッテリー内部で化学的に容量が永久に失われたため","急上昇で機体が高高度に達し、気圧でバッテリーが消耗したため"],"ans":0,"ex":"大電流で<b>一時的な電圧低下</b>が起き残量が減ったように見えるだけで、実際の消耗ではない。LiPoの特性として押さえる。"},
{"c":"システム","q":"複数のセルで構成されたリチウムポリマーバッテリーの充電に関する記述として、正しいものはどれか。","a":["セル間の充電量のバランスを補正しながら充電することが重要で、バランスコネクタを充電器に接続する","セル間の電圧差は自然に解消されるため、バランスを気にする必要はない","バランスが崩れたまま充電するほうが、劣化を防ぐことができる"],"ans":0,"ex":"バランスが崩れたまま充電すると一部のセルが<b>過放電</b>となり急速に劣化する。<b>バランスコネクタ</b>を接続して充電する。"},
{"c":"システム","q":"エンジン機の燃料・エンジンに関する記述として、正しいものはどれか。","a":["エンジンにはガソリン・ディーゼル・ジェット・グローエンジンなどがあり、混合燃料を使う場合は指定された混合比で使用する","すべてのエンジンは同一の燃料を使用でき、混合比を気にする必要はない","電動機に比べエンジン機は騒音が小さいことがメリットである"],"ans":0,"ex":"エンジンは種類ごとに燃料や燃焼サイクルが異なり、混合燃料は<b>指定混合比</b>を守る。エンジン機は騒音が大きいのが特徴。"},
{"c":"システム","q":"無人航空機の動力源に関する記述として、正しいものはどれか。","a":["電動機は振動・騒音が少なく軽量化できるが飛行時間が短く、エンジン機は飛行時間が長く長距離飛行が可能だが騒音が大きい","電動機はエンジン機に比べ飛行時間が長く、長距離飛行に適している","エンジン機は電動機に比べ振動・騒音が小さいことがメリットである"],"ans":0,"ex":"<b>電動＝低騒音・軽量だが飛行時間短</b>、<b>エンジン＝長距離・長時間だが騒音大</b>。両者のメリット・デメリットは逆の関係にある。"},
{"c":"システム","q":"電波の減衰に関する記述として、正しいものはどれか。","a":["電波は進行距離の2乗に反比例して電力密度が減少し、進行距離が2倍になると電力密度は1/4になる","電波は進行距離に比例して電力密度が増加する","電波は水中でも減衰せず、そのまま伝わる"],"ans":0,"ex":"電力密度は<b>距離の2乗に反比例</b>（距離2倍で1/4）。また電波は<b>水中で吸収</b>され大きく減衰する。"},
{"c":"システム","q":"マルチパスに関する記述として、正しいものはどれか。","a":["反射・屈折により複数の経路を通って電波が伝搬する現象で、一時的に操縦不能になる要因の一つである","電波が全く反射・屈折せず、単一の経路のみを直進する現象である","マルチパスが発生すると通信が必ず改善し、操縦がしやすくなる"],"ans":0,"ex":"マルチパスは反射・屈折で<b>複数経路</b>を通り遅れが生じ、操縦不能の一因。復帰には送信機を<b>高い位置</b>に持ちアンテナ向きを変える。"},
{"c":"システム","q":"フレネルゾーンに関する記述として、正しいものはどれか。","a":["電力損失なく電波が到達するために必要な領域で、内部に障害物があると通信距離が短くなる","障害物が多いほど電波が強まる領域を指す","フレネルゾーンの半径は周波数が高いほど大きくなる"],"ans":0,"ex":"フレネルゾーンは<b>電力損失なく到達</b>するのに必要な楕円体の領域。内部に障害物があると受信電界強度が確保できず通信距離が短くなる。半径は周波数が高いほど小さい。"},
{"c":"システム","q":"無人航空機の運航で使用される電波の周波数帯に関する記述として、正しいものはどれか。","a":["169MHz帯は主に2.4GHz帯・5.7GHz帯の無人移動体画像伝送システムのバックアップ回線として使用される","無人航空機で使用される周波数帯は2.4GHz帯のみに限られる","169MHz帯は画像伝送のメイン回線として最も高速な通信に使われる"],"ans":0,"ex":"主な周波数帯は2.4GHz・5.7GHz・920MHz・73MHz・169MHz帯。<b>169MHz帯</b>は画像伝送システムの<b>バックアップ回線</b>用。"},
{"c":"システム","q":"電波の波長と特性の関係に関する記述として、正しいものはどれか。","a":["波長が短いほど直進性が強く情報伝達容量が大きくなるが、減衰しやすい","波長が短いほど直進性が弱く、減衰しにくくなる","波長が長いほど情報伝達容量が大きくなり、直進性も強くなる"],"ans":0,"ex":"<b>波長が短い＝直進性強・情報量大・減衰しやすい</b>、波長が長い＝直進性弱・情報量小・減衰しにくい、という関係。"},
{"c":"システム","q":"無人航空機に用いられる電波の周波数帯と用途に関する記述として、正しいものはどれか。","a":["マイクロ波は直進性が強く、衛星通信や無人航空機の画像伝送、無線LANなどに利用される","マイクロ波は直進性が弱いため、特定方向へ向けて発射する用途には適さない","極超短波は山や建物の陰にはまったく回り込めない"],"ans":0,"ex":"マイクロ波（3〜30GHz）は<b>直進性が強く情報量大</b>で衛星通信・画像伝送・無線LANに利用。極超短波は直進性が強いが多少の障害物には回り込める。"},
{"c":"システム","q":"電波環境の調査に関する記述として、正しいものはどれか。","a":["スペクトラムアナライザを用いて、同じ周波数の電波の使用状況や他機器からのノイズの有無を確認できる","スペクトラムアナライザは機体の重量を測定する装置である","市街地では無線局が少ないため、電波環境の調査は不要である"],"ans":0,"ex":"<b>スペクトラムアナライザ</b>で使用周波数の混雑やノイズを確認できる。無線局が散在する<b>市街地</b>では電波環境調査が特に重要。"},
{"c":"システム","q":"地磁気センサによる方位検出に影響を与えるものとして、正しいものはどれか。","a":["高圧線や変電所、鉄材を多く使用した建物、鉄道など、鉄や電流のあるもの","地磁気の検出に鉄や電流は影響を与えないため、鉄橋の上でも問題ない","影響を与えるのは磁石のみで、電流は方位検出に影響しない"],"ans":0,"ex":"地磁気検出には<b>鉄や電流</b>が影響。高圧線・変電所・電波塔・鉄材の多い建物・鉄道・自動車などの付近では方位が乱れる恐れがある。"},
{"c":"システム","q":"GNSSの測位精度に関する記述として、正しいものはどれか。","a":["一般に位置精度は水平方向に比べて高度方向の誤差が大きくなる","一般に位置精度は高度方向に比べて水平方向の誤差が大きくなる","水平方向と高度方向の誤差は常に等しい"],"ans":0,"ex":"GNSSは一般に<b>高度方向の誤差が水平方向より大きい</b>。衛星時計精度・捕捉衛星数・マルチパス・ノイズなども精度に影響する。"},
{"c":"システム","q":"送信機の電波の混信予防に関する記述として、正しいものはどれか。","a":["飛行前に測定器などで周辺の電波状態を確認し、無線LANやWi-Fi、高圧送電線の影響も考慮する","混信は送信機の電波同士でのみ起こり、無線LANやWi-Fiの影響を受けることはない","同じ周波数帯の電波が複数使用されていても、混信による誤作動は起こらない"],"ans":0,"ex":"同一周波数帯が複数使われる場所では<b>混信による誤作動</b>の恐れがあり、飛行前に測定器で確認する。無線LAN・Wi-Fi・高圧送電線の影響も受ける。"},
{"c":"システム","q":"夜間飛行における機体のビジョンセンサに関する記述として、正しいものはどれか。","a":["搭載されたビジョンセンサが夜間に対応していない場合、衝突回避・姿勢安定などの安全機能が使用できない可能性がある","ビジョンセンサは夜間でも常に昼間と同等に機能するため、夜間対応の確認は不要である","夜間はビジョンセンサの性能が向上するため、昼間より安全に飛行できる"],"ans":0,"ex":"ビジョンセンサが<b>夜間非対応</b>だと衝突回避・姿勢安定などの安全機能が使えない恐れがある。夜間は障害物が視認しにくいため地上照明も当てる。"},
{"c":"運航体制","q":"無人航空機の安全運航のための点検プロセスにおける「飛行前の点検」の位置づけとして、正しいものはどれか。","a":["機体を飛行させる前に都度行うべき最終点検であり、バッテリーや機体の異常を確認する","当日の最初の1回だけ行えばよく、以降の飛行では省略できる","国が一律に定めた項目のみで行い、機体メーカーの指示は考慮しない"],"ans":0,"ex":"飛行前の点検は<b>飛行のたびに都度</b>実施する最終点検である。点検プロセスは<b>機体メーカーの指示</b>に従って設定・実施する。"},
{"c":"運航体制","q":"「運航終了後の点検」で行うべき事項として、最も適切なものはどれか。","a":["機体やバッテリーを安全に保管するための点検や、飛行日誌の作成を行う","飛行中に異常事態が発生した際の危機回避行動を確認する","着陸直後にその場で各部品の摩耗状態を確認する"],"ans":0,"ex":"運航終了後の点検では<b>安全な保管</b>と<b>飛行日誌の作成</b>を行う。危機回避行動は異常事態発生時の点検、部品摩耗の確認は飛行後の点検である。"},
{"c":"運航体制","q":"CRMで取り入れられているTEM(Threat and Error Management)に関する記述のうち、正しいものはどれか。","a":["スレットはエラーを誘発する要因であり、放置するとUAS(望ましくない航空機の状態)に至るおそれがある","スレットとは操縦者が意図的に起こす操作ミスのことをいう","UASに至った時点で必ず事故となり、そこからの回復は不可能である"],"ans":0,"ex":"<b>スレット</b>(気象変化・疲労・機材不具合等)が<b>エラー</b>を誘発し、放置すると安全マージンの低下した<b>UAS</b>に至る。TEMは早期に把握・管理して事故を防ぐ手法である。"},
{"c":"運航体制","q":"TEMを効果的に実践するための5つのCRMスキル(ノンテクニカルスキル)の組合せとして、正しいものはどれか。","a":["状況認識、意思決定、ワークロード管理、チームワーク、コミュニケーション","操縦技量、機体整備、法令知識、体力、視力","状況認識、操縦技量、機体設計、気象予報、無線技術"],"ans":0,"ex":"5つのCRMスキルは<b>状況認識・意思決定・ワークロード管理・チームワーク・コミュニケーション</b>である。操縦技量はテクニカルスキルであり、これとは別の概念とされる。"},
{"c":"運航体制","q":"ガソリンエンジンで駆動する機体の取扱いに関する記述のうち、正しいものはどれか。","a":["ガソリンは危険物に該当し、乗用車等で運搬する場合は消防法で定められた22リットル以下の専用容器で運搬する","ガソリンは危険物に該当しないため、容器の指定なく運搬してよい","エンジン駆動は振動が小さいため、ネジ類の点検は特に必要ない"],"ans":0,"ex":"ガソリンは危険物のため<b>22リットル以下の専用容器</b>で運搬する。エンジン機は<b>機体の振動が大きい</b>ため、ネジ類の緩みを特に注意して点検する必要がある。"},
{"c":"運航体制","q":"ペイロードを搭載あるいは物件投下を行う際の注意事項として、正しいものはどれか。","a":["投下場所に補助者を配置しない場合、物件投下時の高度は原則1m以内とする","補助者を配置しない場合、物件投下時の高度は原則30m以内とする","物件投下は補助者の有無にかかわらず高度の制限はない"],"ans":0,"ex":"補助者を配置しない物件投下は<b>原則1m以内</b>の高度で行う。投下は搭載物や落下の安全に特に配慮が必要である。"},
{"c":"運航体制","q":"手動操縦におけるヒューマンエラーの傾向に関する記述のうち、正しいものはどれか。","a":["操縦者の視線と機体の正面方向が異なる場合に、意図しない方向へ飛行しやすい","手動操縦は自動操縦より常に安全で、意図しない飛行は起こらない","機体と操縦者の距離が離れるほど、障害物との距離差は掴みやすくなる"],"ans":0,"ex":"手動操縦は<b>視線と機体正面が異なる</b>と誤操作が起きやすく、距離が離れると<b>障害物との距離差が掴みにくく</b>なる。あらゆる方向に向けても意図通り制御できる訓練が有効。"},
{"c":"運航体制","q":"自動操縦におけるヒューマンエラーの傾向に関する記述のうち、正しいものはどれか。","a":["ウェイポイント設定時に飛行経路上の障害物の確認が不足すると、衝突や墜落が起こりうる","経路が自動生成されるため、障害物の事前確認は不要である","自動操縦中は人が一切関与できず、カメラ操作もできない"],"ans":0,"ex":"自動操縦では<b>ウェイポイント設定時の障害物確認不足</b>が衝突・墜落の原因となるため、経路上の障害物は<b>事前に現地確認</b>する。飛行は自動でカメラのみ手動という複合操縦も可能。"},
{"c":"運航体制","q":"自動操縦から手動操縦へ切り替える際の注意点として、最も適切なものはどれか。","a":["急な飛行速度の低下や失速に備え、機体方向の確認やホバリングでの安定・安全確認を行う","切り替えた直後は機体が最も安定するため、確認は不要である","一度自動操縦を開始したら、いかなる場合も手動へ切り替えてはならない"],"ans":0,"ex":"作業指示や不安定な飛行と判断した場合に手動へ切り替える。切替後は<b>失速への備え</b>や<b>機体方向・安定の確認</b>を行い、速やかに切り替えられる体制を整えておく。"},
{"c":"運航体制","q":"手動操縦の特徴に関する記述のうち、正しいものはどれか。","a":["GNSS受信機や電子コンパス等が機能不全に陥ったときの危険回避には、手動操縦が求められる","定められた航路を高精度に飛行する高い再現性が求められる操縦に適している","操縦者の習熟度に関わらず、飛行の安定性は常に一定である"],"ans":0,"ex":"手動操縦は<b>センサ機能不全時の危険回避</b>に必要である。一方で<b>高い再現性を求める飛行には不向き</b>で、安定性は操縦技量によって差が生じる。"},
{"c":"運航体制","q":"機体のフェールセーフ機能の動作に関する記述のうち、正しいものはどれか。","a":["送信電波や電源容量の減少時に自動帰還モードへ切り替わり、バッテリー残量が極端に少ない場合はその場で自動着陸を試みる","必ず離陸地点まで戻り、途中で着陸に移行することはない","バッテリー切れを検知できないため、電源管理とは無関係である"],"ans":0,"ex":"フェールセーフは<b>自動帰還</b>へ移行し、飛行を継続できない場合は<b>その場で自動着陸</b>を試みる。ホバリング・その場着陸・自動帰還を設定できる機体もある。"},
{"c":"運航体制","q":"無人航空機の緊急時の対応方針として、最も適切なものはどれか。","a":["離陸地点に戻すことを前提とせず、速やかに近くの安全な無人地帯へ不時着させる","状況にかかわらず、必ず離陸地点まで戻すことを最優先とする","第三者がいる場所であっても、最短距離の地点へ着陸させる"],"ans":0,"ex":"緊急時は<b>離陸地点への帰還を前提とせず</b>、近くの<b>安全な無人地帯</b>へ速やかに不時着させる。事故発生時は直ちに飛行を中止し救護・通報等の措置をとる。"},
{"c":"運航体制","q":"安全を確保するための運航体制における「安全管理者(運航管理者)」に関する記述のうち、最も適切なものはどれか。","a":["操縦と安全管理の役割を分割する目的で、操縦者に加えて配置することが望ましい","操縦者と同一人物が兼務することが原則とされている","機体の設計・製造を担当する技術者を指す"],"ans":0,"ex":"安全な運航体制として、<b>操縦と安全管理の役割分割</b>を目的に、操縦者とは別に<b>安全管理者(運航管理者)</b>を配置することが望ましいとされる。"},
{"c":"運航体制","q":"カテゴリーIII飛行を行う操縦者に関する記述のうち、正しいものはどれか。","a":["リスクの高い飛行を行う責任を自覚し、運航の中心的な役割を果たさなければならない","運航管理は組織が行うため、操縦者は操作のみに専念すればよい","二等技能証明でも運航管理体制があれば実施できる"],"ans":0,"ex":"カテゴリーIII飛行では操縦者が<b>一等技能証明</b>を取得し、無人航空機を飛行させる者として<b>運航の中心的役割</b>と責任を担う。運航管理体制の構築が求められる。"},
{"c":"運航体制","q":"安全な運航における補助者の役割に関する記述のうち、最も適切なものはどれか。","a":["飛行経路周辺の地上・空域の安全確認や第三者の立入管理を主として行う","操縦者と同時に機体を操縦し、操縦を交代する役割を担う","操縦者との連絡は、状況に応じてその場で任意の手段を選んで行う"],"ans":0,"ex":"操縦者は操縦に集中するため、<b>安全確認や第三者の立入管理</b>は補助者が主として担う。操縦者との連絡は<b>予め決められた手段</b>を用いて行う。"},
{"c":"リスク・気象","q":"リスク評価ガイドラインのセマンティックモデルにおける「想定外飛行空間」の説明として、正しいものはどれか。","a":["機体や外部システムの異常・外乱の影響で想定飛行空間を外れて飛行することに備えて確保する空間である","通常の飛行で使用する経路そのものを指す空間である","想定飛行空間と全く同一で、区別する必要のない空間である"],"ans":0,"ex":"正常運航に使う<b>想定飛行空間</b>に対し、異常時に復旧するため確保するのが<b>想定外飛行空間</b>。両者を合わせたものがオペレーション空間である。"},
{"c":"リスク・気象","q":"安全確保措置に必要とされる「ロバスト性」の評価に関する記述のうち、正しいものはどれか。","a":["安全性の水準と保証の水準の双方を勘案し、低い方に準じて評価する","安全性の水準のみで評価し、保証の水準は考慮しない","安全性が中レベルであれば、保証が低レベルでも中レベルと評価される"],"ans":0,"ex":"ロバスト性は<b>安全性の水準</b>と<b>保証の水準</b>の<b>低い方</b>に準じて評価する。中の安全性が低の保証で実施された場合、その措置は低と評価される。"},
{"c":"リスク・気象","q":"カテゴリーIII飛行で推奨されるリスク評価ガイドラインによるリスク評価手法に関する記述のうち、正しいものはどれか。","a":["JARUSのSORAを参考に作成されており、6つのステップで構成される","日本独自の手法であり、国際的な枠組みとは全く無関係である","運航計画(CONOPS)の説明を省略し、地上リスクの評価から開始する"],"ans":0,"ex":"リスク評価ガイドラインは<b>JARUSのSORA</b>を参考にした<b>6ステップ</b>の手法で、Step1の運航計画(CONOPS)の説明から始まる。"},
{"c":"リスク・気象","q":"空中リスクを低減するための「戦略的対策」と「戦術的対策」の違いとして、正しいものはどれか。","a":["戦略的対策は飛行前に遭遇確率を下げる対策、戦術的対策は飛行中に衝突を回避する対策である","戦略的対策は飛行中に行い、戦術的対策は飛行前に行う対策である","いずれも地上リスクを低減するための対策である"],"ans":0,"ex":"<b>戦略的対策</b>は飛行前に遭遇確率やリスク時間を下げる対策(時間帯・境界の限定等)、<b>戦術的対策</b>は飛行中に航空機との衝突を回避する対策である。"},
{"c":"リスク・気象","q":"無人航空機の運航における発生事象の「リスク」の計量方法として、正しいものはどれか。","a":["予測される頻度(被害の発生確率)と結果の重大性(被害の大きさ)により計量する","被害の大きさのみで決まり、発生確率は関係しない","操縦者の技量のみで決まる固定された値である"],"ans":0,"ex":"リスクは<b>頻度(発生確率)</b>と<b>結果の重大性(被害の大きさ)</b>で計量する。低減には発生確率を下げるか、被害を軽減するかの両面を検討する。"},
{"c":"リスク・気象","q":"カテゴリーIII飛行における機体選定のリスク軽減策として、適切なものはどれか。","a":["必要最低限より多くのプロペラ・モーターを備える冗長性や、パラシュートによる衝撃軽減機能が有効である","冗長性は重量が増すため、プロペラ数は必要最小限にすべきである","パラシュートは機体保護用であり、地上被害の軽減には役立たない"],"ans":0,"ex":"機体選定では<b>冗長性</b>(多くのプロペラ・モーター)で墜落確率を下げ、<b>パラシュート</b>で落下時の衝撃エネルギーを軽減して地上被害を抑える。"},
{"c":"リスク・気象","q":"温暖前線の通過に伴う天気の特徴として、正しいものはどれか。","a":["層状の厚い雲が段々と広がり、弱い雨が絶え間なく降り、通過後は風が南寄りに変わる","発達した積乱雲により突風や雷を伴い、短時間で断続的に強い雨が降る","気団の勢力が変わらず同じ位置に留まり、長雨をもたらす"],"ans":0,"ex":"<b>温暖前線</b>は層状雲で<b>弱い雨が絶え間なく</b>降り、通過後は南寄りの風に変わる。積乱雲・突風・強雨は寒冷前線、長雨は停滞前線の特徴。"},
{"c":"リスク・気象","q":"停滞前線に関する記述のうち、正しいものはどれか。","a":["気団同士の勢力が変わらずほぼ同じ位置に留まる前線で、梅雨前線や秋雨前線がこれにあたる","寒冷前線が温暖前線に追いついてできる前線である","短時間で通過し、通過後に急激な気温低下をもたらす前線である"],"ans":0,"ex":"<b>停滞前線</b>は勢力が拮抗して留まる前線で<b>長雨</b>をもたらす。梅雨前線・秋雨前線が代表例。寒冷前線が温暖前線に追いつくのは閉塞前線。"},
{"c":"リスク・気象","q":"10種雲形と降水の傾向に関する記述のうち、正しいものはどれか。","a":["層雲系の雲では連続的な降水が、積雲系の雲では断続的でしゅう雨性の降水を伴う傾向がある","層雲系の雲では断続的なしゅう雨が、積雲系では連続的な降水となる","10種雲形はすべて上層雲に分類される"],"ans":0,"ex":"雲は<b>10種雲形</b>に分類され、<b>層雲系は連続的な降水</b>、<b>積雲系は断続的なしゅう雨性の降水</b>を伴う傾向がある。積乱雲は下層から発達する雲である。"},
{"c":"リスク・気象","q":"マイクロバーストに関する記述のうち、正しいものはどれか。","a":["直径4km程度以下の下降流で、範囲は小さいが下降流はダウンバーストより強烈なことがある","ダウンバーストより大規模で、直径は10kmを超える","晴天時のみに発生し、積乱雲とは無関係である"],"ans":0,"ex":"<b>マイクロバースト</b>は直径<b>4km程度以下</b>で範囲は小さいが下降流が強烈なことがある。積乱雲等の下降流が地表にぶつかり広がるのがダウンバースト。"},
{"c":"リスク・気象","q":"気圧および等圧線に関する記述のうち、正しいものはどれか。","a":["気圧の単位はヘクトパスカル(hPa)で、標準大気圧(1気圧)は1013hPaである","気圧の単位はメートル毎秒(m/s)で、標準大気圧は360hPaである","等圧線の間隔が広いほど風は強く吹く"],"ans":0,"ex":"気圧の単位は<b>hPa</b>で、標準大気圧は<b>1013hPa</b>。等圧線の間隔が<b>狭いほど風は強く</b>吹く。"},
{"c":"リスク・気象","q":"風力の表し方に関する記述のうち、正しいものはどれか。","a":["気象庁風力階級表(ビューフォート風力階級)により、風力0から12までの13階級で表す","0から16までの17方位で表す","風速と同じ意味で、単位はいずれもm/sである"],"ans":0,"ex":"風力は<b>ビューフォート風力階級</b>で<b>0〜12の13階級</b>で表す。風速はm/sで表す空気の動く速さであり、風力とは別の概念である。"},
{"c":"リスク・気象","q":"飛行機(固定翼機)の運航の特徴に関する記述のうち、正しいものはどれか。","a":["ホバリングができないため、上空待機はサークルを描くように旋回飛行を行う","回転翼航空機と同様にホバリングして上空待機ができる","離着陸は追い風方向で行うのが原則である"],"ans":0,"ex":"飛行機は<b>ホバリングができず</b>、上空待機は<b>旋回飛行</b>で行う。回転翼機より最小旋回半径が大きく、離着陸は<b>向かい風</b>が原則(追い風は失速の危険)。"},
{"c":"リスク・気象","q":"雲や霧が発生している気象状態での飛行に関する記述のうち、正しいものはどれか。","a":["雲中や濃霧など、機体や他物件との距離を目視で確認できない気象状態では飛行させてはならない","近距離であれば、雲中や濃霧の中でも飛行させてよい","目視義務は距離のみの規定であり、視程が悪くても距離内なら飛行できる"],"ans":0,"ex":"航空法は<b>周囲の状況の常時目視監視</b>を求めており、雲中・濃霧など<b>目視で安全な距離を確認できない気象状態</b>では、近距離でも飛行させてはならない。"},
{"c":"計算問題","q":"速度15m/sを時速(km/h)に換算するといくらか。","a":["54km/h","4.2km/h","150km/h"],"ans":0,"ex":"m/sをkm/hにするには×3.6。15×3.6=<b>54km/h</b>。÷3.6(4.2)は逆の換算、×10(150)は誤り。"},
{"c":"計算問題","q":"時速72kmで飛行する無人航空機が1200m移動するのに要する時間はおよそ何秒か。","a":["60秒","16.7秒","100秒"],"ans":0,"ex":"72km/h÷3.6=20m/s。1200m÷20m/s=<b>60秒</b>。換算し忘れると1200÷72=16.7秒となり誤り。"},
{"c":"計算問題","q":"対気速度15m/sで飛行中、正面から5m/sの向かい風を受けながら2km移動する場合の所要時間はいくらか。","a":["200秒","133秒","100秒"],"ans":0,"ex":"対地速度=15−5=10m/s。2000m÷10=<b>200秒</b>。風を無視すると2000÷15=133秒、追い風と誤ると2000÷20=100秒。"},
{"c":"計算問題","q":"対気速度12m/sの機体が3m/sの追い風を受けて2分間飛行したときの移動距離はいくらか。","a":["1800m","1440m","1080m"],"ans":0,"ex":"対地速度=12+3=15m/s、2分=120秒。15×120=<b>1800m</b>。風を無視すると12×120=1440m、向かい風と誤ると9×120=1080m。"},
{"c":"計算問題","q":"対気速度20m/sの機体が、風速5m/sの一定風の中で片道600mを往復する場合の合計所要時間はおよそいくらか。","a":["64秒","60秒","80秒"],"ans":0,"ex":"往路は向かい風で対地15m/s→600÷15=40秒、復路は追い風で対地25m/s→600÷25=24秒。合計<b>64秒</b>。風無視なら1200÷20=60秒。"},
{"c":"計算問題","q":"容量10000mAh(10Ah)のバッテリーを平均電流25Aで使用し、容量の80%まで使えるとした場合の飛行可能時間はおよそ何分か。","a":["19.2分","24分","32分"],"ans":0,"ex":"使用可能容量=10×0.8=8Ah。8÷25=0.32時間、×60=<b>19.2分</b>。80%を忘れると10÷25×60=24分。"},
{"c":"計算問題","q":"電圧44.4Vのバッテリーで平均電流25Aが流れているときの消費電力はおよそいくらか。","a":["1110W","555W","69W"],"ans":0,"ex":"P=V×I=44.4×25=<b>1110W</b>。半分の電圧22.2Vで計算すると555W、電圧と電流を足すと69Wで誤り。"},
{"c":"計算問題","q":"公称電圧22.2V・容量3Ah(3000mAh)のバッテリーの電力量はおよそいくらか。","a":["66.6Wh","25.2Wh","133.2Wh"],"ans":0,"ex":"電力量Wh=V×Ah=22.2×3=<b>66.6Wh</b>。電圧と容量を足すと25.2、容量を2倍にすると133.2で誤り。"},
{"c":"計算問題","q":"公称電圧3.7Vのリチウムポリマーバッテリーセルを6本直列(6S)にした場合の公称電圧はいくらか。","a":["22.2V","11.1V","3.7V"],"ans":0,"ex":"直列は電圧が加算される。3.7×6=<b>22.2V</b>。3本(3S)なら11.1V、直列で電圧が変わらないとすると3.7Vで誤り。"},
{"c":"計算問題","q":"容量3000mAhのバッテリー3本を並列に接続した場合の合成容量はいくらか。","a":["9000mAh","3000mAh","1000mAh"],"ans":0,"ex":"並列は容量が加算される。3000×3=<b>9000mAh</b>。並列で容量が変わらないとすると3000mAh、割ると1000mAhで誤り。"},
{"c":"計算問題","q":"公称電圧3.7Vのセルを3本直列・2並列(3S2P)に構成したバッテリーパックの公称電圧はいくらか。","a":["11.1V","22.2V","7.4V"],"ans":0,"ex":"電圧は直列数で決まり、並列は電圧に影響しない。3.7×3=<b>11.1V</b>。全6セルを直列と誤ると22.2V、2S分だと7.4V。"},
{"c":"計算問題","q":"総重量3kgの機体がホバリングするために必要な推力はおよそ何Nか(重力加速度9.8m/s²)。","a":["29.4N","3N","294N"],"ans":0,"ex":"必要推力=質量×重力加速度=3×9.8=<b>29.4N</b>。重力加速度を掛け忘れると3N、桁を誤ると294Nになる。"},
{"c":"計算問題","q":"1基あたり2kgfの推力を出すロータを4基備えた総重量2kgの機体の推力重量比はいくらか。","a":["4","2","16"],"ans":0,"ex":"総推力=2kgf×4=8kgf。推力重量比=総推力÷機体重量=8÷2=<b>4</b>。ロータ1基分で割ると2、掛けると16で誤り。"},
{"c":"計算問題","q":"質量4kgの機体が速度15m/sで飛行しているときの運動エネルギーはいくらか。","a":["450J","30J","900J"],"ans":0,"ex":"運動エネルギー=1/2×m×v²=0.5×4×15²=0.5×4×225=<b>450J</b>。2乗し忘れると0.5×4×15=30J、1/2を忘れると900J。"},
{"c":"計算問題","q":"質量2kgの機体が速度5m/sで飛ぶときの運動エネルギーは25Jである。同じ機体が速度10m/sで飛ぶときの運動エネルギーはいくらか。","a":["100J","50J","25J"],"ans":0,"ex":"運動エネルギーは速度の2乗に比例するので、速度2倍でエネルギーは4倍。25×4=<b>100J</b>。速度と同じく2倍とすると50J。"},
{"c":"計算問題","q":"地上の気温が28℃のとき、高度500m付近の気温はおよそ何℃か(気温減率0.65℃/100m)。","a":["24.8℃","27.4℃","21.5℃"],"ans":0,"ex":"低下量=0.65×(500÷100)=0.65×5=3.25℃。28−3.25≒<b>24.8℃</b>。100mぶんだけ引くと27.4℃、1000mぶんだと21.5℃で誤り。"},
{"c":"計算問題","q":"容量5000mAh(5Ah)で25Cのリチウムポリマーバッテリーの最大放電電流はおよそいくらか。","a":["125A","30A","5A"],"ans":0,"ex":"最大放電電流=Cレート×容量(Ah)=25×5=<b>125A</b>。容量とCを足すと30A、1C相当と誤ると5A。"},
{"c":"計算問題","q":"容量6Ah(6000mAh)のバッテリーを3Aの一定電流で充電する場合、満充電までのおよその時間はどれか(充電効率は考えない)。","a":["120分","180分","60分"],"ans":0,"ex":"充電時間=容量÷充電電流=6÷3=2時間=<b>120分</b>。2Aで計算すると180分、1時間と誤ると60分。"},
{"c":"計算問題","q":"上昇速度4m/sで高度200mまで上昇するのに要する時間はいくらか。","a":["50秒","800秒","20秒"],"ans":0,"ex":"時間=高度÷上昇速度=200÷4=<b>50秒</b>。掛けると200×4=800秒、上昇速度を10m/sと誤ると20秒。"},
{"c":"計算問題","q":"消費電力888Wで飛行している機体の電圧が22.2Vのとき、流れている電流はおよそ何Aか。","a":["40A","20A","4A"],"ans":0,"ex":"電流I=電力P÷電圧V=888÷22.2=<b>40A</b>。電圧を2倍の44.4Vと誤ると20A、222Vと桁を誤ると4A。"}

{"c":"原論・基礎","q":"北緯35度の地点における夏至の日について、終日快晴であった場合、1日に受ける直達日射量が最も大きくなる鉛直面として、適当なものはどれか。","a":["東向きの鉛直面","南向きの鉛直面","北東向きの鉛直面","北向きの鉛直面"],"ans":0,"ex":"【1級R8出題論点】夏至は太陽高度が高いため<b>南向き鉛直面</b>の直達日射は意外に少なく、<b>東向き(西向き)鉛直面</b>が午前(午後)に低い高度の太陽から多量の直達日射を受けて終日量が最大となる。北向きは最小。「夏至=南面が最大」と思い込むのがひっかけ。"},
{"c":"原論・基礎","q":"円形ダクト内を空気が流れるとき、ダルシー・ワイスバッハの式によれば単位長さ当たりの摩擦圧力損失は λ・v²/d に比例する(λ:摩擦係数、v:平均風速、d:内径)。次の条件のうち、単位長さ当たりの圧力損失が最も大きくなるものはどれか。","a":["λ=0.03、d=200mm、v=1.5m/s","λ=0.02、d=200mm、v=1.0m/s","λ=0.02、d=300mm、v=1.5m/s","λ=0.03、d=300mm、v=1.0m/s"],"ans":0,"ex":"【1級R8出題論点】ΔP/L=λ/d・ρv²/2 なので <b>λv²/d</b> を比較する。λ0.03・v1.5・d200は0.03×2.25/200=<b>3.4×10⁻⁴</b>で最大、他は1.0×10⁻⁴、1.5×10⁻⁴、1.0×10⁻⁴。風速は<b>二乗</b>で効くこと、径は分母に入ることがポイント。"},
{"c":"原論・基礎","q":"内径300mmの円形ダクトを風速3m/sで空気が流れている。このダクトが内径150mmに縮小した断面における風速として、適当なものはどれか。ただし、空気は非圧縮性とし、途中の漏れはないものとする。","a":["12m/s","6m/s","3m/s","1.5m/s"],"ans":0,"ex":"【1級R8出題論点】連続の式 A₁v₁=A₂v₂ より、径が1/2になると断面積は<b>1/4</b>になり、風速は<b>4倍</b>の12m/sとなる。径比だけで2倍(6m/s)としてしまうのが典型的な誤り。"},
{"c":"原論・基礎","q":"流体に関する記述のうち、適当でないものはどれか。","a":["ポンプを含む配管系において、外部から強制的な作用がないにもかかわらず流量や圧力が周期的に変動する現象をウォーターハンマーという。","ベルヌーイの定理は、理想流体の定常流において、流線に沿って運動エネルギー・圧力エネルギー・位置エネルギーの総和が一定であることを表す。","レイノルズ数は慣性力と粘性力の比で表され、流れが層流か乱流かを判定する指標となる。","流体の圧力が局部的にその温度の飽和蒸気圧以下に低下し、気泡が発生する現象をキャビテーションという。"],"ans":0,"ex":"【1級R8出題論点】外力がないのに流量・圧力が周期的に変動する現象は<b>サージング</b>であり、<b>ウォーターハンマー</b>は弁急閉等で流速が急変し圧力が急上昇する現象。サージング・ウォーターハンマー・キャビテーションの3つの定義のすり替えが頻出。"},
{"c":"原論・基礎","q":"熱に関する記述のうち、適当でないものはどれか。","a":["カルノーサイクルの理論熱効率は、高温熱源と低温熱源の絶対温度の比の二乗に比例する。","断熱状態で不可逆変化が起こると、系のエントロピーは増加する。","ペルチェ効果とは、異種金属を接合した回路に直流を流すと、一方の接合部が冷却され他方が加熱される現象である。","理想気体の定圧比熱は、定容比熱より大きい。"],"ans":0,"ex":"【1級R8出題論点】カルノーサイクルの熱効率は <b>η=1−T_L/T_H</b>(絶対温度の比)で定まり、「二乗」ではない。定圧比熱cpは定容比熱cvより気体定数R分だけ大きい(<b>cp=cv+R</b>)。"},
{"c":"原論・基礎","q":"面積2m²、厚さ0.5mの均質な平面壁の両面に4Kの温度差があり、定常状態で5秒間に80Jの熱が伝導した。この壁材の熱伝導率として、適当なものはどれか。","a":["1.0 W/(m・K)","0.5 W/(m・K)","2.0 W/(m・K)","4.0 W/(m・K)"],"ans":0,"ex":"【1級R8出題論点】フーリエの法則 Q=λ・A・ΔT・t/d より <b>λ=Q・d/(A・ΔT・t)</b>=80×0.5/(2×4×5)=<b>1.0W/(m・K)</b>。熱量Jを時間で割って熱流W(16W)にしてから計算する手順を忘れないこと。"},
{"c":"原論・基礎","q":"壁体の表面結露に関する記述のうち、適当でないものはどれか。","a":["外壁に断熱材を施して熱通過率を小さくすると、室内側壁表面温度が下がり、表面結露が生じやすくなる。","外壁が2面に接する室の隅角部は、壁中央部に比べて表面結露が生じやすい。","天井吹出しの温風暖房を行う室では、暖気が上部に滞留するため床付近の壁面で表面結露が生じやすい。","室内の空気の流動が少ない場所ほど、表面結露が生じやすい。"],"ans":0,"ex":"【1級R8出題論点】断熱材で<b>熱通過率を小さく</b>すると室内側表面温度は<b>上がり</b>、表面結露は<b>生じにくく</b>なる。隅角部(熱橋)、空気の停滞、温風暖房時の床付近は結露しやすい代表例として覚える。"},
{"c":"原論・基礎","q":"音・振動・腐食に関する記述のうち、適当でないものはどれか。","a":["振動数の低い振動を防振する場合、金属ばねよりも防振ゴムのほうが適している。","NC曲線では、周波数が高い帯域ほど許容される音圧レベルが小さい。","水中における鉄の腐食速度は、水温の影響を受ける。","異種金属が接触して電池を形成した場合、イオン化傾向の大きい金属のほうが腐食する。"],"ans":0,"ex":"【1級R8出題論点】<b>低振動数</b>の防振には固有振動数を低くできる<b>金属ばね(コイルばね)</b>が適し、防振ゴムは比較的高い振動数向き。NC曲線は高周波ほど許容音圧レベルが小さい(厳しい)。"},
{"c":"原論・基礎","q":"三相誘導電動機の保護に用いる2Eリレーが保護の対象とする要素の組合せとして、適当なものはどれか。","a":["過負荷及び欠相","過負荷及び短絡","欠相及び反相","短絡及び反相"],"ans":0,"ex":"【1級R8出題論点】<b>2Eリレー=過負荷+欠相</b>、<b>3Eリレー=過負荷+欠相+反相(逆相)</b>。短絡保護は配線用遮断器(MCCB)の役割であり、Eリレーの要素には含まれない。"},
{"c":"原論・基礎","q":"乾燥した場所であって点検できない隠ぺい場所に施設する低圧屋内配線の工事方法として、適当でないものはどれか。","a":["ライティングダクト工事","合成樹脂管工事","ケーブル工事","金属可とう電線管工事"],"ans":0,"ex":"【1級R8出題論点】<b>ライティングダクト工事</b>は展開した乾燥場所・点検できる隠ぺい場所に限られ、<b>点検できない隠ぺい場所</b>には施設できない。合成樹脂管・金属管・2種金属可とう電線管・ケーブル工事はどの場所でも施設可。"},
{"c":"原論・基礎","q":"鉄筋コンクリート造の建築物に関する記述のうち、適当でないものはどれか。","a":["ラーメン構造では、柱と梁の接合部をピン接合として水平力に抵抗させる。","耐震壁は、建築物の平面上・立面上でバランスよく配置する。","鉄筋とコンクリートの線膨張係数はほぼ等しいため、温度変化による応力が生じにくい。","建築物は、自重・積載荷重・積雪・風圧・地震等の荷重及び外力に対して安全な構造としなければならない。"],"ans":0,"ex":"【1級R8出題論点】ラーメン構造は柱梁接合部を<b>剛接合</b>として曲げに抵抗させる構造で、ピン接合はトラス等の考え方。線膨張係数が<b>ほぼ等しい(約1×10⁻⁵/℃)</b>ことがRC造成立の前提。"},
{"c":"原論・基礎","q":"鉄筋コンクリート造の梁に関する記述のうち、適当でないものはどれか。","a":["梁に設ける貫通孔の径は、梁せいの1/2以下とする。","主筋は、部材の材軸方向に配置する鉄筋である。","貫通孔を並列して設ける場合、その中心間隔は両孔径の平均値の3倍以上とする。","引張側のみに主筋を配した梁を単筋梁、引張側と圧縮側の両方に配した梁を複筋梁という。"],"ans":0,"ex":"【1級R8出題論点】梁貫通孔の径は<b>梁せいの1/3以下</b>が原則(1/2は誤り)。並列孔の中心間隔は<b>孔径平均の3倍以上</b>。設備配管用スリーブで必ず関わる数値なので確実に。"},
{"c":"空調","q":"省エネルギーを考慮した空気調和計画に関する記述のうち、適当でないものはどれか。","a":["予冷・予熱時は、外気を最大限に取り入れて室内を速やかに設定温度に近づける。","室内のCO₂濃度を検出して外気導入量を制御する。","熱源機器の容量を分割し、負荷に応じた台数制御を行う。","冷温水の大温度差送水とし、搬送ポンプの動力を削減する。"],"ans":0,"ex":"【1級R8出題論点】予冷・予熱時は在室者がいないため<b>外気導入を停止(外気カット)</b>して立上り負荷を減らすのが省エネの基本。CO₂制御・台数制御・大温度差搬送は代表的な省エネ手法。"},
{"c":"空調","q":"空気調和方式に関する記述のうち、適当でないものはどれか。","a":["床吹出し空調方式は、暖房時に居住域の上下温度差が大きくなりやすい。","定風量単一ダクト方式は、負荷パターンの異なる複数の室を1系統で処理すると室間に温度のアンバランスが生じやすい。","ペリメーター空気処理方式は、窓際のコールドドラフト防止に有効である。","変風量(VAV)ユニット方式は、試運転時の風量調整が比較的容易である。"],"ans":0,"ex":"【1級R8出題論点】床吹出し方式は<b>冷房時</b>に冷気が床付近に溜まり上下温度差が大きくなりやすい方式で、暖房時は温風が自然に上昇するため温度分布が良い。CAVの室間アンバランス、VAVの風量調整容易性も定番。"},
{"c":"空調","q":"変風量(VAV)単一ダクト方式の自動制御において、制御対象機器とその検出要素の組合せとして、適当でないものはどれか。","a":["給気送風機の回転数 ―― 外気温度","冷温水コイルの制御弁 ―― 給気温度","加湿器 ―― 還気湿度","VAVユニット ―― 室内温度"],"ans":0,"ex":"【1級R8出題論点】VAV方式の給気送風機は各ユニットの絞りに応じて<b>給気ダクト内の静圧</b>を検出して回転数(インバータ)制御する。外気温度は外気冷房やコイル制御の補助であり送風機制御の検出要素ではない。"},
{"c":"空調","q":"空気調和の熱負荷に関する記述のうち、適当でないものはどれか。","a":["冷房負荷計算において、窓ガラスを通過する熱負荷は日射による熱取得のみを考慮すればよい。","暖房負荷計算では、土間床や地中壁からの熱損失を見込む。","人体からの発熱は、室温が上昇すると顕熱分が減少し潜熱分が増加するが、全発熱量はほぼ一定である。","日射及び夜間放射の影響を受ける外壁の貫流熱負荷は、実効温度差を用いて計算する。"],"ans":0,"ex":"【1級R8出題論点】窓ガラスの冷房負荷は<b>日射熱取得</b>と室内外温度差による<b>貫流熱</b>の<b>両方</b>を考慮する。外壁・屋根は日射・夜間放射を含めた<b>実効温度差(ETD)</b>で計算する。"},
{"c":"空調","q":"地域冷暖房に関する記述のうち、適当でないものはどれか。","a":["負荷の平準化のため、冷暖房の使用時間帯が同じ需要者を集めることが望ましい。","需要者側では熱源設備が不要となり、建物の床面積の利用率が高まる。","発電設備を併設すれば、その排熱を熱源として利用できる。","熱源プラントで製造した冷水・温水・蒸気を、配管を通じて複数の建物に供給する。"],"ans":0,"ex":"【1級R8出題論点】地域冷暖房では使用時間帯の<b>異なる</b>需要者(事務所と住宅・ホテル等)を組み合わせることで<b>負荷を平準化</b>し、熱源容量を小さくできる。「同じ時間帯」は逆。"},
{"c":"空調","q":"蓄熱方式に関する記述のうち、適当でないものはどれか。","a":["水蓄熱槽の二次側配管を開放回路とすると、密閉回路とした場合よりポンプ揚程が小さくなる。","蓄熱により昼間のピーク負荷をカットでき、熱源機器の容量を低減できる。","水蓄熱槽には、完全混合型と温度成層型がある。","氷蓄熱は氷の融解潜熱を利用するため、水蓄熱より蓄熱槽容量を小さくできる。"],"ans":0,"ex":"【1級R8出題論点】開放回路では蓄熱槽水面から最高所までの<b>押上げ高さ(実揚程)</b>が加わるため、密閉回路より<b>ポンプ揚程は大きく</b>なる。氷蓄熱は潜熱(約334kJ/kg)利用で槽容量が小さい。"},
{"c":"空調","q":"在室者24人の室において、室内のCO₂濃度を0.1%(1.0×10⁻³ m³/m³)以下に保つために必要な換気量として、適当なものはどれか。ただし、外気のCO₂濃度は0.04%(0.4×10⁻³ m³/m³)、在室者1人当たりのCO₂発生量は0.02 m³/hとする。","a":["800 m³/h","600 m³/h","1,000 m³/h","1,200 m³/h"],"ans":0,"ex":"【1級R8出題論点】必要換気量 <b>Q=M/(Ci−Co)</b>=24×0.02/(1.0×10⁻³−0.4×10⁻³)=0.48/0.0006=<b>800m³/h</b>。外気濃度を引き忘れて 0.48/0.001=480 としないこと。"},
{"c":"空調","q":"換気に関する記述のうち、適当でないものはどれか。","a":["ボイラー室の換気は、第三種換気方式とする。","密閉式燃焼器具のみを設けた室は、火気使用室としての換気設備を設けなくてよい。","誘引誘導換気方式は、地下駐車場などに用いられる第一種換気方式の一種である。","II型(置き型)フードは、火源からフード下端までの高さを1m以内とする。"],"ans":0,"ex":"【1級R8出題論点】ボイラー室は燃焼用空気の確保と室内正圧維持のため<b>第一種又は第二種(給気機)</b>換気とし、負圧となる第三種は不適。密閉式燃焼器具は室内空気を使わないため換気設備不要。"},
{"c":"空調","q":"機械排煙設備に関する記述のうち、適当でないものはどれか。","a":["排煙口は、防煙区画の各部分から水平距離で50m以下となるように設ける。","排煙口は、避難方向と煙の流れが反対になるよう配置する。","排煙口及び排煙風道は、不燃材料で造る。","排煙口の手動開放装置の操作部は、床面から80cm以上1.5m以下の高さに設ける。"],"ans":0,"ex":"【1級R8出題論点】排煙口は防煙区画の各部から<b>水平距離30m以下</b>(50mは誤り)。手動開放装置操作部は壁付で<b>80cm以上1.5m以下</b>、天井吊下げは<b>1.8m</b>。"},
{"c":"給排水衛生","q":"上水道の浄水施設に関する記述のうち、適当でないものはどれか。","a":["混和池では、凝集剤を注入した後、原水をかく拌せず静置する。","沈殿池では、凝集により生成したフロックを沈降させて除去する。","ろ過方式には、緩速ろ過と急速ろ過がある。","高度浄水処理には、活性炭処理・オゾン処理・生物処理などがある。"],"ans":0,"ex":"【1級R8出題論点】混和池では凝集剤を<b>急速かく拌</b>して均一に混合し、次のフロック形成池で緩速かく拌してフロックを成長させる。静置するのは沈殿池。"},
{"c":"給排水衛生","q":"下水道に関する記述のうち、適当でないものはどれか。","a":["管きょの勾配は、下流にいくほど急にする。","分流式の汚水管は雨水管に比べて小口径で勾配が急になり、埋設深さは深くなりやすい。","可とう性管きょの基礎には、砂や砕石の基礎を用いる。","計画下水量に対する最小流速は、汚水管きょで0.6m/s、雨水管きょで0.8m/sとする。"],"ans":0,"ex":"【1級R8出題論点】下流ほど管径が大きく流量も増すため、勾配は<b>緩く</b>してよい。最小流速は汚水<b>0.6m/s</b>・雨水<b>0.8m/s</b>(雨水は土砂を含むため大きい)、最大流速はいずれも3.0m/s。"},
{"c":"給排水衛生","q":"給水設備に関する記述のうち、適当でないものはどれか。","a":["直結増圧(加圧)形ポンプの給水量は、時間平均予想給水量を基に決定する。","器具の同時使用率は、器具数が多くなるほど小さくなる。","受水タンクの有効容量は、1日の予想給水量の1/2程度とする。","逆サイホン作用とは、給水管内に生じた負圧により、吐水した水が給水管内に逆流する現象である。"],"ans":0,"ex":"【1級R8出題論点】直結増圧ポンプは配管内の変動する流量を直接送るため<b>瞬時最大予想給水量</b>で決める。時間平均・時間最大は受水タンク・高置タンク容量や揚水ポンプの決定に用いる値。"},
{"c":"給排水衛生","q":"給水設備に関する記述のうち、適当でないものはどれか。","a":["大便器の器具給水負荷単位は、洗浄弁(フラッシュバルブ)式のほうがロータンク式より小さい。","揚水管に長い横引きが必要な場合は、上層階ではなく下層階で横引きする。","受水タンクでは、地震時に水面が大きく揺れ動くスロッシングが生じることがある。","バルブを介していても、給水管と空調用配管を直接接続すればクロスコネクションとなる。"],"ans":0,"ex":"【1級R8出題論点】大便器の器具給水負荷単位は<b>洗浄弁10、ロータンク5</b>(公衆用)で、洗浄弁のほうが大きい。揚水管の横引きは下層階で行い、水柱分離を防ぐ。"},
{"c":"給排水衛生","q":"中央式給湯設備に関する記述のうち、適当でないものはどれか。","a":["循環ポンプの揚程は、貯湯タンクから最高所の給湯栓までの高低差で決定する。","下向き循環方式では、給湯管・返湯管とも先下り勾配とする。","密閉式膨張タンクは、貯湯タンク直近の給水管側に接続する。","循環湯量は、配管からの熱損失と許容温度降下から決定する。"],"ans":0,"ex":"【1級R8出題論点】給湯循環回路は密閉回路であり、循環ポンプ揚程は高低差ではなく<b>循環回路の摩擦損失</b>で決める。循環湯量は熱損失÷(比熱×許容温度降下)。"},
{"c":"給排水衛生","q":"排水ポンプに関する記述のうち、適当でないものはどれか。","a":["雑排水用水中ポンプは、固形物をほとんど含まない排水に用いる。","流入量がほぼ一定の場合、ポンプ容量は平均流入量の1.2〜1.5倍程度とする。","排水ポンプは2台設置し、通常は交互運転、非常時は同時運転とする。","汚物用水中ポンプは、球形で径53mm程度の固形物を排出できる。"],"ans":0,"ex":"【1級R8出題論点】固形物をほとんど含まない排水用は<b>排水用水中ポンプ</b>、<b>雑排水用</b>は小さな固形物を含む排水用、<b>汚物用</b>は固形物(53mm球)を含む汚水用。3種類の区分を正確に。"},
{"c":"給排水衛生","q":"排水・通気設備に関する記述のうち、適当でないものはどれか。","a":["通気弁は、排水管内の負圧の緩和だけでなく正圧の緩和にも効果がある。","管径100mmの排水横走り管に設ける掃除口の間隔は、15m以内とする。","トラップの封水深は、ディップとあふれ面との垂直距離である。","ループ通気管の管径は、排水横枝管と通気立て管のうち小さいほうの管径の1/2以上とする。"],"ans":0,"ex":"【1級R8出題論点】通気弁は負圧時に開いて空気を吸い込むだけで、<b>正圧の緩和はできない</b>。掃除口間隔は管径100mm以下で<b>15m以内</b>、100mmを超えると<b>30m以内</b>。封水深は<b>50〜100mm</b>。"},
{"c":"給排水衛生","q":"排水設備に関する記述のうち、適当でないものはどれか。","a":["自己サイホン作用とは、トラップに付着した毛髪などを伝って封水が吸い出される現象である。","排水槽には、保守点検用のマンホールを設ける。","器具排水口からトラップのあふれ面までの垂直距離は、600mm以下とする。","排水槽の吸込みピットは、ポンプの周囲及び下部に200mm以上の間隔を確保する。"],"ans":0,"ex":"【1級R8出題論点】毛髪等を伝って封水が失われるのは<b>毛細管現象</b>。<b>自己サイホン作用</b>は器具からの排水自体がトラップ内を満流で流れ封水を引き抜く現象。トラップあふれ面まで<b>600mm以下</b>。"},
{"c":"給排水衛生","q":"スプリンクラー設備に関する記述のうち、適当でないものはどれか。","a":["湿式スプリンクラー設備は、スプリンクラーヘッドと火災感知器の両方が作動して初めて放水する。","開放型スプリンクラー設備は、一斉開放弁の作動により放水する。","予作動式スプリンクラー設備は、予作動弁の二次側配管を加圧空気等で満たしている。","乾式スプリンクラー設備は、配管内の凍結のおそれがある部分に用いる。"],"ans":0,"ex":"【1級R8出題論点】ヘッド開放と<b>感知器作動の両方</b>で放水するのは<b>予作動式</b>。湿式はヘッドまで加圧水が充満しヘッド開放のみで放水する最も一般的な方式。"},
{"c":"給排水衛生","q":"ガス設備に関する記述のうち、適当でないものはどれか。","a":["液化石油ガス(LPガス)用のガス漏れ警報器の検知部は、天井面から下方0.3m以内に設置する。","液化石油ガスのバルク貯槽は、地盤面に固定して設置する。","液化天然ガス(LNG)は無色・無臭で、硫黄分を含まない。","都市ガスの引込み管の内径が70mm以上の場合、引込み管ガス遮断装置を設ける。"],"ans":0,"ex":"【1級R8出題論点】LPガスは空気より<b>重い</b>ため警報器検知部は<b>床面から上方0.3m以内</b>・燃焼器から水平<b>4m以内</b>。天井面下方0.3m以内・8m以内は空気より軽い<b>都市ガス(13A)</b>用。"},
{"c":"給排水衛生","q":"浄化槽の処理対象人員算定(JIS A 3302)において、建築用途とその算定基準の組合せとして、適当でないものはどれか。","a":["高等学校 ―― 教室数","工場 ―― 定員","飲食店 ―― 延べ面積","ホテル ―― 延べ面積"],"ans":0,"ex":"【1級R8出題論点】学校(小・中・高等学校、大学等)の処理対象人員は<b>定員</b>を基に算定する。延べ面積で算定するのは事務所・ホテル・飲食店・店舗等、定員で算定するのは工場・学校等。"},
{"c":"給排水衛生","q":"浄化槽に関する記述のうち、適当でないものはどれか。","a":["生物膜法の浄化槽には、長時間ばっ気方式がある。","浄化槽の二次処理方法は、生物膜法と活性汚泥法に大別される。","生物膜法は、接触材等の表面に付着した生物膜によって汚水を浄化する。","浄化槽は、積雪寒冷地を除き、車庫や建築物内への設置を避ける。"],"ans":0,"ex":"【1級R8出題論点】<b>長時間ばっ気方式</b>は汚泥を浮遊状態で循環させる<b>活性汚泥法</b>の一種。生物膜法は接触ばっ気・回転板接触・散水ろ床など。"},
{"c":"機器・材料","q":"空気調和機に関する記述のうち、適当でないものはどれか。","a":["デシカント空調機は、全熱交換器を機内に組み込んで潜熱を処理する空気調和機である。","冷温水兼用コイルの面風速は、2.5m/s以下程度とする。","大温度差送風とすることで、送風量を減らし搬送動力を削減できる。","潜熱・顕熱分離空調機は、外気処理コイルと室内負荷処理コイルを分けて備えている。"],"ans":0,"ex":"【1級R8出題論点】デシカント空調機は<b>吸湿材(デシカントロータ等)</b>で空気中の水分を吸着除去し潜熱を処理するもので、全熱交換器とは異なる。コイル面風速は<b>2.5m/s程度以下</b>でキャリーオーバー防止。"},
{"c":"機器・材料","q":"冷却塔に関する記述のうち、適当でないものはどれか。","a":["冷却塔のレンジとは、出口空気温度と入口空気温度との差をいう。","密閉形冷却塔は、開放形に比べ空気抵抗が大きく送風機動力が大きい。","白煙防止形冷却塔は、吹出し空気を加熱して相対湿度を下げることで白煙を防ぐ。","スケールは冷却水中の硬度成分が濃縮して生じ、連続ブローにより抑制する。"],"ans":0,"ex":"【1級R8出題論点】<b>レンジ=冷却水の入口温度−出口温度</b>(標準5℃)、<b>アプローチ=冷却水出口温度−入口空気湿球温度</b>(標準5℃)。空気温度差ではない。"},
{"c":"機器・材料","q":"保温・保冷材に関する記述のうち、適当でないものはどれか。","a":["ロックウール保温材は、グラスウール保温材より使用温度の上限が低い。","ロックウールブランケットは、密度によって1号・2号に区分される。","ポリスチレンフォーム保温材は、防露・保冷用に用いられる。","ポリスチレンフォーム保温材は独立気泡構造のため、吸湿性が小さい。"],"ans":0,"ex":"【1級R8出題論点】使用温度上限は<b>ロックウール約600℃>グラスウール約350℃</b>で、ロックウールのほうが高い。ポリスチレンフォームは約70℃までで、高温の蒸気管には使用不可。"},
{"c":"機器・材料","q":"配管材料及び配管附属品に関する記述のうち、適当でないものはどれか。","a":["硬質塩化ビニルライニング鋼管の適用流体温度は、60℃以下である。","水配管用亜鉛めっき鋼管(SGPW)は、配管用炭素鋼鋼管の白管より亜鉛付着量が多い。","配管用炭素鋼鋼管(SGP)の最高使用圧力は、1.0MPa程度である。","黄銅製弁の脱亜鉛腐食対策には、耐脱亜鉛黄銅を用いる。"],"ans":0,"ex":"【1級R8出題論点】硬質塩化ビニルライニング鋼管(SGP-VA/VB/VD)の適用流体温度は<b>40℃以下</b>。<b>耐熱性</b>塩ビライニング鋼管(SGP-HVA)が<b>85℃以下</b>で給湯用。60℃という値はどちらにも該当しない。"},
{"c":"機器・材料","q":"ダクト及びダクト附属品に関する記述のうち、適当でないものはどれか。","a":["風量調節ダンパーの風量調節性能は、対向翼ダンパーより平行翼ダンパーのほうが優れている。","長方形ダクトのかどの継目には、ピッツバーグはぜやボタンパンチスナップはぜが用いられる。","グリスエクストラクターは、排気中の油脂分を分離し自動的に洗浄する装置である。","低圧ダクトは、常用圧力が±500Pa以内で使用するダクトである。"],"ans":0,"ex":"【1級R8出題論点】<b>対向翼</b>ダンパーは開度と風量の関係が直線的で<b>風量調節に優れ</b>、平行翼は偏流が生じやすく主に開閉用。ダクト圧力区分は低圧<b>±500Pa</b>、高圧1<b>+1,000/−500Pa</b>、高圧2<b>+2,500/−1,000Pa</b>。"},
{"c":"設計図書","q":"公共工事標準請負契約約款に関する記述のうち、適当でないものはどれか。","a":["発注者は、受注者から請負代金の支払請求を受けた日から60日以内に支払わなければならない。","発注者は、工事完成の通知を受けた日から14日以内に完成検査を行わなければならない。","発注者は、引渡し前であっても受注者の承諾を得れば工事目的物の全部又は一部を使用できる。","受注者は、設計図書の表示が明確でないことを発見したときは、監督員に通知し発注者の確認を求めなければならない。"],"ans":0,"ex":"【1級R8出題論点】請負代金は請求日から<b>40日以内</b>に支払い。完成検査は通知から<b>14日以内</b>、前払金は<b>14日以内</b>、部分払は<b>14日以内</b>、瑕疵(契約不適合)通知等の日数と混同しないこと。"},
{"c":"設計図書","q":"配管材料の肉厚に関する記述のうち、適当でないものはどれか。","a":["硬質ポリ塩化ビニル管のVPとHIVPでは、同じ呼び径であればHIVPのほうが肉厚が大きい。","銅管のLタイプは、同じ呼び径のMタイプより肉厚が大きい。","圧力配管用炭素鋼鋼管は、スケジュール番号が大きいほど肉厚が大きい。","水道用硬質塩化ビニルライニング鋼管の原管は、排水用硬質塩化ビニルライニング鋼管の原管より肉厚が大きい。"],"ans":0,"ex":"【1級R8出題論点】<b>VPとHIVPは肉厚が同じ</b>(HIは耐衝撃性を高めた材質の違い)。銅管は<b>K>L>M</b>の順に肉厚大。排水用ライニング鋼管(D-VA)は原管が薄肉のため肉厚は小さい。"},
{"c":"施工管理","q":"工事に関する申請・届出書類とその提出先の組合せとして、適当でないものはどれか。","a":["道路占用許可申請書 ―― 警察署長","特定建設作業実施届出書 ―― 市町村長","第一種圧力容器設置届 ―― 労働基準監督署長","建設リサイクル法に基づく対象建設工事の届出 ―― 都道府県知事"],"ans":0,"ex":"【1級R8出題論点】<b>道路占用許可</b>は<b>道路管理者</b>、<b>道路使用許可</b>は<b>警察署長</b>。「占用=道路管理者、使用=警察」のペアが毎年のひっかけ。騒音規制法の特定建設作業は市町村長。"},
{"c":"施工管理","q":"品質管理に関する記述のうち、適当でないものはどれか。","a":["特性要因図を作成することにより、不良項目の発生順位や全体に占める割合を読み取ることができる。","QC工程図(QC工程表)は、工程ごとの管理項目・管理方法・担当者等をまとめたものである。","バスタブ曲線は、時間の経過と故障率の関係を表した曲線である。","管工事における品質管理には、材料の受入検査、配管の水圧試験、ダクトの風量調整などがある。"],"ans":0,"ex":"【1級R8出題論点】不良項目の順位・累積割合を読み取るのは<b>パレート図</b>。<b>特性要因図</b>(魚の骨)は結果と要因の関係を整理する図。QC7つ道具の役割を取り違えさせる定番問題。"},
{"c":"施工管理","q":"安全管理に関する記述のうち、適当でないものはどれか。","a":["ヒューマンエラーとは、作業者が意図的に安全を阻害する行動をとることをいう。","ハインリッヒの法則では、1件の重大災害の背後に29件の軽傷災害と300件の無傷害事故があるとされる。","安全活動は、マンネリ化を防ぐ工夫をしながら継続する。","強度率は、延べ実労働時間1,000時間当たりの労働損失日数で表す。"],"ans":0,"ex":"【1級R8出題論点】ヒューマンエラーは<b>意図しない</b>人間の誤り(うっかり・思い違い)で、意図的な違反(不安全行動)とは区別される。強度率=損失日数/延べ労働時間×<b>1,000</b>、度数率=死傷者数/延べ労働時間×<b>100万</b>。"},
{"c":"施工管理","q":"機器の据付けに関する記述のうち、適当でないものはどれか。","a":["あと施工アンカーの引抜き耐力は、一般に接着系アンカーより金属拡張アンカーのほうが大きい。","機器のコンクリート基礎は、打設後10日程度経過してから機器を据え付ける。","屋外の湿潤な場所に設けるアンカーボルトは、ステンレス製又は溶融亜鉛めっき製とする。","機器の耐震設計に用いる設計用鉛直震度は、設計用水平震度の1/2とする。"],"ans":0,"ex":"【1級R8出題論点】引抜き耐力は<b>接着系(ケミカル)アンカー>金属拡張アンカー</b>。基礎は<b>10日</b>養生後に据付、鉛直震度は水平震度の<b>1/2</b>。"},
{"c":"施工管理","q":"配管の施工に関する記述のうち、適当でないものはどれか。","a":["配管の固定支持は、Uボルトを用いて堅固に固定する。","蒸気横走り管の下方支持には、伸縮を妨げないローラ金物を用いる。","枝管の分岐部にエルボを3個用いたスイベルジョイントとし、主管の伸縮を吸収させる。","冷媒用銅管のろう付けは、管内に窒素等の不活性ガスを流しながら行う。"],"ans":0,"ex":"【1級R8出題論点】<b>Uボルト</b>は管を抱えるだけで滑動を許すため<b>固定支持(アンカー)には不適</b>。固定は固定金物・溶接・形鋼で行う。ろう付け時の窒素ブローは管内酸化スケール防止。"},
{"c":"施工管理","q":"ダクトの施工に関する記述のうち、適当でないものはどれか。","a":["シーリングディフューザーは、隣接する吹出口の最小拡散半径が互いに重なるように配置する。","共板フランジ工法は、ダクト本体の端部を折り曲げて成形しフランジとする工法である。","共板フランジ工法のフランジ押さえ金具は、フランジ端部から150mm以内に、間隔200mm以内で取り付ける。","消音エルボを設ける場合、風量調整ダンパーはその上流側に設ける。"],"ans":0,"ex":"【1級R8出題論点】最小拡散半径が重なると気流が衝突してドラフトが生じるため、<b>重ならないよう</b>配置する。共板押さえ金具は端部<b>150mm以内</b>・間隔<b>200mm以内</b>。"},
{"c":"施工管理","q":"保温の施工に関する記述のうち、適当でないものはどれか。","a":["機械室に露出する冷温水管の保温は、保温筒、ポリエチレンフィルム、原紙、鉄線、アルミガラスクロスの順に施工する。","ステンレス鋼板製貯湯タンクは、エポキシ系塗装等により保温材と絶縁する。","絶縁継手の周囲には、金属製ラッキングを施さない。","蒸気管の壁・床貫通部とその両側25mm程度の範囲は保温しない。"],"ans":0,"ex":"【1級R8出題論点】正しい順序は<b>保温筒→鉄線→ポリエチレンフィルム→原紙→アルミガラスクロス</b>。鉄線は保温材の直後に巻く。ステンレスタンクは塩化物による応力腐食割れ防止のため絶縁する。"},
{"c":"施工管理","q":"機器の防振に関する記述のうち、適当でないものはどれか。","a":["共通架台上に回転数の異なる複数の機器を設置する場合、防振装置は最も高い回転数に合わせて選定する。","気泡浴槽(ジェットバス)は振動が大きいため、防振対策が必要である。","遠心冷凍機を地下の機械室に設置する場合は、防振ゴムパッド程度でよい。","配管の吊り金物は二次的な騒音源となるため、必要に応じて防振支持とする。"],"ans":0,"ex":"【1級R8出題論点】防振装置の固有振動数は加振振動数より十分低くする必要があるため、<b>最も低い回転数</b>に合わせて選定する。地下では振動伝搬が小さく防振ゴムパッドで足りる。"},
{"c":"法規","q":"労働安全衛生法上、建設業の安全衛生管理体制に関する記述のうち、誤っているものはどれか。","a":["特定元方事業者は、同一場所の労働者数が常時50人以上の場合、総括安全衛生管理者を選任しなければならない。","統括安全衛生責任者が統括管理する事項には、関係請負人との作業間の連絡及び調整が含まれる。","元方安全衛生管理者には、統括安全衛生責任者が統括管理する事項のうち技術的事項を管理させる。","総括安全衛生管理者は、選任すべき事由が発生した日から14日以内に選任しなければならない。"],"ans":0,"ex":"【1級R8出題論点】特定元方事業者が50人以上で選任するのは<b>統括安全衛生責任者</b>。<b>総括安全衛生管理者</b>は一事業者が建設業で常時<b>100人以上</b>の事業場に選任するもので、名称のすり替えがひっかけ。"},
{"c":"法規","q":"労働安全衛生法上、通路等に関する記述のうち、誤っているものはどれか。","a":["架設通路の勾配は、40度以下としなければならない。","機械間又は機械と他の設備との間に設ける通路の幅は、80cm以上とする。","3m以上の高所から物体を投下するときは、適当な投下設備を設け、監視人を置く。","高さ8m以上の登り桟橋には、7m以内ごとに踊場を設ける。"],"ans":0,"ex":"【1級R8出題論点】架設通路の勾配は<b>30度以下</b>(階段又は高さ2m未満で丈夫な手掛けがあれば除く)、15度を超えると踏桟等の滑止め。登り桟橋は高さ<b>8m以上で7m以内</b>ごとに踊場。"},
{"c":"法規","q":"労働基準法上、満18歳に満たない者を就かせてはならない業務として、定められていないものはどれか。","a":["最大積載荷重1tの人荷共用エレベーターの運転の業務","クレーンの運転の業務","動力により駆動される土木建築用機械の運転の業務","深さが5m以上の地穴における業務"],"ans":0,"ex":"【1級R8出題論点】年少者の就業禁止は人荷共用エレベーターでは<b>最大積載荷重2t以上</b>の運転であり、1tは該当しない。クレーン・デリック運転、動力駆動の土木建築機械運転、深さ<b>5m以上</b>の地穴、高さ<b>5m以上</b>の墜落危険場所は禁止。"},
{"c":"法規","q":"建築基準法上の用語に関する記述のうち、誤っているものはどれか。","a":["防火性能とは、建築物の周囲において発生する通常の火災による延焼を抑制するために、躯体又は屋根に必要とされる性能をいう。","耐火性能とは、通常の火災が終了するまでの間、当該火災による建築物の倒壊及び延焼を防止するために必要とされる性能をいう。","居室の天井の高さは2.1m以上とし、一室で高さが異なる場合はその平均の高さによる。","屋上部分の昇降機塔等で水平投影面積の合計が建築面積の1/8以下のものは、階数に算入しない。"],"ans":0,"ex":"【1級R8出題論点】防火性能・準防火性能は<b>外壁又は軒裏</b>に必要とされる性能。耐火性能は主要構造部、遮炎性能は防火設備と、対象部位の組合せで問われる。天井高<b>2.1m</b>、階数不算入は<b>1/8以下</b>。"},
{"c":"法規","q":"建築基準法上、建築設備に関する記述のうち、誤っているものはどれか。","a":["調理室等に設ける換気設備の排気口は、天井から下方120cm以内の高さに設ける。","自然換気設備の排気口は、給気口より高い位置に設け、常時開放された構造とする。","中央管理方式の空気調和設備の風道は、火を使用する設備の換気風道に連結してはならない。","延べ面積3,000m²を超える建築物の風道は、不燃材料で造らなければならない。"],"ans":0,"ex":"【1級R8出題論点】火気使用室の換気設備の排気口は<b>天井から下方80cm以内</b>に設ける。自然換気の給気口は天井高の<b>1/2以下</b>、排気口は<b>給気口より高く</b>常時開放。"},
{"c":"法規","q":"建設業法上、施工体系図に表示しなければならない事項として、定められていないものはどれか。","a":["下請負人の請負代金の額","建設工事の名称","建設工事の工期","発注者の商号、名称又は氏名"],"ans":0,"ex":"【1級R8出題論点】施工体系図には工事名称・工期・発注者・各下請負人の商号と担当工事内容・監理技術者等は表示するが、<b>請負代金の額は記載事項ではない</b>(施工体制台帳には記載)。"},
{"c":"法規","q":"建設業法上、元請負人の義務に関する記述のうち、誤っているものはどれか。","a":["元請負人は、検査によって完成を確認した後、下請負人が引渡しを申し出たときは、申出の日から10日以内に引渡しを受けなければならない。","元請負人は、前払金の支払を受けたときは、下請負人に対して資材購入等に必要な費用を前払金として支払うよう適切な配慮をしなければならない。","元請負人は、工程の細目や作業方法等を定めようとするときは、あらかじめ下請負人の意見を聴かなければならない。","元請負人は、下請負人から工事完成の通知を受けたときは、通知を受けた日から20日以内でできる限り短い期間内に検査を完了しなければならない。"],"ans":0,"ex":"【1級R8出題論点】完成確認後に下請負人から引渡しの申出があれば<b>直ちに</b>引渡しを受ける(10日ではない)。検査は<b>20日以内</b>、下請代金の支払は元請が支払を受けた日から<b>1か月以内</b>。"},
{"c":"法規","q":"消防法上、スプリンクラー設備に関する記述のうち、誤っているものはどれか。","a":["開放型スプリンクラーヘッドを用いる設備には、末端試験弁を設けなければならない。","予作動式の流水検知装置を用いる設備では、ヘッドが開放してから1分以内に放水できるものとする。","スプリンクラーヘッドの放水圧力が1.0MPaを超えないための措置を講じる。","送水口は、双口形とする。"],"ans":0,"ex":"【1級R8出題論点】末端試験弁は<b>閉鎖型ヘッド</b>を用いる設備で流水検知装置の作動を試験するためのもので、<b>開放型には不要</b>。放水圧力は<b>0.1MPa以上1.0MPa以下</b>、予作動式はヘッド開放後<b>1分以内</b>に放水。"},
{"c":"法規","q":"消防法上、スプリンクラー設備に関する記述のうち、誤っているものはどれか。","a":["送水口の結合金具は、簡易着脱式のものとする。","補助散水栓は、防火対象物の階ごとに、その階の各部分から一のホース接続口までの水平距離が15m以下となるように設ける。","スプリンクラー設備には、非常電源を附置する。","補助散水栓のホースは、保形ホースとする。"],"ans":0,"ex":"【1級R8出題論点】送水口の結合金具は<b>差込式又はねじ式</b>。補助散水栓は水平距離<b>15m以下</b>(屋内消火栓1号は25m、2号・広範囲型2号は15m・25m)。"},
{"c":"法規","q":"建設工事に係る資材の再資源化等に関する法律(建設リサイクル法)上、建築物の修繕・模様替工事で分別解体等の実施義務の対象となるものはどれか。","a":["請負代金の額が1億円の模様替工事","請負代金の額が8千万円で、延べ面積600m²の修繕工事","請負代金の額が6千万円で、4階建て建築物の模様替工事","請負代金の額が9千万円で、床面積1,000m²の修繕工事"],"ans":0,"ex":"【1級R8出題論点】建築物の修繕・模様替(リフォーム等)は<b>請負代金1億円以上</b>が対象で、床面積や階数は無関係。解体は床面積<b>80m²以上</b>、新築・増築は<b>500m²以上</b>、建築物以外の工作物は<b>500万円以上</b>。"},
{"c":"法規","q":"フロン類の使用の合理化及び管理の適正化に関する法律上、第一種特定製品へのフロン類の充塡に関する記述のうち、誤っているものはどれか。","a":["充塡しようとするフロン類と異なる種類のフロン類が使用されている場合は、充塡後に管理者へ報告すればよい。","充塡前に、点検整備記録簿等により当該製品の点検・整備の状況を確認する。","充塡前に、フロン類の漏えいの有無を確認する。","充塡に当たっては、過充塡の防止措置を講じる。"],"ans":0,"ex":"【1級R8出題論点】種類の異なるフロン類を充塡する場合は<b>充塡前</b>に管理者へ説明し<b>承諾</b>を得る必要がある。漏えい箇所を修理せずに充塡することも原則禁止。"},
{"c":"法規","q":"廃棄物の処理及び清掃に関する法律上、産業廃棄物に関する記述のうち、誤っているものはどれか。","a":["事業者が自ら産業廃棄物を運搬する場合も、産業廃棄物収集運搬業の許可を受けなければならない。","建設工事が下請施工で行われる場合でも、工事に伴い生じた廃棄物の処理責任は元請業者にある。","使用済みの灯油を廃棄する場合は、特別管理産業廃棄物として処理する。","専ら再生利用の目的となる産業廃棄物のみを扱う業者に委託する場合は、産業廃棄物管理票(マニフェスト)の交付を要しない。"],"ans":0,"ex":"【1級R8出題論点】排出事業者が<b>自ら運搬・処分</b>する場合は<b>業の許可は不要</b>(基準遵守は必要)。廃油は引火点70℃未満なら<b>特別管理産業廃棄物</b>。処理責任は<b>元請</b>。"},
{"c":"応用能力","q":"施工計画に関する記述のうち、適当でないものはどれか。","a":["工事原価は純工事費と現場管理費で構成され、現場経費は含まれない。","仮設や施工方法は、設計図書に特別の定めがある場合を除き、受注者の責任において定める。","総合試運転調整は、各機器の単体試運転調整が完了した後に実施する。","工種別施工計画書は、総合施工計画書に基づき作成し、監督員に提出する。"],"ans":0,"ex":"【1級R8出題論点】<b>工事原価=純工事費+現場経費(現場管理費)</b>であり、現場経費は含まれる。工事価格=工事原価+一般管理費等。総合試運転は単体試運転の後。"},
{"c":"応用能力","q":"工程管理に関する記述のうち、適当でないものはどれか。","a":["工期短縮を検討する場合は、当初のクリティカルパス上の作業のみを対象とすればよい。","クリティカルパスは、最早開始時刻と最遅完了時刻が等しいイベントを通る経路である。","フリーフロートとは、後続作業の最早開始時刻に影響を与えずに、その作業が遅れることのできる時間である。","施工速度を速めると、一般に直接費は増加し間接費は減少する。"],"ans":0,"ex":"【1級R8出題論点】クリティカルパス上の作業を短縮すると他の経路が新たなクリティカルパスになり得るため、<b>当初のCPだけでなく準クリティカルな経路も含めて検討</b>する。施工速度を速めると<b>直接費増・間接費減</b>。"},
{"c":"応用能力","q":"品質管理に関する記述のうち、適当でないものはどれか。","a":["防火区画を貫通する配管まわりの穴埋めの検査は、抜取検査でよい。","品質に影響を与える要因には、材料・機器、施工方法、作業者の技能、施工環境などがある。","ISO 9000ファミリーは、製品そのものではなく品質マネジメントのプロセス(仕組み)に関する規格である。","計量抜取検査は、品質特性値が正規分布とみなせる場合に適用する。"],"ans":0,"ex":"【1級R8出題論点】防火区画貫通部の穴埋めは防火上極めて重要で、やり直しが困難なため<b>全数検査</b>とする。正規分布を前提とするのは<b>計量</b>抜取検査、<b>計数</b>抜取検査は不良個数等で判定する。"},
{"c":"応用能力","q":"安全管理に関する記述のうち、適当でないものはどれか。","a":["高さ2m以上の作業床の端に設ける手すりは、高さ85cm以上であれば中桟を省略できる。","はしご道のはしごの上端は、床から60cm以上突出させる。","高さ2m以上の箇所で作業を行う場合、強風・大雨・大雪等の悪天候のため危険が予想されるときは作業を行わない。","高さ2m以上の箇所で作業を行うときは、作業を安全に行うため必要な照度を保持する。"],"ans":0,"ex":"【1級R8出題論点】手すりは高さ<b>85cm以上</b>とし、<b>中桟(35cm以上50cm以下)</b>等の設置が必要で省略不可。悪天候時の作業禁止・照度保持・作業床設置はいずれも<b>高さ2m以上</b>が基準。"},
{"c":"応用能力","q":"機器の据付けに関する記述のうち、適当でないものはどれか。","a":["窒素ガス加圧状態で搬入された冷凍機は、配管接続前に大気開放して内部圧力を抜いてから据え付ける。","ボイラーの地震感知器は、機器本体ではなく建築躯体等に取り付ける。","天井下面に上向きに打設するあと施工アンカーには、金属拡張アンカーを用いる。","インサート金物は、工種別に色分けして取り付ける。"],"ans":0,"ex":"【1級R8出題論点】窒素封入された冷凍機は内部への湿気・空気混入を防ぐため、<b>配管接続直前まで気密を保つ</b>。地震感知器は機器自体の振動を拾わないよう<b>躯体</b>に取り付ける。上向きアンカーは接着剤が垂れるため金属拡張形。"},
{"c":"応用能力","q":"配管の施工に関する記述のうち、適当でないものはどれか。","a":["通気管の末端を建物の開口部付近に設ける場合は、開口部から水平に1m以上離せばよい。","排水横枝管からの通気管の取出しは、横枝管の垂直中心線上部から45度以内の角度で行う。","先下り勾配の蒸気管で管径を変える場合は、下面を揃える偏心異径継手を用いる。","配管用炭素鋼鋼管の突合せ溶接の余盛高さは、3mm以下とする。"],"ans":0,"ex":"【1級R8出題論点】通気管末端は開口部から<b>水平3m以上</b>離すか、開口部上端から<b>60cm以上</b>立ち上げる。蒸気管はドレンが滞留しないよう<b>下面</b>を揃える(給水・冷温水は空気溜まり防止で上面を揃える)。"},
{"c":"応用能力","q":"ダクトの施工に関する記述のうち、適当でないものはどれか。","a":["コーナーボルト工法のフランジ部ガスケットの継目は、コーナー部で重ね合わせる。","天井ディフューザーのボックスは、吊り金物で支持する。","長方形ダクトのエルボに設ける案内羽根(ガイドベーン)の板厚は、ダクトの板厚と同等以上とする。","割込み分岐の分岐比率は、各分岐の風量比による。"],"ans":0,"ex":"【1級R8出題論点】ガスケットの継目はコーナー部では漏れやすいため<b>辺の中央部</b>で重ね合わせる。案内羽根の板厚は<b>ダクト板厚以上</b>。"},
{"c":"応用能力","q":"配管の腐食及び防食に関する記述のうち、適当でないものはどれか。","a":["金属溶射は、溶融した金属槽に被処理物を浸漬して皮膜を形成する方法である。","外部電源方式の電気防食では、直流電源装置のマイナス端子に被防食体を接続する。","自然電位の異なる配管を接続する場合は、絶縁物を介して接続する。","配管用炭素鋼鋼管(白管)は、水のpHが低いほど腐食が進行しやすい。"],"ans":0,"ex":"【1級R8出題論点】溶融金属槽に浸漬するのは<b>溶融めっき(どぶづけ)</b>。<b>金属溶射</b>は溶融した金属を圧縮空気等で吹き付けて皮膜を形成する方法。外部電源方式は被防食体を<b>マイナス(陰極)</b>に接続する。"},
{"c":"原論・基礎","q":"水槽の側壁に設けた小孔から水が噴出している。水面から小孔中心までの水頭を4倍にしたとき、噴出速度はもとのおよそ何倍になるか。ただし、損失は無視する。","a":["2倍","4倍","√2倍","8倍"],"ans":0,"ex":"トリチェリの定理より噴出速度は<b>v=√(2gH)</b>で、水頭Hの平方根に比例する。Hが4倍なら速度は√4=<b>2倍</b>。速度が水頭に比例すると誤解して4倍と答えないこと。"},
{"c":"原論・基礎","q":"ダクト内の空気の流れをピトー管で測定したところ、全圧が290Pa、静圧が50Paであった。このときの流速として最も近い値はどれか。ただし、空気の密度は1.2kg/m³とする。","a":["20m/s","10m/s","14m/s","40m/s"],"ans":0,"ex":"動圧=全圧−静圧=290−50=<b>240Pa</b>。動圧=ρv²/2より v²=2×240/1.2=400、v=<b>20m/s</b>。静圧を引き忘れて全圧をそのまま動圧として計算すると誤る。"},
{"c":"原論・基礎","q":"円管内を流れる水のレイノルズ数が12,000であった。管径と動粘性係数を変えずに流速のみを変えて層流(レイノルズ数2,000未満)にする場合、流速を元の何倍にすればよいか。最も近いものを選べ。","a":["1/8倍","1/4倍","1/3倍","1/2倍"],"ans":0,"ex":"Re=vD/νで流速に比例する。12,000×1/8=<b>1,500<2,000</b>で層流となる。1/4倍では3,000、1/3倍では4,000で乱流のまま。管径を変えない条件に注意。"},
{"c":"原論・基礎","q":"理想気体50Lを、絶対圧力0.1MPa・温度300Kの状態から、絶対圧力0.4MPa・温度360Kの状態に変化させたときの体積として正しいものはどれか。","a":["15L","12.5L","60L","240L"],"ans":0,"ex":"PV/T=一定より V₂=V₁×(P₁/P₂)×(T₂/T₁)=50×(0.1/0.4)×(360/300)=50×0.25×1.2=<b>15L</b>。温度は必ず<b>絶対温度(K)</b>で計算し、圧力比と温度比の向きを逆にしないこと。"},
{"c":"原論・基礎","q":"伝熱に関する記述のうち、適当でないものはどれか。","a":["黒体からの放射エネルギーは、その表面の絶対温度の2乗に比例する。","固体内部の熱伝導による熱流は、温度勾配に比例する(フーリエの法則)。","固体表面と流体間の熱伝達率は、流体の速度や面の形状によって変化する。","同一材料の平面壁では、壁体を通過する熱量は壁の厚さに反比例する。"],"ans":0,"ex":"黒体放射はステファン・ボルツマンの法則により<b>絶対温度の4乗</b>に比例する。壁厚の影響は「厚さに反比例」であり、「厚さの2乗に反比例」と書かれた選択肢も過去に誤りとして出題されている。"},
{"c":"原論・基礎","q":"湿り空気線図上における空気の状態変化に関する記述のうち、適当でないものはどれか。","a":["水噴霧加湿では、乾球温度が一定のまま絶対湿度のみが増加する。","蒸気加湿では、乾球温度がわずかに上昇しながら絶対湿度が増加し、線図上ではほぼ上方(やや右上)に移動する。","冷却コイルによる冷却減湿では、状態点は左下方向に移動する。","シリカゲルなどの吸着剤による除湿では、吸着熱により乾球温度が上昇し、状態点は右下方向に移動する。"],"ans":0,"ex":"【1級頻出】水噴霧加湿は<b>断熱変化</b>で、ほぼ湿球温度一定線に沿って<b>左上</b>(乾球温度低下・絶対湿度上昇)へ移動する。乾球温度がほぼ変わらずに上方へ移動するのは<b>蒸気加湿</b>で、両者の移動方向の違いが繰り返し問われる。"},
{"c":"原論・基礎","q":"音に関する記述のうち、適当でないものはどれか。","a":["音圧レベル50dBの同じ音源が2つある場合、合成音圧レベルは約56dBとなる。","2つの音の周波数が近いほど、マスキング効果は大きくなる。","空気中の音速は、気温が高いほど速くなる。","NC曲線では、低周波数ほど許容音圧レベルが大きくなっている。"],"ans":0,"ex":"【1級頻出】同じレベルの音2つの合成は<b>+3dB</b>で53dBとなる(10log₁₀2≒3)。音速は約331.5+0.6t[m/s]で温度が高いほど<b>速く</b>、NC曲線は低周波ほど許容値が大きいことも頻出。"},
{"c":"原論・基礎","q":"温熱環境に関する記述のうち、適当でないものはどれか。","a":["1metは、椅座安静時の代謝量に相当し、約100W/m²である。","温熱環境の6要素は、気温、湿度、気流、放射(熱放射)、代謝量、着衣量である。","PMVは−3(寒い)から+3(暑い)までの7段階尺度で表される。","1cloは、着衣の熱抵抗0.155m²·K/Wに相当する。"],"ans":0,"ex":"1metは椅座安静時の代謝量で<b>約58W/m²</b>。100W/m²ではない。1clo=0.155m²·K/W、PMV±3(推奨範囲±0.5)の数値とセットで覚える。"},
{"c":"原論・基礎","q":"三相誘導電動機に関する記述のうち、適当でないものはどれか。","a":["電動機回路の短絡保護には、熱動継電器(サーマルリレー)と電磁接触器の組合せを用いる。","スターデルタ始動では、始動電流を全電圧始動の約1/3に抑えることができる。","インバータ運転では高調波が発生するため、リアクトルを設置して抑制する。","トップランナーモータは効率が高い反面、始動電流が大きくなる傾向がある。"],"ans":0,"ex":"【1級頻出】短絡電流は瞬時に遮断する必要があり<b>配線用遮断器(MCCB)</b>で保護する。熱動継電器+電磁接触器は<b>過負荷保護</b>用で短絡保護には使えない。トップランナーモータの始動電流は「小さい」ではなく<b>大きい</b>点も頻出。"},
{"c":"空調","q":"空気調和設備の省エネルギー計画に関する記述のうち、適当でないものはどれか。","a":["蓄熱方式を採用すると、熱源機器の容量は非蓄熱方式より大きくなる。","変流量(VWV)方式により、部分負荷時の冷温水ポンプ動力を低減できる。","大温度差送水とすることで、搬送する水量を減らし搬送動力を削減できる。","熱源機器を複数台に分割し台数制御を行うと、部分負荷時の効率が向上する。"],"ans":0,"ex":"【1級頻出】蓄熱方式は夜間に蓄えた熱で昼間のピークを賄うため、熱源機器容量を<b>小さく</b>できる(ピークカット)。「蓄熱=熱源容量が大」という逆の記述がひっかけ。"},
{"c":"空調","q":"空調方式に関する記述のうち、適当でないものはどれか。","a":["天井放射冷房方式は、室内の潜熱負荷を効率よく処理できる。","変風量(VAV)方式は、定風量方式に比べて送風機の搬送動力を低減できる。","VAVユニットには、最小風量を設定して必要換気量を確保する機能が必要である。","ファンコイルユニット・ダクト併用方式は、全空気方式に比べてダクトスペースが小さく、空気搬送動力も小さい。"],"ans":0,"ex":"【1級頻出】放射冷房は<b>顕熱のみ</b>を処理し、潜熱(除湿)は処理できない。むしろパネル表面の結露を防ぐため別系統での除湿が必要になる。"},
{"c":"空調","q":"熱負荷計算に関する記述のうち、適当でないものはどれか。","a":["北側の外壁は日射の影響が小さいため、冷房負荷計算に実効温度差を用いない。","冷房負荷計算では、一般に土間床・地中壁からの負荷は見込まない。","室内を正圧に保つ空調方式では、隙間風による負荷は無視できる。","暖房負荷計算は一般に安全側の定常計算で行い、日射や内部発熱は考慮しない。"],"ans":0,"ex":"【1級頻出】北側外壁も夜間放射や外気温変動の影響を受けるため、方位別の<b>実効温度差(ETD)</b>を用いて計算する。「北側は使わない」が誤り。土間床は冷房で無視、暖房は定常計算、もセットで頻出。"},
{"c":"空調","q":"換気設備に関する記述のうち、適当でないものはどれか。","a":["開放式燃焼器具を設置した室は、第二種換気として室内を正圧に保つ。","ボイラー室の換気量は、燃焼用空気量を考慮して決定する。","燃焼器具の排気筒の断面積は、理論廃ガス量をもとに算定する。","発生源が特定できる汚染物質は、フードを用いた局所換気で捕集するのが効果的である。"],"ans":0,"ex":"【1級頻出】開放式燃焼器具のある室は燃焼排ガスが隣室へ漏れないよう<b>第一種または第三種換気</b>として<b>負圧</b>に保つ。第二種(正圧)はクリーンルームや手術室など汚染空気の流入を防ぐ室に用いる。"},
{"c":"空調","q":"室内に6kWの発熱がある室を、室温30°C以下に保つために必要な換気量として最も近い値はどれか。ただし、外気温度25°C、空気の密度1.2kg/m³、定圧比熱1.0kJ/(kg·K)とする。","a":["3,600m³/h","1,800m³/h","7,200m³/h","1,000m³/h"],"ans":0,"ex":"Q=H/(ρ·cp·Δt)=6/(1.2×1.0×5)=<b>1.0m³/s</b>。時間当たりに直すと1.0×3,600=<b>3,600m³/h</b>。m³/sからm³/hへの換算忘れと、温度差を室温そのもの(30)にしてしまう誤りに注意。"},
{"c":"空調","q":"排煙設備に関する記述のうち、適当でないものはどれか。","a":["天井高さが3m未満の室では、排煙口は床面から2.1m以上かつ天井高の1/2以上の高さに設ける。","排煙口の手動開放装置を天井から吊り下げる場合、操作部の高さは床面からおおむね1.8mとする。","排煙口は、防煙区画の各部分から水平距離30m以内となるように配置する。","自然排煙の排煙口の有効開口面積は、防煙区画の床面積の1/50以上とする。"],"ans":0,"ex":"【1級頻出】天井高3m未満の室では排煙口は<b>天井面から80cm以内</b>(かつ防煙垂れ壁の下端より上)に設ける。「床面から2.1m以上かつ天井高の1/2以上」は<b>天井高3m以上</b>の室に適用される基準。"},
{"c":"空調","q":"排煙設備に関する記述のうち、適当でないものはどれか。","a":["排煙ダクトは可燃物から10cm以上離すか、厚さ5cm以上の金属以外の不燃材料で覆う。","隣接する防煙区画で一方が自然排煙、他方が機械排煙の場合、両区画の間は間仕切壁で区画する。","排煙機は、原則として最上部の排煙口より高い位置に設ける。","排煙機の予備電源は、30分以上運転できる容量とする。"],"ans":0,"ex":"【1級頻出】排煙ダクトは可燃物から<b>15cm以上</b>離すか、厚さ<b>10cm以上</b>の金属以外の不燃材料で覆う。数値を一段階小さく書いた選択肢がひっかけ。"},
{"c":"空調","q":"空気調和設備の自動制御に関する記述のうち、適当でないものはどれか。","a":["冷却塔のファンは、外気温度を検出して二位置制御を行う。","複数台の冷凍機の台数制御では、ローテーション運転により各機の運転時間を平準化する。","加湿器は、空調機の送風機とインターロックをとり、送風停止時に加湿しないようにする。","室内CO₂濃度を検出して、外気取入れダンパーの開度を比例制御する。"],"ans":0,"ex":"冷却塔ファンの発停は<b>冷却水(出口)温度</b>で二位置制御する。外気温度ではない。加湿器と送風機のインターロック(停止時の結露・水漏れ防止)も頻出。"},
{"c":"空調","q":"コージェネレーションシステムに関する記述のうち、適当でないものはどれか。","a":["燃料電池は発電効率が低いため、排熱利用を主目的として採用される。","発電した電力を商用電力系統と並列運転する方式を系統連系という。","出力の小さいマイクロガスタービン発電設備は、電気主任技術者の選任が不要な場合がある。","常用発電設備を防災用(非常用)発電設備と兼用することができる。"],"ans":0,"ex":"燃料電池は燃料の化学エネルギーを燃焼を経ずに直接電気に変換するため<b>発電効率が高い</b>。発電効率の高低と排熱の温度レベルを混同させる選択肢に注意。"},
{"c":"空調","q":"空気熱源ヒートポンプに関する記述のうち、適当でないものはどれか。","a":["モジュール型の空気熱源ヒートポンプチラーでは、全モジュールの合計能力で法定冷凍トンを算定する。","ガスエンジンヒートポンプ(GHP)は、エンジン排熱を回収する熱交換器を備え、暖房能力を高めている。","暖房時の除霜(デフロスト)運転は、一般に冷凍サイクルを冷房側に切り替えて行う。","冷房運転と暖房運転の切替えは、四方弁により冷媒の流れを反転させて行う。"],"ans":0,"ex":"モジュール型チラーは独立した冷媒系統ごとに<b>モジュール単位</b>で法定冷凍トンを算定し、高圧ガス保安法上の区分を判断する。合算ではない。"},
{"c":"給排水衛生","q":"上水道の配水管・給水装置に関する記述のうち、適当でないものはどれか。","a":["配水管の最大静水圧は0.98MPaを超えないようにする。","配水管の最小動水圧は0.15〜0.2MPa程度を確保する。","給水装置の耐圧性能試験は、1.75MPaの静水圧を1分間加えて行う。","軟弱地盤に配水管を布設する場合は、良質土や砂に置き換えて管を支持する。"],"ans":0,"ex":"【1級頻出】配水管の最大静水圧は<b>0.74MPa</b>を超えないようにする。0.98MPaは配管用炭素鋼鋼管などの最高使用圧力と混同しやすい数値。耐圧試験<b>1.75MPa・1分間</b>も頻出。"},
{"c":"給排水衛生","q":"下水道に関する記述のうち、適当でないものはどれか。","a":["管きょの最小管径は、汚水管で150mm、雨水管で200mmを標準とする。","管径が変化する箇所の接合は、原則として水面接合または管頂接合とする。","計画下水量に対する流速は、汚水管で0.6〜3.0m/s、雨水管・合流管で0.8〜3.0m/sとする。","地表勾配が急な場所では、段差接合または階段接合とする。"],"ans":0,"ex":"【1級頻出】管きょの最小管径は<b>汚水管200mm、雨水管・合流管250mm</b>を標準とする。流速の下限が汚水0.6・雨水0.8と「雨水の方が大きい」ことも合わせて押さえる。"},
{"c":"給排水衛生","q":"給水設備に関する記述のうち、適当でないものはどれか。","a":["直結増圧方式は、直結直圧方式に比べて引込み管の管径を小さくできる。","受水タンクには、地震時の二次災害防止と飲料水確保のため緊急遮断弁を設ける場合がある。","住宅など私室用の器具給水負荷単位は、公衆用より小さい値をとる。","受水タンクの保守点検スペースは、上部に1m以上、周囲に0.6m以上確保する。"],"ans":0,"ex":"【1級頻出】直結増圧方式は瞬時最大給水量を配水管から直接取り込むため、引込み管径は直結直圧方式より<b>大きく</b>なる。「小さくできる」は逆。"},
{"c":"給排水衛生","q":"給水設備に関する記述のうち、適当でないものはどれか。","a":["直結増圧方式の給水立て管最上部には、自動エア抜き弁を設ける。","飲料用タンクへの給水は、吐水口空間を確保して逆流を防止する。","直結増圧ポンプの逆流防止装置は、ポンプの吸込み側に設ける。","一般に、器具に加わる給水圧力の上限は400〜500kPa程度に抑える。"],"ans":0,"ex":"【1級頻出】直結増圧の立て管頂部には、ポンプ停止時や断水時に管内が<b>負圧</b>になるのを防ぐため、空気を吸い込める<b>吸排気弁</b>を設ける。エア抜き弁は排気専用で負圧対策にならない。"},
{"c":"給排水衛生","q":"給湯設備に関する記述のうち、適当でないものはどれか。","a":["気水分離器は、配管系統の中で圧力が高く温度が低い位置に設ける。","レジオネラ属菌対策として、貯湯槽内の湯温は60°C以上に保つ。","ガス瞬間湯沸器の1号は、1L/minの水を25°C上昇させる能力で約1.74kWに相当する。","各系統の循環湯量を均等にするため、返湯管に定流量弁を設ける。"],"ans":0,"ex":"【1級頻出】溶存空気は<b>圧力が低く温度が高い</b>ほど分離しやすいため、気水分離器はそのような位置(貯湯槽出口付近の高所など)に設ける。1号=1.74kWも数値問題として頻出。"},
{"c":"給排水衛生","q":"排水・通気設備に関する記述のうち、適当でないものはどれか。","a":["排水管内の圧力変動の緩和には、ループ通気方式より伸頂通気方式の方が有効である。","通気管の管長は、水平距離ではなく配管の実長で算定する。","排水横主管の曲がりは、排水立て管底部から3m以内に設けてはならない。","ブランチ間隔は、排水横枝管の接続間隔が2.5mを超えるものをいう。"],"ans":0,"ex":"【1級頻出】ループ通気方式は各器具トラップ近傍まで通気が及び、<b>伸頂通気方式より圧力緩和に有効</b>。伸頂通気は立て管頂部の開放のみで、負圧・正圧の緩和能力は劣る。"},
{"c":"給排水衛生","q":"通気設備に関する記述のうち、適当でないものはどれか。","a":["結合通気管は、通気立て管へは床面より下方の高さで接続する。","結合通気管は、ブランチ間隔10以上の建物では、最上階から数えて10ブランチ間隔以内ごとに設ける。","通気管の末端は、開口部の上端から600mm以上立ち上げるか、開口部から水平に3m以上離す。","排水立て管は、どの階においても最下部の管径より縮小してはならない。"],"ans":0,"ex":"【1級頻出】結合通気管は、排水立て管から分岐して<b>床上1m以上</b>の高さで通気立て管に接続する。床下接続では排水が通気管側へ流入するおそれがある。"},
{"c":"給排水衛生","q":"排水設備に関する記述のうち、適当でないものはどれか。","a":["排水立て管のオフセットは、垂直に対し60度以下であれば垂直管とみなす。","最下階の排水横枝管は、排水立て管に接続せず、単独で排水横主管または排水ますに接続する。","管径65mmを超える間接排水管の排水口空間は、150mm以上とする。","トラップの封水深は50mm以上100mm以下とする。"],"ans":0,"ex":"【1級頻出】垂直管とみなせるオフセットは<b>45度以下</b>。60度以下ではない。最下階横枝管を単独接続するのは、立て管底部の<b>正圧</b>による吹出しを避けるため。"},
{"c":"給排水衛生","q":"ガス設備に関する記述のうち、適当でないものはどれか。","a":["液化石油ガスの「い号」は、プロパンおよびプロピレンの含有率が最も低い規格である。","都市ガスの供給圧力は、低圧は0.1MPa未満、高圧は1MPa以上に区分される。","空気より軽い都市ガス用のガス漏れ警報器は、燃焼器から水平距離8m以内に設置する。","LPガス容器は、その周囲2m以内に火気がないよう遮断措置を講じる。"],"ans":0,"ex":"【1級頻出】い号は<b>プロパン・プロピレン含有率80%以上</b>で<b>最も高い</b>規格(ろ号が最も低い)。警報器は都市ガス(軽い)8m以内・天井下30cm以内、LPG(重い)4m以内・床上30cm以内と対比で覚える。"},
{"c":"給排水衛生","q":"浄化槽に関する記述のうち、適当でないものはどれか。","a":["好気性微生物による処理では、有機物は主にメタンガスに分解される。","浄化槽の処理フローは、一般に前処理→一次処理→二次処理→消毒の順である。","二次処理の方式には、活性汚泥法と生物膜法がある。","浄化槽の設計では、流入BOD負荷量をg/日で求める。"],"ans":0,"ex":"【1級頻出】有機物がメタンガスに分解されるのは<b>嫌気性処理</b>。好気性処理では炭酸ガスと水に酸化分解される。嫌気=メタン、好気=CO₂の対応を押さえる。"},
{"c":"給排水衛生","q":"ある浄化槽に、BOD300mg/Lの排水が3m³/日、BOD100mg/Lの排水が7m³/日流入する。BOD除去率を90%とした場合の放流水のBOD濃度として正しいものはどれか。","a":["16mg/L","20mg/L","40mg/L","160mg/L"],"ans":0,"ex":"混合BOD=(300×3+100×7)/(3+7)=1,600/10=<b>160mg/L</b>。除去率90%なら放流水は160×(1−0.9)=<b>16mg/L</b>。流量で重み付けせず単純平均(200mg/L)にすると20mg/Lとなり誤る。"},
{"c":"機器・材料","q":"冷凍機に関する記述のうち、適当でないものはどれか。","a":["直だき吸収冷温水機は、ボイラー及び圧力容器安全規則(ボイラー法規)の適用を受ける。","低圧冷媒を用いる遠心冷凍機は、高圧ガス保安法の適用を受けない。","遠心冷凍機の容量制御は吸込みベーン制御が主で、低負荷時にはホットガスバイパスを併用する。","スクリュー冷凍機は、往復動式より高い圧縮比で運転できる。"],"ans":0,"ex":"直だき吸収冷温水機は機内が<b>大気圧以下(真空)</b>で運転されるため、ボイラー法規の適用を受けず資格者も不要。低圧冷媒遠心冷凍機が高圧ガス保安法適用外である点とセットで出題される。"},
{"c":"機器・材料","q":"送風機に関する記述のうち、適当でないものはどれか。","a":["プロペラ送風機は案内羽根を備え、400Pa以上の比較的高い静圧に対応できる。","斜流送風機は、軸流と遠心の中間的な特性をもち、静圧200〜400Pa程度の用途に用いられる。","横流(クロスフロー)送風機は、ファンコイルユニットやエアカーテンに用いられる。","後向き羽根送風機(ターボファン)は、多翼送風機より高い静圧(2,000〜3,000Pa程度)に適する。"],"ans":0,"ex":"案内羽根を備え高静圧に対応できるのは<b>ベーン軸流送風機</b>。プロペラ送風機は案内羽根がなく低静圧(換気扇など)用。軸流送風機3種(プロペラ・チューブ・ベーン)の違いが問われる。"},
{"c":"機器・材料","q":"空気調和機に関する記述のうち、適当でないものはどれか。","a":["冷温水コイルの面風速は、一般に5.0m/s程度とする。","デシカント空調機は、吸湿材により除湿を行い、潜熱処理と顕熱処理を分けて行える。","大温度差送風方式では、低負荷時に送風量が減り必要換気量が不足しないよう注意する。","潜熱顕熱分離方式では、外気処理コイルと室内負荷用コイルを分けて設ける。"],"ans":0,"ex":"【1級頻出】コイルの面風速は<b>2〜3m/s程度</b>(2.5m/s以下が目安)。5.0m/sでは凝縮水の飛散(キャリーオーバー)や圧力損失が過大になる。"},
{"c":"機器・材料","q":"保温・保冷材に関する記述のうち、適当でないものはどれか。","a":["グラスウール保温材は、発泡成形した独立気泡構造の材料である。","保温材の熱伝導率は、同じ材料でも密度により変化する。","JISにおいて「保温」とは常温以上の物体からの放熱を抑制すること、「保冷」とは常温以下の物体への熱侵入や表面結露を防止することをいう。","ロックウール保温材の使用温度上限は、グラスウール保温材より高い。"],"ans":0,"ex":"【1級頻出】発泡成形の独立気泡構造は<b>ポリスチレンフォーム</b>の特徴。グラスウールはガラス繊維を集合させた<b>繊維系</b>保温材で吸水性がある。使用温度上限はロックウール(約600°C)>グラスウール(約350°C)。"},
{"c":"機器・材料","q":"配管材料に関する記述のうち、適当でないものはどれか。","a":["フレキシブルジョイントは、配管の軸方向の熱伸縮を吸収する目的に適している。","架橋ポリエチレン管は、給水・給湯のいずれにも使用できる。","圧力配管用炭素鋼鋼管(STPG)の管厚は、スケジュール番号で表される。","水道用硬質ポリ塩化ビニル管(VP)は、設計圧力1.0MPa以下で使用される。"],"ans":0,"ex":"【1級頻出】フレキシブルジョイントは<b>偏心・振動・地震時の変位</b>吸収用で、軸方向伸縮には<b>不適</b>。軸方向の伸縮にはベローズ形やスリーブ形の<b>伸縮継手</b>を用いる。"},
{"c":"機器・材料","q":"ダクト及びダクト附属品に関する記述のうち、適当でないものはどれか。","a":["長辺が450mmを超える亜鉛鉄板ダクトには、450mmピッチで補強リブを設ける。","定風量ユニット(CAV)は、上流側の圧力が変動しても一定風量を保つ。","グラスウールダクトは、70°C以下の空気に使用する。","送風機とダクトの接続に用いるたわみ継手には、ピアノ線入りのガラスクロスなどを用いる。"],"ans":0,"ex":"【1級頻出】補強リブ(ダイヤモンドブレーキ等)は長辺450mm超のダクトに<b>300mm以下</b>のピッチで設ける。450mmは「対象となる長辺」の数値で、ピッチと混同させるひっかけ。"},
{"c":"設計図書","q":"公共工事標準請負契約約款に関する記述のうち、適当でないものはどれか。","a":["設計図書に定めのない仮設や施工方法については、監督員の指示によって定める。","請負代金内訳書には、法定福利費を明示する。","監督員が工事の施工部分を破壊して検査した場合、検査・復旧に要する費用は受注者の負担とする。","設計図書の表示が明確でない場合、受注者はその旨を監督員に通知し、発注者に確認を求める。"],"ans":0,"ex":"【1級頻出】設計図書に特別の定めがない仮設・施工方法その他工事目的物を完成するために必要な一切の手段は、<b>受注者がその責任において定める</b>。監督員の指示によるものではない。"},
{"c":"設計図書","q":"配管材料に関する記述のうち、適当でないものはどれか。","a":["耐衝撃性硬質ポリ塩化ビニル管(HIVP)は耐熱性に優れるため、給湯配管に用いられる。","排水用の硬質ポリ塩化ビニル管(VU)は、VPより肉厚が薄く、使用できる圧力は最も低い。","水道用亜鉛めっき鋼管(SGPW)は、配管用炭素鋼鋼管の白管より亜鉛付着量が多い。","一般配管用ステンレス鋼鋼管は薄肉のため、ねじ加工をせずメカニカル継手やプレス式継手で接続する。"],"ans":0,"ex":"HIVPは<b>耐衝撃性</b>を高めた管で、耐熱性はVPと同等。給湯には<b>耐熱性硬質ポリ塩化ビニル管(HTVP)</b>を用いる。HI(耐衝撃)とHT(耐熱)の記号の違いがひっかけ。"},
{"c":"施工管理","q":"工事に関する申請・届出書類とその提出先の組合せのうち、適当でないものはどれか。","a":["ばい煙発生施設設置届出書 ―― 市町村長","第一種圧力容器設置届 ―― 労働基準監督署長","消防用設備等設置届出書 ―― 消防長又は消防署長","危険物貯蔵所設置許可申請書 ―― 市町村長(消防本部を置く市町村)又は都道府県知事"],"ans":0,"ex":"【1級頻出】ばい煙発生施設(大気汚染防止法)の設置届出先は<b>都道府県知事</b>(政令市等の長)。市町村長への届出は特定建設作業(騒音・振動規制法)で、法律ごとの提出先を整理しておく。"},
{"c":"施工管理","q":"品質管理に用いる手法に関する記述のうち、適当でないものはどれか。","a":["パレート図は、折れ線グラフに管理限界線を記入し、品質の時間的な変化を管理するものである。","ヒストグラムは、データの分布状態を柱状に表し、ばらつきや規格値との関係を把握するものである。","散布図は、対応する2つのデータを打点し、相関関係の有無を調べるものである。","層別は、データを機械・材料・作業者などの要因別に分けて、ばらつきの原因を探る方法である。"],"ans":0,"ex":"【1級頻出】折れ線と<b>管理限界線</b>で時間的変化を見るのは<b>管理図</b>。パレート図は不良項目を大きい順に並べた棒グラフと累積曲線で<b>重点項目</b>を把握する図。QC7つ道具の定義入替えが定番。"},
{"c":"施工管理","q":"建設工事の安全管理に関する記述のうち、適当でないものはどれか。","a":["作業床の高さが10m以上の高所作業車の運転は、特別教育を修了した者が行う。","溶接・溶断などの火気を使用した作業終了後は、残火の有無を確認する。","ヒューマンエラーは意図しない誤りであり、意図的な不安全行動とは区別して対策を立てる。","100kg以上の荷の積卸し作業では、作業指揮者を定めて作業を指揮させる。"],"ans":0,"ex":"【1級頻出】作業床高さ<b>10m以上</b>の高所作業車の運転は<b>技能講習</b>修了者、<b>10m未満</b>は特別教育。「10m以上=特別教育」は逆。"},
{"c":"施工管理","q":"機器の据付けに関する記述のうち、適当でないものはどれか。","a":["防振基礎に設ける耐震ストッパーのボルトは、機器が動かないよう隙間なく堅固に締め付ける。","金属拡張アンカーでは、めねじ型よりおねじ型の方が引抜き力が大きい。","Vベルト駆動の送風機では、ベルトの下側が引張り側になるように設置する。","機器の耐震設計には、設置階に応じた設計用水平震度を用いる局部震度法が用いられる。"],"ans":0,"ex":"【1級頻出】防振基礎のストッパーは、通常運転時に防振機能を妨げないよう<b>適度な隙間</b>を設け、地震時のみ変位を抑える。堅固に締め付けると防振効果が失われる。"},
{"c":"施工管理","q":"配管の施工に関する記述のうち、適当でないものはどれか。","a":["フランジ接合のボルトは、片側から隣のボルトへ順に一周して締め付ける。","ポンプの吸込み管はできるだけ短くし、空気だまりができないよう配管する。","配管の水圧試験は、隠ぺい・埋設の前に区画ごとに行う。","冷媒用銅管の硬ろう付けは、管内に窒素ガスを流しながら行い酸化皮膜の生成を防ぐ。"],"ans":0,"ex":"【1級頻出】フランジのボルトは片締めを防ぐため<b>対角線上の順</b>に数回に分けて均等に締め付ける。隣順に締めるとガスケットが偏り漏れの原因になる。"},
{"c":"施工管理","q":"ダクトの施工に関する記述のうち、適当でないものはどれか。","a":["送風機の吐出し直後に風量調節ダンパーを設ける場合、ダンパーの軸は送風機の羽根車の軸と平行にする。","アングルフランジ工法のダクトのフランジへの折返し幅は5mm以上とする。","共板フランジ工法の押さえ金具(クリップ)は、再使用しない。","負圧となるダクトの点検口は外開き、正圧となるダクトの点検口は内開きとする。"],"ans":0,"ex":"【1級頻出】送風機吐出し直後は偏流があるため、ダンパー軸は羽根車の軸に対して<b>直角</b>にし、偏流の影響を受けにくくする。平行では片側の羽根だけに風が当たり騒音・振動の原因になる。"},
{"c":"法規","q":"労働安全衛生法上の安全衛生管理体制に関する記述のうち、誤っているものはどれか。","a":["安全委員会は、3か月に1回以上開催しなければならない。","統括安全衛生責任者は、作業間の連絡及び調整を統括管理する。","特定元方事業者は、作業場所を毎作業日に少なくとも1回巡視しなければならない。","安全管理者は、安全に係る技術的事項を管理する。"],"ans":0,"ex":"【1級頻出】安全委員会・衛生委員会は<b>毎月1回以上</b>開催する(安衛則第23条)。「数か月に1回」は誤り。巡視は毎作業日1回以上も頻出数値。"},
{"c":"法規","q":"労働安全衛生法令上、作業場の設備等に関する記述のうち、誤っているものはどれか。","a":["枠組足場の作業床の幅は、30cm以上とする。","高さ2m以上の作業床の端で墜落のおそれがある箇所には、囲い・手すり等を設ける。","機械間またはこれと他の設備との間に設ける通路の幅は、80cm以上とする。","高さまたは深さが1.5mを超える箇所で作業を行うときは、安全に昇降するための設備を設ける。"],"ans":0,"ex":"【1級頻出】足場の作業床の幅は<b>40cm以上</b>、床材間の隙間は3cm以下(安衛則第563条)。30cmは誤り。通路80cm・昇降設備1.5m超も頻出数値。"},
{"c":"法規","q":"労働基準法に関する記述のうち、誤っているものはどれか。","a":["使用者の責に帰すべき事由による休業の場合、使用者は平均賃金の80%以上の休業手当を支払わなければならない。","常時10人以上の労働者を使用する使用者は、就業規則を作成し行政官庁に届け出なければならない。","使用者は、労働契約の不履行について違約金を定め、または損害賠償額を予定する契約をしてはならない。","労働者が出産・疾病・災害などの非常の場合の費用に充てるために請求した場合、使用者は支払期日前でも既往の労働に対する賃金を支払わなければならない。"],"ans":0,"ex":"【1級頻出】休業手当は平均賃金の<b>60%以上</b>(労基法第26条)。80%ではない。就業規則の届出は常時<b>10人以上</b>も頻出。"},
{"c":"法規","q":"建築基準法上の用語等に関する記述のうち、誤っているものはどれか。","a":["建築物の部分によって階数が異なる場合は、これらのうち最小のものをその建築物の階数とする。","耐火性能とは、通常の火災が終了するまでの間、火災による建築物の倒壊及び延焼を防止するために必要な性能をいう。","住宅の居室には、原則として床面積の1/7以上の採光に有効な開口部を設けなければならない。","防火性能とは、建築物の周囲において発生する通常の火災による延焼を抑制するために外壁または軒裏に必要とされる性能をいう。"],"ans":0,"ex":"【1級頻出】階数が部分によって異なる場合は<b>最大</b>のものを階数とする(建基法施行令第2条)。最小ではない。採光1/7、防火性能=外壁・軒裏も定番。"},
{"c":"法規","q":"建築基準法令上の建築設備に関する記述のうち、誤っているものはどれか。","a":["ガスを燃料とするボイラーの煙突は、地盤面からの高さに関する煙突の規定の適用を受ける。","防火ダンパーの点検口は、一辺の長さが45cm以上とする。","防火ダンパーと防火区画との間の風道は、厚さ1.5mm以上の鉄板で造る。","冷却塔を屋上に2台設置する場合、原則として相互に2m以上離す。"],"ans":0,"ex":"【1級頻出】煙突の高さ等の規定(建基法施行令第115条)は、<b>ガス事業法等の適用を受けるガス燃焼設備の排気筒には適用されない</b>。FD点検口45cm・鉄板1.5mm・冷却塔2mの数値も頻出。"},
{"c":"法規","q":"建設業法上、元請負人の義務に関する記述のうち、誤っているものはどれか。","a":["元請負人は、発注者から完成払(工事完成後の支払)を受けたときは、その日から2月以内に下請負人に下請代金を支払わなければならない。","元請負人は、工程の細目や作業方法を定めようとするときは、あらかじめ下請負人の意見を聴かなければならない。","元請負人は、下請代金のうち労務費に相当する部分については、現金で支払うよう適切な配慮をしなければならない。","元請負人は、下請負人から工事完成の通知を受けたときは、20日以内でできる限り短い期間内に完成検査を完了しなければならない。"],"ans":0,"ex":"【1級頻出】元請負人は支払を受けた日から<b>1月以内</b>でできる限り短い期間内に下請代金を支払う(建設業法第24条の3)。完成検査20日以内・引渡し申出があれば直ちに引渡し、とセットで覚える。"},
{"c":"法規","q":"屋内消火栓設備に関する記述のうち、誤っているものはどれか。","a":["易操作性1号消火栓の放水圧力は、0.7MPaを超えるものとする。","易操作性1号消火栓の立上り管の管径は、50mm以上とする。","易操作性1号消火栓は、ノズルを開閉できる装置を備える。","加圧送水装置には、ポンプの性能を試験するための配管設備を設ける。"],"ans":0,"ex":"1号消火栓の放水圧力は<b>0.17MPa以上0.7MPa以下</b>(2号は0.25〜0.7MPa)。0.7MPaは上限であり「超える」は誤り。放水量は1号130L/min以上、2号60L/min以上。"},
{"c":"法規","q":"建設工事に係る資材の再資源化等に関する法律(建設リサイクル法)に関する記述のうち、誤っているものはどれか。","a":["対象建設工事の受注者は、工事着手の7日前までに分別解体等の計画を都道府県知事に届け出なければならない。","工事現場から50km以内に再資源化施設がない場合など、木材の再資源化が困難なときは縮減(焼却等)で足りる。","対象建設工事の請負契約書には、分別解体等の方法や再資源化等に要する費用などを記載しなければならない。","元請業者は、再資源化等が完了したときは、発注者に書面で報告しなければならない。"],"ans":0,"ex":"【1級頻出】分別解体等の計画の届出は<b>発注者(または自主施工者)</b>が工事着手の7日前までに行う(第10条)。受注者ではない。完了報告は<b>元請業者→発注者</b>の書面で行う。"},
{"c":"法規","q":"フロン類の使用の合理化及び管理の適正化に関する法律(フロン排出抑制法)に関する記述のうち、誤っているものはどれか。","a":["フロン類破壊業者は、破壊を終えたときに破壊証明書を交付する義務はない。","第一種フロン類充填回収業を行う者は、都道府県知事の登録を受けなければならない。","第一種特定製品へのフロン類の充填は、第一種フロン類充填回収業者が行わなければならない。","充填回収業者は、フロン類を充填したときは、管理者に充填証明書を交付しなければならない。"],"ans":0,"ex":"【1級頻出】破壊業者・再生業者は処理を終えた後、<b>破壊証明書・再生証明書を充填回収業者に送付</b>し、充填回収業者から管理者へ回付される。「交付義務なし」は誤り。"},
{"c":"法規","q":"廃棄物の処理及び清掃に関する法律に関する記述のうち、誤っているものはどれか。","a":["産業廃棄物の処分を受託した者は、管理票の交付日から90日以内に、管理票の写しを交付者に送付しなければならない。","産業廃棄物の処理を委託した事業者は、委託契約書を契約終了の日から5年間保存しなければならない。","ゴムくず、金属くず、ガラスくずなどは安定型産業廃棄物である。","事業者が自ら産業廃棄物を処理する場合も、産業廃棄物処理基準に従わなければならない。"],"ans":0,"ex":"【1級頻出】運搬・処分の受託者は<b>終了後10日以内</b>に管理票の写しを送付する。90日(運搬・中間処理)・180日(最終処分)は<b>交付者側</b>が写しの送付を受けないときに確認・報告すべき期限で、受託者の送付期限と混同させる。"},
{"c":"応用能力","q":"施工計画に関する記述のうち、適当でないものはどれか。","a":["施工計画書のうち特記事項として承諾を要する事項も、監督員の承諾を受けずに施工を進めてよい。","総合工程表は、仮設工事から完成時の後片付け・清掃までを含めて作成する。","設計図書に品質・性能が明示されていない材料は、中等の品質のものを用いる。","仮設・施工方法等は、設計図書に特別の定めがない限り受注者がその責任で定める。"],"ans":0,"ex":"施工計画書で特記事項(承諾を要する事項)に該当するものは、<b>監督員の承諾を受けた上で</b>施工する。「承諾不要」は誤り。中等品質(民法・約款)、仮設は受注者責任、も頻出。"},
{"c":"応用能力","q":"工程管理に関する記述のうち、適当でないものはどれか。","a":["フリーフロートを使い切ると、後続作業の最早開始時刻が遅れる。","工程表の作成では、下請負人の施工能力や機器の製作日数を考慮する。","ネットワーク工程表は、計画変更や遅れに対する修正・調整が比較的容易である。","工期短縮の検討では、作業の順序入替えや並行作業の可能性も検討する。"],"ans":0,"ex":"<b>フリーフロート</b>はその作業内で自由に使っても<b>後続作業の最早開始に影響しない</b>余裕時間。使い切ると後続に影響するのは<b>トータルフロート</b>(ディペンデントフロートを含む)の方。"},
{"c":"応用能力","q":"品質管理に関する記述のうち、適当でないものはどれか。","a":["配管の水圧試験や機器の試運転調整は、検査行為であって品質管理には含まれない。","設計図書に示された品質・性能は、満足すべき品質の下限を示している。","再現性のある製品や連続体の検査には、抜取検査が適している。","計量抜取検査は、品質特性値が正規分布に従うことを前提としている。"],"ans":0,"ex":"管工事の品質管理は、材料検査・水圧試験・風量調整・<b>試運転調整</b>までを含めて施工全体で品質を作り込む活動であり、試験や試運転調整も品質管理に<b>含まれる</b>。"},
{"c":"応用能力","q":"建設工事の安全管理に関する記述のうち、適当でないものはどれか。","a":["手掘りによる地山の掘削作業では、掘削面の高さが5m以上となる場合に地山の掘削作業主任者を選任する。","高さ8m以上の登り桟橋には、7m以内ごとに踊場を設ける。","建設業の三大災害とは、墜落・転落災害、建設機械・クレーン等災害、倒壊・崩壊災害をいう。","化学物質の安全データシート(SDS)は、供給者(譲渡・提供者)が取扱事業者に提供する。"],"ans":0,"ex":"地山の掘削作業主任者の選任は、掘削面の高さが<b>2m以上</b>となる場合(安衛令第6条)。5mではない。SDSの提供方向(供給者→取扱側)を逆にした選択肢も出題される。"},
{"c":"応用能力","q":"配管の施工に関する記述のうち、適当でないものはどれか。","a":["鋼管と銅管など異種金属管の接合部には、電食防止のためフレキシブルジョイントを用いる。","管径100mmの排水横走り管には、15m以内ごとに掃除口を設ける。","自動エア抜き弁は、配管内が常に正圧となる箇所に設ける。","通気横走り管は、通気立て管に向かって上り勾配とする。"],"ans":0,"ex":"異種金属の接触による<b>ガルバニック腐食(電食)</b>防止には<b>絶縁継手(絶縁フランジ)</b>を用いる。フレキシブルジョイントは変位・振動吸収用で、絶縁機能はない。"},
{"c":"原論・基礎","q":"地球環境に関する記述のうち、適当でないものはどれか。","a":["アンモニアは、オゾン層破壊係数はほぼ0であるが、地球温暖化係数は二酸化炭素よりはるかに大きい。","酸性雨とは、一般にpH5.6以下の雨をいい、硫黄酸化物や窒素酸化物が主な原因物質である。","HCFCは、オゾン層保護のため国内での生産は全廃されているが、既存機器での使用は禁止されていない。","SDGs(持続可能な開発目標)は、17のゴールと169のターゲットで構成されている。"],"ans":0,"ex":"【1級頻出】アンモニア(R717)は自然冷媒で、<b>ODP・GWPともにほぼ0</b>。酸性雨はpH5.6以下、SDGsは17ゴール、HCFCは2020年に国内生産全廃(使用は可)が押さえどころ。"},
{"c":"原論・基礎","q":"配管内のウォーターハンマーに関する記述のうち、適当でないものはどれか。","a":["弁を急閉鎖したときの圧力上昇の大きさは、管内流速に反比例する。","圧力上昇はジュコフスキーの式で求められ、流体の密度が大きいほど大きくなる。","硬質ポリ塩化ビニル管は鋼管に比べ弾性が大きく、ウォーターハンマーが発生しにくい。","圧力波の伝播速度は、管材の弾性係数が大きいほど速くなる。"],"ans":0,"ex":"【1級頻出】ジュコフスキーの式 ΔP=ρ・a・v より、圧力上昇は<b>流速vと密度ρに比例</b>する。弾性の大きい塩ビ管は圧力波の伝播速度aが遅いため、鋼管より発生しにくい。"},
{"c":"原論・基礎","q":"ピトー管による流速測定に関する記述のうち、適当でないものはどれか。","a":["測定される流速は、全圧と静圧の差(動圧)に正比例する。","ピトー管は、全圧と静圧を同時に検出し、その差から流速を求める計器である。","動圧をマノメーターの液柱高さhで測ると、流速はhの平方根に比例する。","空気の動圧は、空気密度をρ、流速をvとすると ρv²/2 で表される。"],"ans":0,"ex":"動圧Pd=ρv²/2 → v=√(2Pd/ρ) であり、流速は動圧(液柱高さh)の<b>平方根に比例</b>する。「正比例」とするのが典型的なひっかけ。"},
{"c":"原論・基礎","q":"熱に関する記述のうち、適当でないものはどれか。","a":["断熱系で不可逆変化が起こると、系のエントロピーは減少する。","比熱比(定圧比熱/定容比熱)は、常に1より大きい。","エンタルピーは、内部エネルギーと膨張仕事(圧力×体積)の和で表される。","カルノーサイクルは、等温膨張・断熱膨張・等温圧縮・断熱圧縮の4過程からなる。"],"ans":0,"ex":"【1級頻出】エントロピー増大の法則:断熱系の不可逆変化でエントロピーは必ず<b>増大</b>する。Cp>Cvなので比熱比κ=Cp/Cv>1、エンタルピーh=u+pv。"},
{"c":"原論・基礎","q":"燃焼に関する記述のうち、適当でないものはどれか。","a":["固体燃料は、理論空気量に近い空気量で完全燃焼させることができる。","理論空気量とは、燃料を完全燃焼させるのに理論上必要な最小の空気量をいう。","理論燃焼ガス量とは、理論空気量で完全燃焼したときに生じる燃焼ガス量をいう。","空気過剰率を大きくしすぎると、排ガスによる熱損失が増加する。"],"ans":0,"ex":"固体燃料は空気と混合しにくいため<b>空気過剰率を大きく</b>取る必要がある。理論空気量に近い空気量(空気過剰率1.1程度)で完全燃焼できるのは気体燃料。過剰空気が多いほど排ガス熱損失が増える。"},
{"c":"原論・基礎","q":"湿り空気に関する記述のうち、適当でないものはどれか。","a":["湿り空気を、露点温度より高い表面温度の冷却コイルで冷却すると、絶対湿度は上昇する。","飽和空気を加熱すると、絶対湿度は変わらず相対湿度は低下する。","水スプレーで加湿すると、湿球温度はほぼ一定のまま乾球温度が低下する。","蒸気で加湿すると、絶対湿度と相対湿度はともに上昇する。"],"ans":0,"ex":"【1級頻出】コイル表面温度が露点以上なら結露(除湿)しないため<b>絶対湿度は不変</b>で、相対湿度が上昇する。水噴霧=断熱加湿(湿球温度一定)、蒸気加湿=乾球温度ほぼ一定で絶対湿度増。"},
{"c":"原論・基礎","q":"電気設備に関する記述のうち、適当でないものはどれか。","a":["低圧とは、交流にあっては750V以下、直流にあっては600V以下の電圧をいう。","単相3線式は、100Vと200Vの二つの電圧が得られる配電方式である。","スターデルタ始動では、始動電流と始動トルクがともに直入れ始動の1/3になる。","D種接地工事は、300V以下の低圧用機器の金属製外箱等に施し、接地抵抗値は100Ω以下とする。"],"ans":0,"ex":"【1級頻出】低圧は<b>交流600V以下・直流750V以下</b>(高圧は7,000V以下、超えると特別高圧)。交流と直流の数値を入れ替えるひっかけに注意。D種は300V以下・100Ω以下。"},
{"c":"原論・基礎","q":"電気設備工事に関する記述のうち、適当でないものはどれか。","a":["合成樹脂製可とう電線管(PF管)相互の接続は、管端を差し込んで直接接続する。","三相3線式回路の電線は、3本を同一の金属管内に収める。","CD管は、直接コンクリートに埋め込んで施設する。","電線の接続は、ボックス内で行い、電線管内では行わない。"],"ans":0,"ex":"PF管・CD管相互の接続は専用の<b>カップリング</b>を用いる。三相の電線を別々の金属管に入れると電磁誘導で管が発熱するため同一管に収める。CD管は自己消火性がないためコンクリート埋込専用。"},
{"c":"原論・基礎","q":"建築材料に関する記述のうち、適当でないものはどれか。","a":["複層ガラスは、2枚のガラスの間に特殊フィルムを挟んで加熱圧着したもので、破損時に破片が飛散しにくい。","強化ガラスは、破損すると細かい粒状になるため、安全性が高い。","石こうボードは、石こうに含まれる結晶水が火災時に熱を吸収するため、耐火性に優れる。","グラスウール等の多孔質材料は、低音域よりも高音域の吸音性に優れる。"],"ans":0,"ex":"2枚のガラスを中間膜で接着して飛散を防ぐのは<b>合わせガラス</b>。複層ガラスは乾燥空気層を挟んだ断熱・結露防止用。両者を入れ替える定番のひっかけ。"},
{"c":"空調","q":"コージェネレーションシステムに関する記述のうち、適当でないものはどれか。","a":["年間の総合効率は電力需要のみで決まり、熱需要の大きさには影響されない。","マイクロガスタービン発電装置は、所定の条件を満たせば電気主任技術者の選任が不要である。","ガスタービン方式は、排ガスボイラーにより高温の排熱から蒸気を回収できる。","非常用発電機と兼用できる構成とすれば、事業継続計画(BCP)の対策としても有効である。"],"ans":0,"ex":"【1級頻出】総合効率(発電+排熱利用)は<b>排熱をどれだけ利用できるか</b>で決まり、熱需要が小さいと排熱を捨てて効率が低下する。年間熱需要に合わせた機器容量選定が重要。"},
{"c":"空調","q":"換気に関する記述のうち、適当でないものはどれか。","a":["室内の汚染物質を希釈するための必要換気量は、室の容積に比例して決まる。","密閉式燃焼器具のみを設けた室は、火気使用室としての換気設備を設けなくてよい。","第二種換気は、室内を正圧に保ち、周囲からの汚染空気の侵入を防ぐ。","喫煙室は室内を負圧に保ち、出入口の開口部で0.2m/s以上の気流を確保する。"],"ans":0,"ex":"【1級頻出】必要換気量は<b>汚染物質の発生量と許容濃度</b>で決まり(Q=M/(C−Co))、室容積には直接関係しない。換気回数[回/h]=換気量÷室容積と混同しやすい。"},
{"c":"空調","q":"建築基準法上の機械排煙設備に関する記述のうち、適当でないものはどれか。","a":["2以上の防煙区画を受け持つ排煙機の風量は、最大防煙区画の床面積1m²につき1m³/min以上とする。","排煙ダクトの立てダクトには、原則として防火ダンパーを設けない。","予備電源は、30分間以上継続して排煙設備を作動できる容量とし、常用電源が断たれた際に自動的に切り替わるものとする。","排煙機は、280℃の排煙に対して30分間以上耐えられる性能を有するものとする。"],"ans":0,"ex":"【1級頻出】排煙機能力は120m³/min以上かつ、<b>1区画なら1m³/(min・m²)、2以上の区画を担当するなら最大区画の2m³/(min・m²)以上</b>。予備電源30分、排煙機耐熱280℃・30分。"},
{"c":"給排水衛生","q":"給湯設備に関する記述のうち、適当でないものはどれか。","a":["架橋ポリエチレン管の線膨張係数は、ステンレス鋼管より小さい。","真空式・無圧式温水発生機は、缶体内の温水が100℃を超えることがなく、ボイラーに該当しない。","返湯管の管径は、循環流量と管内流速から決定する。","中央式給湯の配管をリバースリターン方式とすると、各系統の循環量を均等化しやすい。"],"ans":0,"ex":"【1級頻出】樹脂管(架橋PE・ポリブテン)の線膨張係数は鋼管・SUS管の<b>約10倍</b>と大きく、伸縮対策が必要。真空式温水発生機は減圧状態で100℃を超えず、ボイラー技士も不要。"},
{"c":"給排水衛生","q":"排水・通気設備に関する記述のうち、適当でないものはどれか。","a":["伸頂通気方式における排水横主管の許容流量は、各個通気方式・ループ通気方式と同じ値を用いる。","各個通気管は、器具トラップのウエアより低い位置で排水管に接続してはならない。","グリース阻集器の容量は、掃除周期の長短が関係する。","間接排水は、排水の種類・水質ごとに系統を分けて排水する。"],"ans":0,"ex":"【1級頻出】伸頂通気方式は通気立て管がなく圧力緩和能力が低いため、<b>許容流量は各個・ループ通気方式より小さく</b>取る。各個通気管の取出しはトラップウエアより高い位置から。"},
{"c":"給排水衛生","q":"排水設備に関する記述のうち、適当でないものはどれか。","a":["汚水ますのインバートは、流入管と流出管の管底高さが同じになるよう平坦に仕上げる。","排水槽の水中ポンプは、有効貯水量を10〜20分程度で排出できる容量とする。","排水用水中ポンプは、汚水用・雑排水用・汚物用に区分される。","排水槽の水中ポンプは、原則として2台一組とし、自動交互運転とする。"],"ans":0,"ex":"汚水ますのインバートは流れを円滑にするため<b>下流側を低くして段差(落差)</b>を設ける。ポンプ容量は有効貯水量を10〜20分で排出、2台交互運転(非常時同時運転)が基本。"},
{"c":"給排水衛生","q":"ガス設備に関する記述のうち、適当でないものはどれか。","a":["ウォッベ指数とは、ガス1m³を完全燃焼させたときの発熱量をいう。","家庭用の液化石油ガスは、プロパン含有率の高い「い号」が主流である。","都市ガスの中圧Aは0.3MPa以上1.0MPa未満、中圧Bは0.1MPa以上0.3MPa未満の供給圧力である。","液化石油ガスの供給設備・消費設備の工事は、液化石油ガス設備士が行う。"],"ans":0,"ex":"【1級頻出】ウォッベ指数=<b>発熱量÷√比重</b>で、燃焼器具に対するガスの互換性(燃焼性)を表す指標。い号はプロパン+プロピレン80%以上。中圧A・Bの圧力区分も頻出。"},
{"c":"給排水衛生","q":"浄化槽に関する記述のうち、適当でないものはどれか。","a":["小規模合併処理浄化槽の処理方式は、分離接触ばっ気方式と脱窒ろ床接触ばっ気方式の2種類である。","二次処理は、微生物の代謝作用により溶存有機物を除去する工程である。","BOD除去率[%]は、(流入水BOD−放流水BOD)/流入水BOD×100 で表される。","BOD負荷量[g/日]は、流入水のBOD濃度に汚水量を乗じて求める。"],"ans":0,"ex":"【1級頻出】小規模(50人以下)合併処理浄化槽は<b>分離接触ばっ気・嫌気ろ床接触ばっ気・脱窒ろ床接触ばっ気の3方式</b>。BOD負荷量=濃度[mg/L]×汚水量[m³/日]→[g/日]。"},
{"c":"機器・材料","q":"送風機に関する記述のうち、適当でないものはどれか。","a":["多翼送風機(シロッコファン)は、羽根車の強度が高いため高速回転に適し、高い静圧を出せる。","斜流送風機は、小型で風量が大きく、静圧も比較的高い。","ベーン型軸流送風機は、チューブラ型軸流送風機より高効率・高圧力が得られる。","横流送風機は、ルームエアコンやエアカーテンなどに用いられる。"],"ans":0,"ex":"【1級頻出】多翼送風機は前向き羽根で<b>強度が低く高速回転に不向き</b>、低圧(〜1kPa程度)用。高圧には後向き羽根(ターボ)送風機(2〜3kPa)が適する。"},
{"c":"機器・材料","q":"吸収冷凍機に関する記述のうち、適当でないものはどれか。","a":["二重効用吸収冷凍機では、高温再生器と低温再生器を高圧蒸気で同時に加熱する。","直だき吸収冷温水機は、バーナーの燃焼量を調節して容量制御を行う。","直だき吸収冷温水機には、蒸発器から温水を取り出す方式のものがある。","二重効用の高温再生器には、高圧蒸気や燃焼ガスなど高温の加熱媒体が必要である。"],"ans":0,"ex":"二重効用は高温再生器で発生した<b>冷媒蒸気の凝縮熱で低温再生器を加熱</b>し、熱を二段利用して成績係数を高める。外部熱源で加熱するのは高温再生器のみ。"},
{"c":"機器・材料","q":"ダクト及びダクト附属品に関する記述のうち、適当でないものはどれか。","a":["同じ断面積・同じ風量であれば、長方形ダクトの方が円形ダクトより圧力損失が小さい。","ピストンダンパーは、消火ガス放出時のガス圧で自動的に閉鎖するダンパーである。","グラスウールダクトは、使用温度が75℃以下のダクトに用いられる。","スパイラルダクトは、甲はぜが補強の役割を果たすため、同一板厚の丸ダクトより強度が高い。"],"ans":0,"ex":"同じ断面積なら<b>円形ダクトが周長(摩擦面)最小</b>で圧力損失が最も小さい。長方形はアスペクト比が大きいほど不利。ピストンダンパーはガス消火区画の換気ダクトに設ける。"},
{"c":"設計図書","q":"公共工事標準請負契約約款に関する記述のうち、適当でないものはどれか。","a":["受注者は、発注者が設計図書を変更したため請負代金額が1/2以上減少するときに限り、契約を解除できる。","発注者は、工事目的物の引渡し前であっても、受注者の承諾を得れば工事目的物の全部又は一部を使用できる。","受注者は、工事現場に搬入した工事材料を、監督員の承諾なく工事現場外に搬出してはならない。","設計図書に定めのない仮設及び施工方法等は、受注者がその責任において定める。"],"ans":0,"ex":"【1級頻出】受注者の解除権は、設計図書変更で請負代金額が<b>2/3以上減少</b>するとき、又は工事の中止期間が工期の10分の5(6月を超えるときは6月)を超えるとき。仮設・施工方法は受注者責任で定める。"},
{"c":"設計図書","q":"配管材料とJIS規格記号の組合せのうち、適当でないものはどれか。","a":["架橋ポリエチレン管(二層管) ― M","配管用炭素鋼鋼管 ― SGP","圧力配管用炭素鋼鋼管 ― STPG","水道用硬質ポリ塩化ビニル管 ― VP"],"ans":0,"ex":"JIS K 6769の架橋ポリエチレン管は<b>単層管がM種、二層管がE種</b>。SGP(黒管/白管)、STPG(スケジュール番号で肉厚区分)、VP/HIVP(水道用)の対応は暗記必須。"},
{"c":"施工管理","q":"申請書等と提出先の組合せのうち、適当でないものはどれか。","a":["高圧ガス製造許可申請書 ― 労働基準監督署長","騒音規制法の特定施設設置届出書 ― 市町村長","小型ボイラー設置報告書 ― 労働基準監督署長","振動規制法の特定建設作業実施届出書 ― 市町村長"],"ans":0,"ex":"【1級頻出】高圧ガス保安法の製造許可・届出は<b>都道府県知事</b>。労基署長はボイラー・圧力容器関係(設置届、小型ボイラー設置報告)。騒音・振動の特定施設/特定建設作業は市町村長。"},
{"c":"施工管理","q":"工事現場の安全管理に関する記述のうち、適当でないものはどれか。","a":["特別高圧の架空電線の近くで作業する場合、電線から1.2m以上離れていれば感電防止の措置は不要である。","重大災害が発生した場合は、所轄労働基準監督署長に速やかに報告する。","汚水ピット内で作業を行う前に、酸素濃度及び硫化水素濃度を測定する。","ハインリッヒの法則では、1件の重大災害の背後に29件の軽傷災害と300件のヒヤリハットがあるとされる。"],"ans":0,"ex":"特別高圧(7,000V超)の架空電線に接近する作業では、絶縁用防護具の装着ができないため<b>2m以上</b>の離隔を確保するか監視人を置く。1.2mは高圧(低圧は1m)の目安と混同させるひっかけ。"},
{"c":"施工管理","q":"配管の施工に関する記述のうち、適当でないものはどれか。","a":["硬質塩化ビニルライニング鋼管の切断には、能率の良いチップソーカッターや高速砥石切断機を用いる。","蒸気横走り管を形鋼で下方から支持する場合は、ローラ金物を用いて伸縮を逃がす。","気温が−5℃を下回る場合や強風時は、溶接作業を中止する。","混合型電動三方弁は、冷温水コイルの還り管側に設ける。"],"ans":0,"ex":"ライニング鋼管の切断は<b>帯のこ盤・弓のこ盤</b>等で行う。チップソーや高速砥石は摩擦熱でライニング材が溶融・損傷するため不可。三方弁は混合型=還り側、分流型=往き側。"},
{"c":"施工管理","q":"保温・保冷材料に関する記述のうち、適当でないものはどれか。","a":["グラスウール保温材の24K・32Kなどの表示は、耐熱温度[℃]の区分を表す。","ホルムアルデヒド放散等級F☆☆☆☆は、☆の数が多いほど放散量が少ない。","ポリスチレンフォーム保温材は、独立気泡構造のため吸水・吸湿が少ない。","ステンレス鋼板製貯湯タンクは、エポキシ系塗装などで保温材と絶縁する。"],"ans":0,"ex":"24K・32Kは<b>密度[kg/m³]</b>の区分(24K=24kg/m³)。密度が大きいほど熱伝導率は小さくなる。グラスウールの使用温度上限は約350℃、ロックウールは約600℃。"},
{"c":"施工管理","q":"試運転調整に関する記述のうち、適当でないものはどれか。","a":["排水槽の水中ポンプは、満水警報が発報したときに自動交互運転に切り替わることを確認する。","ボイラーは、地震感知器の作動により燃料の供給が停止することを確認する。","冷凍機は、冷水ポンプ・冷却水ポンプ・冷却塔とのインターロックを確認する。","ポンプの軸受温度が、周囲温度+40℃以内であることを確認する。"],"ans":0,"ex":"【1級頻出】水中ポンプの交互運転は<b>水位(フロートスイッチ)で切り替え</b>、満水警報は異常水位の警報(2台同時運転)。揚水ポンプも高置タンクの水位電極で発停し、満水警報は停止信号ではない。"},
{"c":"施工管理","q":"金属材料の腐食に関する記述のうち、適当でないものはどれか。","a":["炭素鋼の腐食速度は、流速が増すと減少し、不動態化が生じる領域でのみ増加する。","異種金属が接触すると、イオン化傾向の大きい(卑な)金属の方が腐食する。","開放系の炭素鋼の腐食速度は、水温の上昇とともに増加し、80℃付近を境に減少する。","すきま腐食は、酸素濃淡電池の形成により進行する。"],"ans":0,"ex":"炭素鋼の腐食は溶存酸素の供給が律速のため、<b>流速が増すと腐食速度は増加</b>し、不動態皮膜が形成される領域で減少に転じる。開放系は80℃以上で溶存酸素が減り腐食速度が低下。"},
{"c":"法規","q":"特定元方事業者の労働者と関係請負人の労働者が同一の場所で50人以上作業する建設現場の安全衛生管理体制に関する記述のうち、「労働安全衛生法」上、誤っているものはどれか。","a":["統括安全衛生責任者を選任した特定元方事業者は、その者の指揮のもとに安全衛生推進者を選任しなければならない。","統括安全衛生責任者は、作業間の連絡調整や協議組織の設置運営など、統括管理すべき事項を統括管理する。","元方安全衛生管理者は、統括安全衛生責任者が統括管理する事項のうち技術的事項を管理する。","統括安全衛生責任者を選任すべき事業者以外の請負人は、安全衛生責任者を選任し、統括安全衛生責任者との連絡等を行わせる。"],"ans":0,"ex":"【1級頻出】混在現場50人以上:元請=<b>統括安全衛生責任者+元方安全衛生管理者</b>、下請=<b>安全衛生責任者</b>。安全衛生推進者は単一事業場(10〜49人)の制度で、混在現場の管理体制とは別物。"},
{"c":"法規","q":"労働安全衛生法に関する記述のうち、誤っているものはどれか。","a":["酸素欠乏危険場所で測定した酸素濃度の記録は、1年間保存しなければならない。","つり上げ荷重1t以上の移動式クレーンの玉掛け業務は、技能講習修了者が行う。","建築物の解体工事では、石綿等の使用の有無をすべての材料について事前に調査する。","酸素欠乏危険場所の換気には、純酸素を使用してはならない。"],"ans":0,"ex":"酸欠則:作業開始前の酸素(第2種は硫化水素も)濃度の測定記録は<b>3年間保存</b>。純酸素換気は火災・爆発の危険。玉掛けは1t以上が技能講習、1t未満が特別教育。"},
{"c":"法規","q":"建築基準法上の用語に関する記述のうち、誤っているものはどれか。","a":["地階で、小規模な事務室のみを設けた部分は、建築物の階数に算入しない。","居室の天井の高さは2.1m以上とし、一室で天井の高さが異なる場合はその平均の高さによる。","「建築」とは、建築物を新築し、増築し、改築し、又は移転することをいう。","避難階とは、直接地上へ通ずる出入口のある階をいう。"],"ans":0,"ex":"階数に算入しないのは、<b>昇降機塔等の屋上部分又は倉庫・機械室等の地階で、水平投影面積が建築面積の1/8以下</b>のもの。事務室(居室)を設けた地階は規模にかかわらず算入する。"},
{"c":"法規","q":"建築基準法上の用語に関する記述のうち、誤っているものはどれか。","a":["延焼のおそれのある部分とは、隣地境界線等から1階にあっては5m以下、2階以上にあっては3m以下の距離にある建築物の部分をいう。","建築物の給排水配管全体を更新する工事は、大規模の修繕に該当しない。","屋上の昇降機塔で、その水平投影面積の合計が建築面積の1/8以下のものは、階数に算入しない。","延べ面積は、建築物の各階の床面積の合計による。"],"ans":0,"ex":"【1級頻出】延焼のおそれのある部分は<b>1階:3m以下、2階以上:5m以下</b>(隣地境界線・道路中心線・同一敷地内の建築物相互の外壁間中心線から)。配管は主要構造部でないため大規模の修繕に非該当。"},
{"c":"法規","q":"建築基準法上の建築設備に関する記述のうち、誤っているものはどれか。","a":["火を使用する室の換気設備の風道が他の風道と接続する部分には、防煙ダンパーを設ける。","排水槽の底の勾配は、吸込みピットに向かって1/15以上1/10以下とする。","防火ダンパーと防火区画の間の風道は、厚さ1.5mm以上の鉄板で造る。","排水槽に設ける通気のための装置は、直接外気に衛生上有効に開放する。"],"ans":0,"ex":"【1級頻出】火気使用室の換気風道が他の風道と接続する部分には<b>防火ダンパー</b>を設ける。防煙ダンパーは煙感知器連動の防煙区画用で別物。排水槽底勾配1/15〜1/10、FD〜区画間は1.5mm以上鉄板。"},
{"c":"法規","q":"建設業法に関する記述のうち、誤っているものはどれか。","a":["建設業者が下請契約を締結せず自ら施工する工事では、主任技術者を置かなくてよい。","密接な関係のある2以上の工事を同一の場所で施工する場合は、同一の専任の主任技術者がこれらの工事を管理できる。","施工体制台帳には、下請負人の健康保険等の加入状況を記載する。","施工体系図は、工事期間中、工事関係者が見やすい場所に掲げなければならない。"],"ans":0,"ex":"主任技術者は<b>建設業者が請け負った全ての建設工事</b>に、下請の有無・金額にかかわらず配置義務がある。監理技術者が必要なのは元請で下請総額4,500万円以上(建築一式7,000万円以上)の場合。"},
{"c":"法規","q":"1号消火栓を用いる屋内消火栓設備のポンプに関する記述のうち、「消防法」上、誤っているものはどれか。","a":["ポンプの吐出量は、屋内消火栓の設置個数が最も多い階の個数(最大4)に120L/minを乗じた量以上とする。","ポンプの吐出側には圧力計を、吸込側には連成計を設ける。","ポンプは、定格吐出量の150%の吐出量で、全揚程が定格全揚程の65%以上であること。","ポンプの始動を明示する表示灯は赤色とし、消火栓箱の内部又はその直近に設ける。"],"ans":0,"ex":"【1級頻出】1号消火栓:ポンプ吐出量=<b>設置個数(最大2)×150L/min</b>以上、放水圧力0.17〜0.7MPa、水源水量2.6m³×個数(最大2)。2号消火栓は最大2個×70L/min。"},
{"c":"法規","q":"不活性ガス消火設備に関する記述のうち、「消防法」上、誤っているものはどれか。","a":["非常電源は、当該設備を3時間作動させることができる容量とする。","手動起動装置は、防護区画ごとに設ける。","貯蔵容器は、防護区画以外の場所に設ける。","配管は専用とし、貯蔵容器から噴射ヘッドまでの落差は50m以下とする。"],"ans":0,"ex":"不活性ガス消火設備の非常電源は<b>1時間</b>作動できる容量(屋内消火栓・スプリンクラーは30分)。手動起動装置は防護区画ごとに出入口付近、操作部は床面0.8〜1.5m。"},
