{"c":"法規","q":"建設工事に係る資材の再資源化等に関する法律(建設リサイクル法)に関する記述のうち、誤っているものはどれか。","a":["管工事業の許可を受けている者が解体工事業を営む場合は、都道府県知事の登録を受ける必要はない。","対象建設工事の請負契約の当事者は、分別解体等の方法・費用等を書面に記載し、相互に交付しなければならない。","建築物の修繕・模様替等の工事(設備工事のみの工事を含む)は、請負代金の額が1億円以上のものが対象建設工事となる。","元請業者は、下請負人に対して分別解体等の計画等を告知しなければならない。"],"ans":0,"ex":"解体工事業の登録が不要なのは<b>土木・建築・解体工事業の許可業者</b>のみ。管工事業等の他業種の許可では、解体工事(500万円未満)を業として行うには知事登録が必要。"},
{"c":"法規","q":"フロン類の使用の合理化及び管理の適正化に関する法律に関する記述のうち、誤っているものはどれか。","a":["フロン類破壊業者は、都道府県知事の許可を受けなければならない。","第一種特定製品とは、業務用のエアコンディショナー及び冷凍冷蔵機器であって、フロン類が冷媒として充塡されているものをいう。","第一種フロン類充塡回収業者は、都道府県知事の登録を受けなければならない。","第二種特定製品は、自動車に搭載されるエアコンディショナーである。"],"ans":0,"ex":"【1級頻出】破壊業者・再生業者は<b>環境大臣及び経済産業大臣の許可</b>。充塡回収業者は<b>都道府県知事の登録</b>。「許可/登録」と「大臣/知事」の組合せを入れ替えるひっかけが定番。"},
{"c":"法規","q":"廃棄物の処理及び清掃に関する法律に関する記述のうち、誤っているものはどれか。","a":["産業廃棄物処分業の許可を受けた者は、処分とあわせてその産業廃棄物の収集運搬も一括して受託できる。","専ら再生利用の目的となる産業廃棄物のみの収集運搬・処分を業として行う者に委託する場合は、産業廃棄物管理票の交付を要しない。","電子マニフェストを利用した場合、排出事業者は産業廃棄物管理票交付等状況報告書を都道府県知事に提出する必要がない。","事業場の外で産業廃棄物を保管する場合、保管面積が300m²以上のときは、あらかじめ都道府県知事に届け出なければならない。"],"ans":0,"ex":"収集運搬と処分はそれぞれ別の許可(<b>収集運搬業許可・処分業許可</b>)が必要で、処分業者が運搬も行うには運搬業の許可を要する。委託契約も運搬・処分それぞれと結ぶ(二者契約)。"},
{"c":"応用能力","q":"施工計画に関する記述のうち、適当でないものはどれか。","a":["現場代理人は、請負代金額の変更や請負代金の請求・受領に関する権限を有する。","設計図書に定めのない仮設及び施工方法は、受注者がその責任において定める。","道路使用許可は、着工前に所轄警察署長に申請する。","ばい煙発生施設の設置届は、工事開始の60日前までに都道府県知事に提出する。"],"ans":0,"ex":"公共工事標準請負契約約款では、現場代理人の権限から<b>請負代金額の変更・請求・受領、契約の解除等</b>が除かれている。ばい煙発生施設は大気汚染防止法により着工60日前に知事へ届出。"},
{"c":"応用能力","q":"ネットワーク工程表による工程管理に関する記述のうち、適当でないものはどれか。","a":["ダミーは所要日数0の疑似作業であるため、クリティカルパス上に位置することはない。","クリティカルパス以外の作業でも、フロートを使い切るとクリティカルパスになることがある。","配員計画(マンパワースケジューリング)は、作業ごとの必要人員を平準化する手法である。","総工事費が最小となる施工速度を経済速度といい、そのときの工期を最適工期という。"],"ans":0,"ex":"ダミー(破線矢印)は作業の前後関係のみを示すが、<b>前後の作業がクリティカルならダミーもクリティカルパス上にある</b>。トータルフロート0の経路はすべてCPになる。"},
{"c":"応用能力","q":"品質管理における検査に関する記述のうち、適当でないものはどれか。","a":["破壊検査を必要とする製品の検査は、全数検査とする。","検査は、全数検査と抜取検査に大別される。","取外しが困難な機器の試験や配管の水圧試験は、全数検査とする。","不良品を確実に取り除き良品だけを選別する必要がある場合は、全数検査とする。"],"ans":0,"ex":"【1級頻出】破壊検査(全数行えば製品が無くなる)・連続体・大量品は<b>抜取検査</b>。防火区画貫通処理、水圧試験、隠ぺい部、FD作動確認など不良が許されないものは<b>全数検査</b>。"},
{"c":"応用能力","q":"建設現場の安全管理に関する記述のうち、適当でないものはどれか。","a":["墜落制止用器具(フルハーネス型)の定期点検は、1年以内ごとに1回行えばよい。","5S活動とは、整理・整頓・清掃・清潔・しつけをいう。","就業の場所から他の就業の場所へ移動する途中の負傷は、通勤災害に該当する。","労働災害の休業日数は、休日を含めた暦日数で数える。"],"ans":0,"ex":"墜落制止用器具は使用前点検に加え、<b>6か月以内ごと</b>に定期点検を行う。通勤災害は住居〜就業場所、就業場所相互間の移動を含み、休業日数は休日を含む暦日で数える。"},
{"c":"応用能力","q":"機器の据付けに関する記述のうち、適当でないものはどれか。","a":["冷却塔の補給水口は、高置タンクの低水位面から1m程度の落差があればよい。","あと施工のメカニカルアンカーは、めねじ形より、おねじ形の方が許容引抜き力が大きい。","冷却塔は、排気が再循環して吸い込まれないよう、風通しの良い場所に設置する。","飲料用受水タンクの基礎は、架台を含めて高さ600mm以上とし、6面点検ができるようにする。"],"ans":0,"ex":"冷却塔のボールタップ補給水は、高置タンク低水位から<b>3m以上の落差</b>(約30kPa)を確保しないと補給不足になる。飲料用タンクは下部600mm以上、周囲・上部に点検空間。"},
{"c":"応用能力","q":"配管の施工に関する記述のうち、適当でないものはどれか。","a":["冷温水コイルへの配管は、コイル上部から冷温水を流入させ、下部から流出させる。","Uボルトは、配管の固定支持(アンカー)には用いない。","全揚程30mを超えるポンプの吐出側には、衝撃吸収式の逆止弁を設ける。","単式伸縮管継手は、継手本体の片側に固定点を設け、反対側に配管ガイドを設ける。"],"ans":0,"ex":"コイルの水配管は空気の流れに対して対向流とし、<b>下部入口・上部出口</b>として空気抜きを容易にする。単式伸縮管継手は片側固定・反対側ガイド、複式は本体を固定し両側にガイド。"},
{"c":"原論・基礎","q":"流体の性質に関する記述のうち、適当でないものはどれか。","a":["動粘性係数は、粘性係数を流体の速度で除した値である。","ベルヌーイの定理は、流線に沿って運動エネルギー・位置エネルギー・圧力エネルギーの和が一定であることを表す。","水の粘性係数は温度が低いほど大きく、空気の粘性係数は温度が低いほど小さい。","表面張力は、液体の表面積を小さくしようとして働く力である。"],"ans":0,"ex":"【1級頻出】動粘性係数ν=μ/ρ[m²/s](粘性係数÷<b>密度</b>)。液体の粘性は温度上昇で減少、気体の粘性は温度上昇で増加する。レイノルズ数Re=vD/νとセットで覚える。"},
{"c":"原論・基礎","q":"伝熱に関する記述のうち、適当でないものはどれか。","a":["流体の密度差による浮力で生じる流動によって熱が運ばれる現象を、強制対流熱伝達という。","熱放射は電磁波による熱移動であり、真空中でも伝わる。","固体内部の熱伝導による熱流は、温度勾配に比例する。","伝熱の三形態は、熱伝導・対流熱伝達・熱放射である。"],"ans":0,"ex":"【1級頻出】浮力(密度差)で駆動されるのは<b>自然対流</b>、ファンやポンプで強制的に流すのが強制対流。熱放射は媒体不要で真空中でも伝わる(太陽熱)。"},
{"c":"空調","q":"空調ゾーニングにおける、ゾーンの区分とその区分の根拠の組合せのうち、適当でないものはどれか。","a":["ペリメーターゾーンとインテリアゾーン ― 空気清浄度の違い","事務室と会議室 ― 使用時間の違い","事務室とサーバー室 ― 温湿度条件の違い","事務室と食堂 ― 負荷傾向の違い"],"ans":0,"ex":"ペリメーター(外周部)は外壁・窓の日射・貫流負荷で季節・時間変動が大きく、インテリアは年中冷房負荷のため<b>負荷傾向による区分</b>。清浄度による区分はクリーンルーム・手術室等。"},
{"c":"空調","q":"熱負荷に関する記述のうち、適当でないものはどれか。","a":["壁体の熱通過率は、壁体表面の気流速度には影響されない。","実効温度差は、壁体の構造(熱容量)や方位によって異なる。","室内を正圧に保つ空調方式では、隙間風による負荷を無視してよい。","熱伝導率の単位は W/(m・K) である。"],"ans":0,"ex":"熱通過率K=1/(1/αo+Σd/λ+1/αi)で、表面熱伝達率α(外側約23、内側約9W/(m²・K))は<b>気流速度で変化</b>するため、風速が増すとKも大きくなる。実効温度差は壁の時間遅れを考慮した値。"},
{"c":"空調","q":"ヒートポンプに関する記述のうち、適当でないものはどれか。","a":["空気熱源ヒートポンプは、外気温度が上昇すると暖房能力が低下する。","空気熱源ヒートポンプの除霜は、四方弁を切り替えて一時的に冷房サイクルで運転する方法が一般的である。","ヒートポンプ暖房は、凝縮器での放熱を利用する。","地下水を熱源とする場合は、水量が豊富で水温の変化が少ないことが条件となる。"],"ans":0,"ex":"【1級頻出】空気熱源HPは外気温が高いほど蒸発温度が上がり<b>暖房能力・COPが向上</b>する。外気温が低いと能力低下し、着霜により除霜運転も必要になる(冷房は逆)。"},
{"c":"空調","q":"汚染物質発生量M[m³/h]、室内許容濃度C、外気濃度Co、捕集率ηの空気清浄装置を通した外気で換気する場合、定常状態の必要換気量V[m³/h]を表す式として、適当なものはどれか。","a":["V = M / (C − (1−η)Co)","V = M / (C − ηCo)","V = M / ((1−η)(C − Co))","V = M(1−η) / (C − Co)"],"ans":0,"ex":"清浄装置通過後の外気濃度は(1−η)Coになるため、物質収支 M+V(1−η)Co=VC より <b>V=M/(C−(1−η)Co)</b>。η=0で通常のV=M/(C−Co)に帰着することで検算できる。"},
{"c":"給排水衛生","q":"給水設備の設計に関する記述のうち、適当でないものはどれか。","a":["器具給水負荷単位による方法では、負荷単位の合計に同時使用率を乗じて瞬時最大給水流量を求める。","クロスコネクション防止のため、上水と雑用水の配管は管材を変えるなどして識別する。","集合住宅の瞬時最大給水流量は、住戸数に応じた段階的な算定式で求める方法がある。","器具の使用形態(任意利用・集中利用)を確認して同時使用流量を算定する。"],"ans":0,"ex":"負荷単位法では、器具給水負荷単位の合計値から<b>同時使用流量線図(ハンター曲線)</b>で瞬時最大流量を読み取る。同時使用率を乗じるのは器具の同時使用水量法で別の方法。"},
{"c":"機器・材料","q":"冷却塔に関する記述のうち、適当でないものはどれか。","a":["エリミネーターは、飛散水滴を捕捉するため、塔本体の外部側面(空気吸込口)に取り付ける。","開放式冷却塔は、冷却水の一部が蒸発する際の潜熱によって冷却水を冷却する。","密閉式冷却塔は、開放式に比べ空気抵抗が大きく送風機動力が大きい。","冬季や梅雨期など外気温が低く湿度が高いときは、白煙が発生しやすい。"],"ans":0,"ex":"【1級頻出】エリミネーターは<b>充填材の上部・送風機側(塔内部)</b>に設け、排気に同伴する水滴(キャリーオーバー)を捕捉する。外部側面(吸込口)にあるのはルーバー。"},
{"c":"機器・材料","q":"全熱交換器に関する記述のうち、適当でないものはどれか。","a":["回転形全熱交換器では、給気と排気がロータ内を直交する方向に流れる。","全熱交換器は、顕熱と潜熱を同時に回収する。","静止形は、仕切板と間隔板で構成され、給気と排気はほとんど混合しない。","回転形は、顕熱交換効率と潜熱交換効率がほぼ等しい。"],"ans":0,"ex":"回転形はロータが回転し、給気と排気が<b>対向流</b>で流れて蓄熱体(エレメント)を介して熱・水分を交換する。静止形は直交流(クロスフロー)で、仕切板により給排気は分離される。"},
{"c":"法規","q":"建築物における衛生的環境の確保に関する法律(建築物衛生法)の空気環境の基準に関する記述のうち、誤っているものはどれか。","a":["ホルムアルデヒドの量は、1.0mg/m³以下とする。","一酸化炭素の含有率は、6ppm以下とする。","浮遊粉じんの量は、0.15mg/m³以下とする。","相対湿度は、40%以上70%以下とする。"],"ans":0,"ex":"ホルムアルデヒドは<b>0.1mg/m³(0.08ppm)以下</b>。CO 6ppm以下(令和4年改正、旧10ppm)、CO2 1,000ppm以下、浮遊粉じん0.15mg/m³以下、温度18〜28℃、湿度40〜70%、気流0.5m/s以下。"},
{"c":"原論・基礎","q":"日射に関する記述のうち、適当でないものはどれか。","a":["天空日射とは、太陽から大気を透過して直接地表面に到達する日射をいう。","大気透過率は大気中の水蒸気量や塵埃の量に左右され、水蒸気量が多いほど小さくなる。","太陽定数とは、大気圏外で太陽光線に垂直な面が受ける単位面積当たりの日射エネルギーをいう。","日射のエネルギーは、紫外線部よりも可視光線部および赤外線部に多く含まれる。"],"ans":0,"ex":"【1級頻出】大気を透過して直接地表に到達するのは<b>直達日射</b>。<b>天空日射</b>は大気中で散乱・反射されてから地表に届く日射で、両者を合わせて全天日射という。大気透過率は窒素や二酸化炭素ではなく<b>水蒸気量・塵埃</b>に影響される点も頻出。"},
{"c":"原論・基礎","q":"室内の空気環境に関する記述のうち、適当でないものはどれか。","a":["浮遊粉じんの濃度は、室内空気が乾燥するほど減少する。","酸素濃度が18%程度まで低下すると、燃焼器具で不完全燃焼が著しくなり一酸化炭素が発生しやすくなる。","揮発性有機化合物(VOCs)には発がん性が疑われる物質が含まれ、シックハウス症候群の要因となる。","臭気指数は、臭気を無臭と感じるまでに希釈した倍数(臭気濃度)の常用対数を10倍した値である。"],"ans":0,"ex":"【1級頻出】空気が乾燥すると粉じんが沈降・付着しにくくなり、浮遊粉じん濃度は<b>増加</b>する。酸素<b>18%</b>前後で不完全燃焼が著しくなる数値、臭気指数=10×log(臭気濃度)の定義も押さえる。"},
{"c":"原論・基礎","q":"排水の水質に関する用語の記述のうち、適当でないものはどれか。","a":["DO(溶存酸素)は、水中に含まれる有機物中の炭素量を表す指標である。","COD(化学的酸素要求量)は、水中の有機物等を酸化剤で化学的に酸化するときに消費される酸素量である。","大腸菌群は、し尿等による汚染の有無や病原菌汚染の可能性を判断する指標として用いられる。","SS(浮遊物質)は、水中に浮遊する粒径2mm以下の不溶解性物質の量である。"],"ans":0,"ex":"有機物中の炭素量を示すのは<b>TOC(全有機炭素)</b>。<b>DO</b>は水中に溶けている酸素量で、汚濁が進むほど低下する。BOD(生物化学的)とCOD(化学的)の違いも整理しておく。"},
{"c":"原論・基礎","q":"流体の性質に関する記述のうち、適当でないものはどれか。","a":["ニュートン流体において、流体内の摩擦応力(せん断応力)は、速度勾配に動粘性係数を乗じた値で表される。","空気の粘性係数は、温度が上昇すると大きくなる。","レイノルズ数は管内流速に比例し、層流・乱流の判定に用いられる。","流れの状態が時間によって変化しない流れを定常流という。"],"ans":0,"ex":"【1級頻出】ニュートンの粘性法則は τ=μ(du/dy) で、乗じるのは<b>粘性係数μ</b>。動粘性係数νはμを密度ρで割った値(ν=μ/ρ)である。空気は温度上昇で粘性が増し、水は逆に減少する点にも注意。"},
{"c":"原論・基礎","q":"燃焼に関する記述のうち、適当でないものはどれか。","a":["窒素酸化物(NOx)は、燃焼温度が低いときほど多く発生する。","空気過剰率を必要以上に大きくすると、排ガス量が増えて排ガスによる熱損失が増大する。","低発熱量は、高発熱量から燃焼ガス中の水蒸気の凝縮潜熱を差し引いた値である。","固体燃料は、気体燃料や液体燃料に比べて完全燃焼に必要な空気過剰率が大きい。"],"ans":0,"ex":"【1級頻出】サーマルNOxは燃焼温度が<b>高い</b>ほど多く生成されるため、低NOx化には低温燃焼・排ガス再循環などが用いられる。空気過剰率を大きくすると不完全燃焼は減るが、<b>排ガス熱損失は増加</b>する。"},
{"c":"原論・基礎","q":"湿り空気に関する記述のうち、適当でないものはどれか。","a":["湿り空気を蒸気で加湿すると、絶対湿度は増加するが湿球温度は変化しない。","飽和空気の温度を上昇させると、相対湿度は低下する。","湿り空気を露点温度以上の温度の冷却コイルで冷却すると、絶対湿度は変化しない。","湿り空気を水噴霧で加湿すると、乾球温度は低下し相対湿度は上昇する。"],"ans":0,"ex":"蒸気加湿では蒸気のもつ熱(エンタルピー)が空気に加わるため、絶対湿度とともに<b>湿球温度も上昇</b>する。湿球温度がほぼ一定に保たれるのは<b>水噴霧(断熱)加湿</b>の場合である。"},
{"c":"原論・基礎","q":"金属材料の腐食に関する記述のうち、適当でないものはどれか。","a":["マクロセル腐食では、陰極(カソード)となった部分の金属が溶出して腐食する。","黄銅の脱亜鉛腐食は、合金中の特定成分だけが溶出する選択腐食の一種である。","銅管の曲がり部や管径変化部では、流速が大きいと局部的に保護皮膜が破壊されるかい食(エロージョン・コロージョン)が生じやすい。","異種金属が接触して水中にあると、イオン化傾向の大きい(卑な)金属が腐食する。"],"ans":0,"ex":"【1級頻出】マクロセル腐食で溶出するのは<b>陽極(アノード)部</b>であり、陰極部は保護される。土中からコンクリート壁を貫通する配管では、コンクリート中の部分が陰極、土中部が陽極となって腐食が進む。"},
{"c":"原論・基礎","q":"三相誘導電動機の配線・制御に関する記述のうち、適当でないものはどれか。","a":["スターデルタ始動を行う電動機では、制御盤から電動機までの主回路配線は3本でよい。","制御盤と電動機間の配線には、600Vポリエチレン絶縁ケーブル(CV・EM-CE)などが用いられる。","電動機の保護には、過負荷と欠相を検出する2E(過負荷・欠相)リレーが用いられる。","インバータを用いると、電源周波数を変えて電動機の回転速度を連続的に変化させることができる。"],"ans":0,"ex":"スターデルタ始動では固定子巻線の両端をそれぞれ引き出して結線を切り替えるため、電動機への主回路配線は<b>6本</b>必要になる。始動電流・始動トルクはともに直入れの<b>1/3</b>になる。"},
{"c":"原論・基礎","q":"電気設備工事に関する記述のうち、適当でないものはどれか。","a":["低圧電路の絶縁抵抗の最低限度は、使用電圧が高い回路ほど低い値が定められている。","使用電圧100Vの機器を収める金属製ボックスには、D種接地工事を施す。","屋外に設置する機器の回路には、感電防止のため漏電遮断器を設ける。","ケーブルラックに高低差がある部分では、ケーブルを子げたに固定する。"],"ans":0,"ex":"絶縁抵抗値は、対地電圧150V以下で<b>0.1MΩ以上</b>、150V超300V以下で<b>0.2MΩ以上</b>、300V超で<b>0.4MΩ以上</b>と、使用電圧が高いほど<b>高い</b>値が求められる。D種接地は300V以下の機器の金属製外箱等に施す。"},
{"c":"原論・基礎","q":"コンクリートの性状に関する記述のうち、適当でないものはどれか。","a":["コンクリートの中性化は、主に空気中の酸素がコンクリート内部に浸入して水酸化カルシウムと反応することで進行する。","水セメント比が小さいほどコンクリートは緻密になり、中性化の進行は遅くなる。","コールドジョイントは、先に打ち込んだコンクリートと後から打ち込んだコンクリートが一体化しない欠陥である。","スランプは、フレッシュコンクリートのワーカビリティ(施工軟度)を示す指標である。"],"ans":0,"ex":"中性化は空気中の<b>二酸化炭素</b>が水酸化カルシウムと反応して炭酸カルシウムになる現象で、鉄筋を守るアルカリ性が失われ鉄筋腐食の原因になる。水セメント比が小さいほど中性化は遅く耐久性は向上する。"},
{"c":"空調","q":"空気調和設備の熱源機器に関する記述のうち、適当でないものはどれか。","a":["吸収冷凍機と圧縮式冷凍機では、同一冷凍能力に対して必要となる冷却塔の能力はほぼ同じである。","二重効用吸収冷凍機は、単効用に比べて成績係数(COP)が高い。","ロータリー圧縮機は、往復動圧縮機に比べて振動・騒音が小さい。","水熱源ヒートポンプは、空気熱源ヒートポンプに比べて成績係数(COP)が高い。"],"ans":0,"ex":"吸収冷凍機は冷凍能力に加えて再生器の加熱量も冷却水で捨てるため、冷却塔能力は圧縮式の<b>約1.5〜2倍</b>必要になる。冷却水量・冷却塔サイズが大きくなることを計画段階で見込む。"},
{"c":"空調","q":"熱負荷計算に関する記述のうち、適当でないものはどれか。","a":["暖房負荷の計算では、外壁の貫流熱負荷は冷房時と同様に実効温度差を用いて計算する。","実効温度差は、日射量・外壁の日射吸収率・壁体構成などによって異なる。","壁体表面の熱伝達率が大きくなると、壁体の熱通過率は大きくなる。","外気に面する出入口ドアからの隙間風は、暖房負荷として考慮する。"],"ans":0,"ex":"暖房負荷は安全側に見込むため日射や蓄熱の効果は無視し、外壁の貫流熱は<b>室内外の温度差</b>に熱通過率と面積を乗じて定常計算する。実効温度差(ETD)は日射の影響を含むため<b>冷房負荷</b>で用いる。"},
{"c":"空調","q":"地域冷暖房に関する記述のうち、適当でないものはどれか。","a":["熱源がプラントに集約されるため、ごみ焼却排熱や下水熱などの未利用エネルギーは利用できない。","個別に熱源機器を設ける場合に比べ、熱需要者側の建物では機械室面積が減り床面積の利用率が高くなる。","熱源機器の集約により、運転・保守の人件費節約や火災・騒音のおそれの低減が期待できる。","熱源の大型化・高効率化により、大気汚染防止や二酸化炭素排出量の削減に寄与する。"],"ans":0,"ex":"【1級頻出】地域冷暖房はプラント集約により<b>未利用排熱(ごみ焼却・下水・変電所等)の利用が容易</b>になることが大きな利点。需要者側は熱源不要で床面積利用率が<b>高くなる</b>点も頻出のひっかけ。"},
{"c":"空調","q":"空気熱源ヒートポンプに関する記述のうち、適当でないものはどれか。","a":["暖房運転時に外気温度が低下すると、蒸発圧力・蒸発温度は高くなる。","暖房運転時に外気温度が低下すると、暖房能力は低下する。","暖房時の成績係数(COP)は、同じ入力の電気ヒータよりも高い。","暖房時の除霜(デフロスト)は、四方弁を切り替えて一時的に冷房サイクルで運転する方式が一般的である。"],"ans":0,"ex":"【1級頻出】外気温が下がると蒸発器(室外機)の温度が下がるため、<b>蒸発圧力・蒸発温度は低く</b>なり、冷媒循環量の減少で暖房能力・COPが低下する。除霜は冷房サイクルへの切替えで室外コイルを加熱する。"},
{"c":"空調","q":"建築基準法上の換気設備に関する記述のうち、適当でないものはどれか。","a":["事務所の居室では、床面積の1/30以上の換気に有効な開口部があれば換気設備を設けなくてよい。","密閉式燃焼器具のみを設けた室は、火気使用室としての換気設備を設けなくてよい。","自然換気設備の排気口は給気口より高い位置に設け、常時開放された構造とする。","調理室以外の室で、発熱量の合計が6kW以下の火を使用する器具のみを設け、換気上有効な開口部がある場合は、換気設備を設けなくてよい。"],"ans":0,"ex":"【1級頻出】居室には床面積の<b>1/20以上</b>の換気に有効な開口部が必要で、これに満たない場合は換気設備を設ける(建基法28条)。劇場等の特殊建築物の居室は開口部の有無にかかわらず換気設備が必要。"},
{"c":"空調","q":"在室者数が確定していない居室a(床面積60㎡)と居室b(床面積120㎡)について、建築基準法に基づく必要換気量の合計として、適当なものはどれか。ただし、1人当たりの占有面積は居室aが6㎡、居室bが12㎡とし、V=20Af/N(Af:床面積、N:1人当たり占有面積、Nが10を超えるときは10とする)で算定する。","a":["440㎥/h","400㎥/h","600㎥/h","300㎥/h"],"ans":0,"ex":"居室aは20×60/6=<b>200㎥/h</b>。居室bは占有面積12㎡だがNの上限は<b>10</b>なので20×120/10=<b>240㎥/h</b>。合計440㎥/h。上限10を忘れて12で計算すると400㎥/hになるのがひっかけ。"},
{"c":"給排水衛生","q":"上水道の配水管から給水管を分岐する場合の記述のうち、適当でないものはどれか。","a":["分水栓による取出し位置は、他の給水管の取付口から15cm以上離す。","給水管の分岐箇所における配水管の最小動水圧は0.15MPa以上を標準とし、最大静水圧は0.74MPa以下とする。","配水管と他の埋設物との離隔は30cm以上を確保する。","軟弱地盤に配水管を布設する場合は、良質土や砂に置き換えるなどの基礎処理を行う。"],"ans":0,"ex":"分水栓等の取出し位置は、配水管の強度低下や漏水を防ぐため他の給水管取付口から<b>30cm以上</b>離す。分岐箇所の動水圧<b>0.15〜0.74MPa</b>、他埋設物との離隔<b>30cm以上</b>といった数値はまとめて覚える。"},
{"c":"給排水衛生","q":"給水設備に関する記述のうち、適当でないものはどれか。","a":["揚水ポンプの吸込揚程は、常温の水であれば理論上の限界である10m程度まで取ることができる。","直結増圧方式は、高置タンク方式に比べ引込み管の口径が大きくなる傾向がある。","大便器洗浄弁の必要最低給水圧力は70kPaである。","受水タンクの水抜き用吸込みピットに向けて、タンク底面には1/100程度の勾配をつける。"],"ans":0,"ex":"理論吸込揚程は10.33mだが、配管抵抗・キャビテーション・水温の影響で実用上は<b>6〜7m程度</b>が限度。洗浄弁70kPa、一般水栓30kPa、シャワー70kPaなど器具の必要圧力も頻出。"},
{"c":"給排水衛生","q":"排水・通気設備に関する記述のうち、適当でないものはどれか。","a":["特殊継手排水システムの継手は、排水立て管内の流速を高めて排水を速やかに流下させる機能をもつ。","通気立て管の上部は、管径を縮小せずにそのまま延長して大気に開放する。","トラップ桝の封水深は50mm以上100mm以下とする。","管径150mmの排水横主管には、30m以内ごとに掃除口を設ける。"],"ans":0,"ex":"特殊継手は旋回流を起こして立て管内の流速を<b>減速</b>させ、管内圧力変動を緩和して通気立て管を省略できるようにするもの。流速を高めるのではない点がひっかけ。掃除口間隔は管径100mm以下で15m、100mm超で30m以内。"},
{"c":"給排水衛生","q":"通気管の管径に関する記述のうち、適当でないものはどれか。","a":["排水立て管のオフセット部に設ける逃がし通気管の管径は、排水立て管と通気立て管のうち小さい方の管径の1/2以上とする。","ループ通気管の管径は、排水横枝管と通気立て管のうち小さい方の管径の1/2以上とする。","各個通気管の管径は、それが接続される排水管の管径の1/2以上とする。","排水横枝管の逃がし通気管の管径は、それを接続する排水横枝管の管径の1/2以上とする。"],"ans":0,"ex":"立て管オフセットの逃がし通気管は、排水立て管と通気立て管のうち<b>小さい方の管径以上</b>(1/2ではない)とする。ループ・各個・横枝管の逃がし通気が「1/2以上」なのに対し、オフセット部だけ扱いが異なる点を区別する。"},
{"c":"給排水衛生","q":"ガス設備に関する記述のうち、適当でないものはどれか。","a":["液化石油ガス(LPG)は、一般に1.0kPa程度に減圧して消費機器に供給される。","液化石油ガス(LPG)用のガス漏れ警報器は、検知部の上端が床面から30cm以内となるように設置する。","都市ガスの燃焼速度による区分では、A・B・Cの順に燃焼速度が速くなる。","液化石油ガス配管の耐圧試験は0.8MPa以上の圧力で行う。"],"ans":0,"ex":"【1級頻出】LPGは容器内では高圧だが、調整器で<b>2.8kPa程度</b>(2.0〜3.3kPa)に減圧して供給する。LPGは空気より重いため警報器は<b>床面から30cm以内</b>、都市ガス(空気より軽い)は天井面下方30cm以内に設置する。"},
{"c":"給排水衛生","q":"浄化槽の処理対象人員の算定(JIS A 3302)に関する記述のうち、適当でないものはどれか。","a":["共同住宅の処理対象人員は、居室数に定数を乗じて算定する。","戸建住宅の処理対象人員は、延べ面積130㎡以下は5人、130㎡を超えるものは7人とする。","病院・療養所の処理対象人員は、ベッド数に定数を乗じて算定する。","事務所の処理対象人員は、業務用厨房の有無により異なる定数を延べ面積に乗じて算定する。"],"ans":0,"ex":"【1級頻出】共同住宅は住宅同様<b>延べ面積</b>に定数(0.05)を乗じて算定する(1戸当たり3.5人未満は3.5人、6人超は6人とする調整あり)。戸建住宅は延べ面積<b>130㎡</b>を境に5人/7人。"},
{"c":"機器・材料","q":"遠心ポンプに関する記述のうち、適当でないものはどれか。","a":["同一特性のポンプ2台を並列運転すると、吐出量は単独運転時の2倍になる。","キャビテーションは、羽根車入口付近など圧力が最も低くなる部分で発生しやすい。","ポンプの軸動力は、回転数の3乗に比例する。","吐出量を増していくと、ポンプの軸動力は増加する。"],"ans":0,"ex":"【1級頻出】並列運転では配管抵抗の増加により運転点が移動し、吐出量は単独時の<b>2倍より小さく</b>なる。直列運転の揚程も2倍より小さい。相似則:吐出量∝回転数、揚程∝回転数の2乗、軸動力∝回転数の<b>3乗</b>。"},
{"c":"機器・材料","q":"冷却塔に関する記述のうち、適当でないものはどれか。","a":["冷却塔の入口水温と出口水温の差をアプローチという。","密閉式冷却塔は、開放式に比べて空気抵抗が大きく送風機動力が大きくなる。","開放式冷却塔の送風機には、一般に軸流送風機が用いられる。","キャリーオーバーとは、冷却水の飛沫が排気とともに塔外へ飛散する現象をいう。"],"ans":0,"ex":"入口水温と出口水温の差は<b>レンジ(冷却幅)</b>。<b>アプローチ</b>は冷却水出口温度と入口空気の湿球温度との差で、標準設計では約5℃(例:37℃→32℃、湿球27℃)である。"},
{"c":"機器・材料","q":"ユニット形空気調和機に関する記述のうち、適当でないものはどれか。","a":["温水コイルおよび蒸気コイルは、いずれも冷却コイルと兼用することができる。","冷却コイルの通過風速は、ドレンの飛散を防ぐため2.5m/s前後とする。","送風機の風量制御には、スクロールダンパ方式やインバータ方式がある。","デシカント空調機は、吸湿材(デシカント)ローターにより空気中の水分を除去する。"],"ans":0,"ex":"温水コイルは冷温水兼用コイルとして冷却コイルと兼用できるが、<b>蒸気コイル</b>は構造(管内圧力・ドレン排出・膨張対策)が異なるため冷却コイルとの兼用は<b>できない</b>。コイル面風速は2〜3m/s(2.5m/s前後)が標準。"},
{"c":"機器・材料","q":"配管材料・附属品に関する記述のうち、適当でないものはどれか。","a":["空気調和機のドレン配管に設けるトラップの封水深は、送風機の静圧を超えない値とする。","圧力配管用炭素鋼鋼管(STPG)は、スケジュール番号によって管の肉厚が区分される。","架橋ポリエチレン管は、ポリエチレンを架橋することにより耐熱性・耐クリープ性を向上させたものである。","蒸気トラップには、メカニカル式(フロート式等)・サーモスタチック式・サーモダイナミック式がある。"],"ans":0,"ex":"ドレンパンが負圧側(送風機吸込側)にある場合、封水深が機内静圧より浅いと空気が吸い込まれドレンが排出できない。封水深は送風機の<b>静圧以上</b>(機内静圧+余裕)とする必要がある。"},
{"c":"機器・材料","q":"ダクト附属品に関する記述のうち、適当でないものはどれか。","a":["シーリングディフューザーの中コーンを上げると、吹出し気流の拡散半径は大きくなる。","多孔質吸音材を用いた消音器は、中高周波数域の騒音減衰に効果が大きい。","同じ断面積・同じ風量では、長方形ダクトの方が円形ダクトより圧力損失が大きい。","ピストンダンパーは、消火ガス放出時にガス圧でダクトを閉鎖するダンパーである。"],"ans":0,"ex":"シーリングディフューザーの<b>中コーンを上げる</b>と吹出し気流が下向き(垂直吹き)になり<b>拡散半径は小さく</b>なる。暖房時に中コーンを上げ、冷房時に下げて水平吹きにするのが基本。"},
{"c":"設計図書","q":"設計図書に記載する機器仕様の項目として、適当でないものはどれか。","a":["空気調和用ポンプ ― 押込圧力","ユニット形空気調和機 ― 機外静圧と電動機出力","全熱交換器 ― 全熱交換効率と面風速・初期抵抗","冷却塔 ― 騒音値"],"ans":0,"ex":"【1級頻出】押込圧力はボイラー給水ポンプなど特殊な場合の項目で、一般の空調用ポンプには<b>不要</b>。空調用ポンプは吐出量・揚程・電動機出力等、チリングユニットは冷水損失水頭、ユニット形空調機は<b>機外静圧</b>を記載する。"},
{"c":"施工管理","q":"工程管理に関する用語の記述のうち、適当でないものはどれか。","a":["後続作業の最早開始時刻に影響を与えない範囲の余裕時間を、インターフェアリングフロートという。","クリティカルパスに次いで余裕の少ない経路をリミットパスといい、重点管理の対象とする。","工程の進捗に合わせて計画と実績のずれを修正していく作業をフォローアップという。","山崩しとは、作業日程を調整して1日当たりの作業員数などの資源の使用量を平準化することである。"],"ans":0,"ex":"【1級頻出】後続作業の最早開始に影響しない余裕は<b>フリーフロート</b>。<b>インターフェアリングフロート</b>はトータルフロートからフリーフロートを引いた、使うと後続作業の余裕に食い込む余裕である。クラッシュタイムは費用をかけて最大限短縮した時間。"},
{"c":"施工管理","q":"品質管理に関する記述のうち、適当でないものはどれか。","a":["ISO 14000シリーズは、各種公害に対する環境基準値を定めた規格である。","ISO 9000シリーズは、製品そのものではなく品質を実現するための組織のプロセス(仕組み)に関する規格である。","計量抜取検査は、計測値が正規分布に従うことを前提としている。","計数抜取検査は、ロット中の不良個数や欠点数によって合否を判定する。"],"ans":0,"ex":"ISO 14000シリーズは<b>環境マネジメントシステム(EMS)</b>の規格で、環境方針を定めPDCAで継続的改善を行う仕組みを要求するもの。排出基準値などの数値を定めるものではない。"},
{"c":"施工管理","q":"作業の安全に関する記述のうち、適当でないものはどれか。","a":["船舶の二重底など狭い場所でのアーク溶接作業では、自動電撃防止装置付きの溶接機を使用しなくてもよい。","屋内でアーク溶接を行うときは、ヒュームの拡散を防ぐため全体換気装置や局所排気装置を設ける。","リスクアセスメントは、作業に潜在する危険性・有害性を事前に特定し、リスクを見積もって低減措置を検討する手法である。","作業開始前にツールボックスミーティング(TBM)を行い、当日の作業内容と危険ポイントを確認する。"],"ans":0,"ex":"導電性の高い場所や<b>狭い場所</b>、墜落のおそれのある高さ2m以上の場所での交流アーク溶接では、感電防止のため<b>自動電撃防止装置</b>の使用が義務付けられている(安衛則332条)。金属アーク溶接は特定化学物質作業主任者の選任も必要。"},
{"c":"施工管理","q":"機器の据付けに関する記述のうち、適当でないものはどれか。","a":["呼び番号2以上の送風機は、天井スラブから吊りボルトで直接吊り下げて据え付ける。","冷凍能力50トン未満の冷凍機は、操作盤前面の保守スペースを1.2m程度確保すればよい。","受水タンクの基礎高さは500mm以上とし、架台を含めて600mm以上とする。","水中ポンプを2台設置する場合、ポンプの中心間隔は吸込口直径の3倍以上とする。"],"ans":0,"ex":"呼び番号<b>2以上</b>の送風機は振動が大きいため、吊り下げではなく<b>形鋼製の架台上に据え付け</b>、防振基礎や耐震ストッパーを設ける。天井吊りは呼び番号2未満の小型送風機に限る。"},
{"c":"施工管理","q":"配管の支持・防振に関する記述のうち、適当でないものはどれか。","a":["ポンプなどの機器に防振継手を設けていれば、配管側の防振支持は検討しなくてよい。","吊り形防振ゴムは、荷重が鉛直下向きに作用するように取り付ける。","下向き供給の給湯管は、1/200程度の先下がり勾配とする。","通気横走り管は通気立て管に向かって上り勾配とし、鳥居配管となるような配管は避ける。"],"ans":0,"ex":"防振継手だけでは振動が配管を伝わって躯体に達するため、機器近傍の配管には<b>防振支持(防振ゴム・防振吊り)</b>を併せて検討する。給湯管は空気抜き・水抜きのため1/200程度の勾配をとる。"},
{"c":"施工管理","q":"ダクトの施工に関する記述のうち、適当でないものはどれか。","a":["スパイラルダクトの差込み接合では、継手を差し込んでビス止めし、ダクト用テープを二重巻きすればシール材は不要である。","アングルフランジ工法ダクトの吊り間隔は、低圧・高圧の圧力区分にかかわらず同じでよい。","共板フランジ工法のガスケットは、アングルフランジ工法のものより厚いものを用いる。","長方形ダクトの板厚は、ダクトの長辺の寸法によって決定する。"],"ans":0,"ex":"スパイラルダクトの差込接合は、継手外面に<b>シール材を塗布</b>してから差し込み、鋼製ビス止めの上でダクト用テープを二重巻きする。シール材省略はできない。共板ガスケットは厚さ5mm以上。"},
{"c":"法規","q":"労働安全衛生法に基づく職長教育の教育事項として、定められていないものはどれか。","a":["作業効率の確保および品質管理の方法に関すること","作業方法の決定および労働者の配置に関すること","労働者に対する指導または監督の方法に関すること","危険性または有害性等の調査およびその結果に基づき講ずる措置に関すること"],"ans":0,"ex":"職長教育(安衛法60条・安衛則40条)の事項は、作業方法の決定・配置、指導監督方法、<b>危険性有害性等の調査(リスクアセスメント)</b>と措置、異常時・災害発生時の措置、作業設備の保守管理などで、<b>品質管理や作業効率</b>は含まれない。"},
{"c":"法規","q":"労働基準法に関する記述のうち、誤っているものはどれか。","a":["使用者は、雇入れの日から4箇月間継続勤務し全労働日の7割以上出勤した労働者に対して、10労働日の有給休暇を与えなければならない。","使用者は、労働者を解雇しようとする場合、少なくとも30日前にその予告をしなければならない。","使用者は、法定の例外を除き、労働者に1週間について40時間を超えて労働させてはならない。","使用者は、満18才に満たない者を、クレーンの玉掛けの業務(2人以上で行う玉掛け業務の補助を除く)に就かせてはならない。"],"ans":0,"ex":"【1級頻出】年次有給休暇の付与要件は<b>6箇月</b>継続勤務かつ全労働日の<b>8割以上</b>出勤で、10労働日(労基法39条)。解雇予告30日前・週40時間、18才未満の就業制限と併せて数値を正確に。"},
{"c":"法規","q":"建築基準法上の用語に関する記述のうち、誤っているものはどれか。","a":["階段は、主要構造部に含まれない。","最下階の床は、主要構造部に含まれない。","共同住宅は特殊建築物に該当するが、一戸建ての住宅は該当しない。","延焼のおそれのある部分とは、隣地境界線等から1階にあっては3m以下、2階以上にあっては5m以下の距離にある建築物の部分をいう(一定の部分を除く)。"],"ans":0,"ex":"【1級頻出】主要構造部は<b>壁・柱・床・はり・屋根・階段</b>。ただし構造上重要でない間仕切壁、間柱、<b>最下階の床</b>、小ばり、ひさし、局部的な小階段、屋外階段等は除かれる。階段は含まれる点に注意。"},
{"c":"法規","q":"建築基準法上の建築設備に関する記述のうち、誤っているものはどれか。","a":["排水トラップの封水深は、5cm以上15cm以下としなければならない。","隠ぺいされた部分に防火ダンパーを設ける場合は、一辺の長さが45cm以上の点検口を設ける。","火を使用する調理室の換気設備の給気口は、天井高さの1/2以下の高さに設ける。","火を使用する調理室の換気設備の排気口は、天井または天井から下方80cm以内の高さに設ける。"],"ans":0,"ex":"【1級頻出】排水トラップの封水深は<b>5cm以上10cm以下</b>(阻集器を兼ねるものは5cm以上)。深すぎると自浄作用が低下し、浅すぎると破封しやすい。給気口は天井高1/2以下、排気口は天井から80cm以内。"},
{"c":"法規","q":"建設業法に関する記述のうち、誤っているものはどれか。","a":["共同住宅の新築工事であっても、あらかじめ発注者の書面による承諾を得れば、その工事を一括して他人に請け負わせることができる。","注文者は、自己の取引上の地位を不当に利用して、資材や機械の購入先を指定し請負人の利益を害してはならない。","請負契約の内容を変更する場合は、変更内容を書面に記載し署名または記名押印して相互に交付しなければならない。","注文者が監督員を置く場合、監督員の権限や意見申出の方法を書面により請負人に通知しなければならない。"],"ans":0,"ex":"一括下請負は原則禁止で、民間工事では発注者の書面承諾があれば可能だが、<b>公共工事および民間の共同住宅新築工事</b>は承諾があっても<b>禁止</b>(建設業法22条)。監督員の意見申出方法は協議ではなく書面通知。"},
{"c":"法規","q":"建設業法上の技術者制度に関する記述のうち、誤っているものはどれか。","a":["監理技術者の職務には、施工計画の作成・工程管理・品質管理のほか、下請負人への請負代金の管理が含まれる。","密接な関係のある2以上の工事を同一の場所または近接した場所で施工する場合は、同一の専任の主任技術者がこれらを管理できる。","建設業者は、下請負人を使わず自ら施工する場合であっても、主任技術者を置かなければならない。","特定建設業者が作成した施工体系図は、工事現場の見やすい場所に工事完成・引渡しまで掲示しなければならない。"],"ans":0,"ex":"【1級頻出】主任技術者・監理技術者の職務は<b>施工計画の作成、工程管理、品質管理その他の技術上の管理</b>および従事者の技術上の指導監督であり、<b>請負代金の管理などの経営的事項は含まれない</b>。"},
{"c":"法規","q":"1号屋内消火栓設備に関する記述のうち、誤っているものはどれか。","a":["屋内消火栓の開閉弁は、床面からの高さが1.8m以下の位置に設ける。","主配管のうち立上り管は、管の呼びで50mm以上のものとする。","配管の耐圧力は、加圧送水装置の締切圧力の1.5倍以上の水圧に耐えるものとする。","水源水量は、屋内消火栓の設置個数が最も多い階の個数(2を超えるときは2)に2.6㎥を乗じた量以上とする。"],"ans":0,"ex":"【1級頻出】開閉弁は床面から<b>1.5m以下</b>に設ける(天井に設ける場合は自動式の開閉弁)。放水圧力は0.17MPa以上0.7MPa以下、放水量130L/min以上、水平距離25m以下も併せて確認。"},
{"c":"法規","q":"スプリンクラー設備に関する記述のうち、誤っているものはどれか。","a":["劇場の舞台部には、閉鎖型スプリンクラーヘッドを設ける。","補助散水栓は、防火対象物の各部分から一のホース接続口までの水平距離が15m以下となるように設ける。","予作動式流水検知装置を用いる設備では、ヘッド開放後1分以内に放水できるものとする。","幅または奥行きが1.2mを超えるダクト等がある場合は、その下面にもヘッドを設ける。"],"ans":0,"ex":"【1級頻出】劇場の舞台部は天井が高く火災の成長が速いため、感知器等と連動して一斉に放水する<b>開放型ヘッド</b>を用いる。閉鎖型は一般の居室等、放水型は高天井部分(10m超等)に使用。"},
{"c":"施工管理","q":"配管の施工に関する記述のうち、適当でないものはどれか。","a":["蒸気還水管は、蒸気給気管と同一の吊り金物で共吊りしてよい。","転造ねじは、切削ねじに比べねじ部の強度が管本体と同程度に保たれる。","Uボルトは配管の振れ止め用であり、固定支持には用いない。","冷媒配管の気密試験は、窒素ガスなどの不活性ガスを用いて行う。"],"ans":0,"ex":"蒸気給気管と還水管は温度差による伸縮量が異なり、共吊りすると支持金物に無理な力がかかるため<b>共吊りしない</b>。また蒸気管の支持にはローラ金物を用いて伸縮を逃がす。"},
{"c":"法規","q":"労働安全衛生法に基づく作業の安全に関する記述のうち、誤っているものはどれか。","a":["アセチレン溶接装置のガス容器は、転倒防止のため横に寝かせて保管する。","高さ3m以上の場所から物体を投下するときは、適当な投下設備を設け監視人を置く。","高さ5m以上の足場の組立て・解体作業では、足場の組立て等作業主任者を選任する。","高さ2m以上の箇所で作業を行う場合、強風・大雨・大雪等の悪天候のため危険が予想されるときは作業を行ってはならない。"],"ans":0,"ex":"アセチレン容器は内部のアセトン流出を防ぐため<b>立てて保管</b>し、転倒防止措置を講じる。容器は40℃以下に保ち、火気から離す。悪天候時の作業禁止は<b>2m以上</b>、投下設備は<b>3m以上</b>、足場作業主任者は<b>5m以上</b>と高さの数値を区別する。"},
{"c":"法規","q":"建設業の許可に関する記述のうち、誤っているものはどれか。","a":["国または地方公共団体が発注する工事を元請として請け負う場合は、下請契約の金額にかかわらず特定建設業の許可が必要である。","二以上の都道府県の区域内に営業所を設けて営業する場合は、国土交通大臣の許可が必要である。","発注者から直接請け負った工事について、下請契約の総額が5,000万円以上(建築一式工事は8,000万円以上)となる場合は、特定建設業の許可が必要である。","許可を受けた建設業に係る建設工事に附帯する他の建設業の工事は、その許可を受けていなくても請け負うことができる。"],"ans":0,"ex":"特定建設業の許可が必要かどうかは発注者の種別ではなく、<b>元請として締結する下請契約の総額</b>(令和5年改正後:<b>5,000万円</b>以上、建築一式<b>8,000万円</b>以上)で判断する。公共工事でも下請総額が基準未満なら一般建設業でよい。"},
{"c":"応用能力","q":"配管の施工に関する記述のうち、適当でないものはどれか。","a":["複式伸縮管継手は、継手本体を固定せず、継手の両側の配管を固定点で固定する。","混合型電動三方弁は、冷温水コイルの還り管側に設置する。","塩ビライニング鋼管の切断には、パイプカッターや高速砥石を用いない。","鋼管とステンレス鋼管を接続する場合は、絶縁継手を用いる。"],"ans":0,"ex":"<b>複式</b>伸縮継手は継手<b>本体を固定</b>し、両側の配管はガイドで支持して伸縮を継手に導く。<b>単式</b>は片側を固定点、反対側をガイドとする。単式との違いを混同しやすい応用能力の論点。"},
{"c":"応用能力","q":"ダクトの施工に関する記述のうち、適当でないものはどれか。","a":["排煙ダクトのかど部の継目には、ピッツバーグはぜを用いてはならない。","送風機吐出口からダクトに接続する拡大部分の拡大角は、15度以下とする。","消音エルボを用いる場合、風量調整ダンパーは消音エルボの上流側に設ける。","横走りダクトの振れ止め支持は、12m以下の間隔で設ける。"],"ans":0,"ex":"排煙ダクトに使用できないのは気密性の低い<b>ボタンパンチスナップはぜ</b>で、<b>ピッツバーグはぜ</b>は使用可。送風機吐出側の急拡大は乱流・騒音の原因となるため15°以下、振れ止めは12m以下・各階1箇所以上(梁貫通部は振れ止めとみなす)。"},
{"c":"空調","q":"冷房時の空気線図上の状態点に関する記述のうち、適当でないものはどれか。","a":["吹出温度差は、外気と還気の混合点の温度と冷却コイル出口の温度との差である。","送風機の発熱により、コイル出口から吹出口までの間で空気温度はわずかに上昇する。","外気と還気の混合点は、室内点と外気点を結ぶ線上を外気量と送風量の比で内分した点である。","室内の空気状態の変化は、吹出点から室内点に向かう顕熱比(SHF)線上で表される。"],"ans":0,"ex":"吹出温度差は<b>室内点と吹出点</b>の乾球温度差で、送風量の決定に用いる(通常10℃程度、大温度差空調で15℃程度)。外気負荷は混合点と室内点のエンタルピー差×質量流量で求める。"},
{"c":"原論・基礎","q":"冬季における外壁の結露に関する記述のうち、適当でないものはどれか。","a":["暖房している室では、天井付近より床付近の方が壁表面温度が高くなるため、床付近の壁面は結露しにくい。","内部結露を防ぐには、断熱材の室内側(高温側)に防湿層を設ける。","外壁の室内側表面温度が室内空気の露点温度以下になると、表面結露が生じる。","断熱材の屋外側に通気層を設けると、壁体内に侵入した水蒸気を排出でき、内部結露の防止に有効である。"],"ans":0,"ex":"【1級頻出】暖房室では暖かい空気が上昇するため、床付近の空気温度・壁表面温度は天井付近より低くなり、<b>床付近の壁面の方が結露しやすい</b>。防湿層は水蒸気分圧の高い室内側(断熱材の高温側)に設けるのが原則で、低温側に設けると内部結露を助長する。"},
{"c":"原論・基礎","q":"直管内を流体が流れるときの摩擦による圧力損失に関する記述のうち、適当なものはどれか。","a":["圧力損失は、管の長さに比例し、管の内径に反比例する。","圧力損失は、平均流速に比例する。","圧力損失は、管の内径の2乗に比例する。","圧力損失は、流体の密度に反比例する。"],"ans":0,"ex":"【1級頻出】ダルシー・ワイスバッハの式 ΔP=λ(L/d)(ρv²/2) より、圧力損失は<b>管長Lに比例、内径dに反比例、平均流速vの2乗に比例、密度ρに比例</b>する。摩擦損失の原因は流体の粘性であり、λは管摩擦係数である。"},
{"c":"原論・基礎","q":"湿り空気に関する記述のうち、適当でないものはどれか。","a":["湿り空気を電気ヒーターで加熱すると、絶対湿度も相対湿度も変化しない。","飽和空気では、乾球温度、湿球温度及び露点温度が等しい。","湿り空気を水噴霧により断熱加湿すると、乾球温度は低下し、絶対湿度は増加する。","シリカゲルなどの固体吸着剤で減湿すると、吸着熱により空気の乾球温度は上昇する。"],"ans":0,"ex":"【1級頻出】顕熱加熱では絶対湿度は一定だが、乾球温度が上がると飽和絶対湿度が大きくなるため<b>相対湿度は低下</b>する。断熱加湿(水噴霧)は湿球温度一定で乾球温度が下がり、固体吸着減湿は潜熱が顕熱に変わって温度が上がる。"},
{"c":"原論・基礎","q":"金属材料の腐食に関する記述のうち、適当でないものはどれか。","a":["異種金属が接触して水中に置かれると、イオン化傾向の小さい金属が優先的に腐食する。","すきま腐食は、フランジ接合部やガスケット下などの狭い隙間で酸素濃度が低くなった部分に生じやすい。","銅管は、pHが低い(酸性側の)水や遊離炭酸を多く含む水では腐食しやすい。","炭素鋼の腐食速度は、開放系では水温が高くなるほど大きくなる傾向がある。"],"ans":0,"ex":"【1級頻出】異種金属接触腐食(ガルバニック腐食)では、<b>イオン化傾向の大きい(電位の低い)金属が陽極となって腐食</b>し、イオン化傾向の小さい金属は保護される。鉄と銅が接触すれば鉄が腐食する。"},
{"c":"原論・基礎","q":"乾燥した場所であって点検できない隠ぺい場所に施設する、使用電圧300V以下の低圧屋内配線工事の種類として、適当でないものはどれか。","a":["金属線ぴ工事","金属管工事","合成樹脂管工事","ケーブル工事"],"ans":0,"ex":"【1級頻出】金属線ぴ工事、ライティングダクト工事、金属ダクト工事は、展開した場所や点検できる隠ぺい場所に限って施設できる。点検できない隠ぺい場所にも施設できるのは<b>金属管工事・合成樹脂管工事・ケーブル工事・金属可とう電線管工事</b>などである。"},
{"c":"原論・基礎","q":"三相誘導電動機に関する記述のうち、適当でないものはどれか。","a":["同期速度は、電源周波数に反比例し、極数に比例する。","回転方向を逆転させるには、3本の電源線のうち2本を入れ替える。","スターデルタ始動では、始動電流及び始動トルクは全電圧始動時の約1/3になる。","一般に、定格出力11kW以上の電動機には、始動電流を抑えるための始動装置を設けることが多い。"],"ans":0,"ex":"【1級頻出】同期速度 Ns=120f/p[min⁻¹]であり、<b>周波数fに比例、極数pに反比例</b>する。例えば4極・50Hzでは1,500min⁻¹となる。スターデルタ始動は巻線電圧が1/√3になるため、電流・トルクとも1/3になる。"},
{"c":"原論・基礎","q":"コンクリートに関する記述のうち、適当でないものはどれか。","a":["水セメント比は、施工に支障のない範囲でできるだけ大きくする方が、強度及び耐久性の面で望ましい。","単位水量は、コンクリート1m³中に含まれる水の質量で、一般に185kg/m³以下とする。","水セメント比が大きいほど、コンクリートの流動性(ワーカビリティー)は向上する。","単位水量が多いと、乾燥収縮やブリーディングが増大しやすい。"],"ans":0,"ex":"【1級頻出】水セメント比(W/C)が大きいと流動性は良くなるが、強度・耐久性・水密性が低下し、中性化も進みやすい。したがって<b>施工に支障のない範囲で小さく</b>するのが原則である。"},
{"c":"原論・基礎","q":"鉄筋コンクリート造の梁に設ける配管用貫通孔に関する記述のうち、適当でないものはどれか。","a":["貫通孔は、せん断力の大きい柱に近い梁端部に集めて設けるのが望ましい。","貫通孔の径は、原則として梁せいの1/3以下とする。","貫通孔の周囲には、斜め筋などの補強筋を配置する。","複数の貫通孔を並べて設ける場合、孔の中心間隔は孔径の平均の3倍以上を目安とする。"],"ans":0,"ex":"【1級頻出】梁端部はせん断力が大きいため貫通孔は避け、<b>柱面から梁せいの1.5倍程度以上離れた位置</b>に設ける。孔径は梁せいの1/3以下とし、径が梁せいの1/10以下かつ150mm未満程度の小孔では補強筋を省略できる場合がある。"},
{"c":"空調","q":"定風量単一ダクト方式の冷房運転において、最大負荷時と比較した部分負荷時の特徴に関する記述のうち、適当でないものはどれか。","a":["冷却コイルでの除湿量が増えるため、室内の相対湿度は低くなる。","送風量が一定のため、吹出し温度差は小さくなる。","冷却コイルの出口空気温度は高くなる。","送風量が一定のため、必要な外気導入量(換気量)は確保しやすい。"],"ans":0,"ex":"【1級頻出】定風量方式は送風量一定で吹出し温度を上げて負荷減少に対応するため、コイル出口温度が上がり<b>除湿量が減って室内湿度は上昇</b>しやすい。一方、風量が一定なので外気量の確保は容易である。"},
{"c":"空調","q":"空気調和方式に関する記述のうち、適当でないものはどれか。","a":["低温送風方式は、一般の空調方式より送風温度を低くするため、送風量とダクトサイズが大きくなる。","床吹出し方式は、居住域に直接吹き出すため、天井吹出しに比べ吹出し温度差を小さくする。","変風量単一ダクト方式は、定風量方式に比べ送風機動力を低減できるが、低負荷時の外気量確保に注意が必要である。","定風量単一ダクト方式で多数の室を1系統で受け持つと、室ごとの個別制御がしにくい。"],"ans":0,"ex":"【1級頻出】低温送風方式(送風温度10℃前後)は吹出し温度差を大きくとれるため、<b>送風量を減らしてダクトサイズと送風機動力を縮小</b>できる。氷蓄熱と組み合わせて採用されることが多い。"},
{"c":"空調","q":"空気調和の熱負荷に関する記述のうち、適当でないものはどれか。","a":["人体からの発熱は、室温が高くなると顕熱が増加し、潜熱が減少する。","暖房負荷計算では、一般にすきま風による負荷を考慮する。","冷房時の外壁からの負荷は、日射と外気温度の影響を含めた実効温度差(相当外気温度差)を用いて計算する。","土間床や地中壁からの熱負荷は、暖房時には考慮するが、冷房時には一般に無視する。"],"ans":0,"ex":"【1級頻出】室温が上がると人体の<b>顕熱放散は減り、発汗による潜熱放散が増える</b>(全発熱量はほぼ一定)。外壁負荷は壁体の熱容量による時間遅れを考慮した実効温度差で計算し、単純な内外温度差は用いない。"},
{"c":"空調","q":"地域冷暖房に関する記述のうち、適当でないものはどれか。","a":["熱需要密度が小さい地域ほど、導管延長当たりの供給熱量が増えるため、採算上有利になる。","熱源を集約することで、個別熱源より高効率な大型機器の採用や運転管理の専門化が図れる。","各建物に熱源機械室が不要または縮小できるため、建物の床面積の利用率が向上する。","熱源プラントで集中してばい煙や排熱を管理できるため、都市環境の保全に寄与する。"],"ans":0,"ex":"【1級頻出】熱需要密度(単位面積当たりの熱需要)が<b>大きい</b>ほど導管延長に対する供給熱量が大きく、採算上有利になる。需要密度の低い地域では導管コストと熱損失が増え不利となる。"},
{"c":"空調","q":"氷蓄熱方式に関する記述のうち、適当でないものはどれか。","a":["氷蓄熱は、水蓄熱に比べ冷凍機の蒸発温度を高くできるため、冷凍機のCOPは向上する。","氷の融解潜熱を利用するため、水蓄熱より蓄熱槽容積を小さくできる。","低温の冷水を得られるため、大温度差送水により搬送動力を低減できる。","スタティック方式は、蓄熱槽内のコイル表面などで製氷と融解を行う方式である。"],"ans":0,"ex":"【1級頻出】氷蓄熱では製氷のため蒸発温度を−5〜−10℃程度まで下げる必要があり、<b>水蓄熱に比べCOPは低下</b>する。氷を剥離・流下させるダイナミック方式は氷が厚く成長しないため、スタティック方式より効率が高い。"},
{"c":"空調","q":"在室者50人の会議室において、室内のCO₂濃度を1,000ppm以下に保つために必要な最小換気量として、適当なものはどれか。ただし、外気のCO₂濃度は400ppm、在室者1人当たりのCO₂発生量は0.018m³/hとする。","a":["1,500m³/h","900m³/h","1,000m³/h","2,250m³/h"],"ans":0,"ex":"【1級頻出】必要換気量 Q=M/(C−Co) で求める。M=50×0.018=0.9m³/h、C−Co=0.001−0.0004=0.0006 なので、Q=0.9/0.0006=<b>1,500m³/h</b>。外気濃度を差し引くことを忘れると900m³/hと誤る。"},
{"c":"空調","q":"換気設備に関する記述のうち、適当でないものはどれか。","a":["営業用厨房の換気は、臭気の拡散を防ぐため、給気量を排気量より多くして室内を正圧に保つ。","事務室の必要換気量は、CO₂濃度を基準にすると、在室者1人当たり30m³/h程度が目安となる。","建築基準法上、換気に有効な開口部の面積が床面積の1/20未満の居室には、換気設備を設ける必要がある。","火気使用室に設ける自然換気の排気筒は、燃料消費量と排気筒の高さに応じた有効断面積を確保する。"],"ans":0,"ex":"【1級頻出】厨房は臭気・熱・油煙が隣室へ漏れないよう<b>排気量を給気量より多くして負圧に保つ</b>。事務室の1人当たり30m³/hはCO₂1,000ppm以下を保つための目安で、建築基準法の20Af/Nは最低基準である。"},
{"c":"空調","q":"天井チャンバー方式の排煙設備に関する記述のうち、適当でないものはどれか。","a":["同一防煙区画内で間仕切りを変更する場合でも、排煙ダクトの改修工事が必要となる。","天井内を排煙経路として利用するため、防煙区画ごとに天井内に防煙壁を設けて区画する必要がある。","天井面の排煙口の位置が偏ると不均等排煙となるおそれがあるため、吸込み位置の配置に注意する。","天井内の排煙口の作動状態を確認できるよう、パイロットランプを設ける。"],"ans":0,"ex":"【1級頻出】天井チャンバー方式は天井内全体を排煙経路とし、天井面の排煙口から排煙する方式であるため、同一区画内のレイアウト変更では<b>排煙ダクト工事が不要</b>になる利点がある。天井内の防煙区画(防煙壁)が確実に施工されていることが前提となる。"},
{"c":"空調","q":"建築基準法に基づく排煙設備に関する記述のうち、適当でないものはどれか。","a":["排煙設備の予備電源は、排煙機を15分間継続して作動させることができる容量とする。","特別避難階段の付室と非常用エレベーターの乗降ロビーを兼用する部分の排煙機の排煙量は、6m³/s以上とする。","防煙垂れ壁は、天井面から50cm以上下方に突出させる。","排煙口の手動開放装置の手で操作する部分は、壁に設ける場合、床面から80cm以上1.5m以下の高さに設ける。"],"ans":0,"ex":"【1級頻出】排煙設備の予備電源は<b>30分間</b>継続して作動できる容量とする。付室のみ又は乗降ロビーのみの排煙量は4m³/s以上、兼用する場合は6m³/s以上。手動開放装置は天井から吊り下げる場合は床面から約1.8m。"},
{"c":"給排水衛生","q":"上水道の配水管に関する記述のうち、適当でないものはどれか。","a":["配水管は、水質管理上、他の水道事業者の配水管と接続してはならない。","配水管の最小動水圧は、原則として0.15MPa以上とする。","配水管の最大静水圧は、0.74MPaを超えないようにする。","配水管に設ける消火栓は、管内の排気や排水にも利用できる。"],"ans":0,"ex":"【1級頻出】配水管は、災害時や事故時のバックアップのため<b>連絡管により他の水道事業者の施設と接続</b>することができる。配水管の水圧は最小動水圧0.15MPa以上、最大静水圧0.74MPa以下が標準。"},
{"c":"給排水衛生","q":"下水道の管きょに関する記述のうち、適当でないものはどれか。","a":["取付管は、本管の中心線より下方の位置に取り付け、本管に対して直角に接続する。","合流式では、雨天時に雨水とともに汚水の一部が未処理のまま公共用水域に放流されることがある。","分流式の汚水管は、雨水管に比べ流量が少ないため勾配が急になり、下流で埋設深さが深くなりやすい。","管きょの段差が0.6m以上となる場合は、副管を設けた段差接合とする。"],"ans":0,"ex":"【1級頻出】取付管は本管の<b>中心線より上方(管頂付近)</b>に、流れの方向に対して60度又は90度で接続し、本管からの逆流や土砂の流入を防ぐ。合流式は雨天時越流水の問題があり、分流式は汚水管が小径・急勾配になりやすい。"},
{"c":"給排水衛生","q":"給水設備に関する記述のうち、適当でないものはどれか。","a":["大気圧式バキュームブレーカーは、常時水圧がかかる給水管の途中に設ける。","大便器洗浄弁(フラッシュバルブ)の作動に必要な最低給水圧力は、一般に70kPa程度である。","吐水口空間とは、給水栓の吐水口端とあふれ縁との鉛直距離をいう。","揚程が30mを超える揚水ポンプの吐出し側には、ウォーターハンマー防止のため衝撃吸収式逆止弁などを設ける。"],"ans":0,"ex":"【1級頻出】大気圧式バキュームブレーカーは<b>常時圧力がかからない部分</b>(大便器洗浄弁の下流など、最終弁の二次側)に設ける。常時圧力がかかる箇所には圧力式バキュームブレーカーを用いる。"},
{"c":"給排水衛生","q":"排水槽に関する記述のうち、適当でないものはどれか。","a":["排水槽のマンホールは、直径45cm以上の円が内接できるものとする。","厨房排水槽は、汚水槽と分けて設けることが望ましい。","排水槽の通気管は最小管径50mmとし、他の通気管と接続せず単独で大気に開放する。","排水槽の内部を清掃できるよう、近くに水栓を設ける。"],"ans":0,"ex":"【1級頻出】排水槽のマンホールは、内部の点検・清掃のため<b>直径60cm以上</b>の円が内接できる大きさとする(建築基準法に基づく告示)。通気管は50mm以上で単独開放、底の勾配は吸込みピットに向かって1/15以上1/10以下。"},
{"c":"給排水衛生","q":"屋内消火栓設備に関する記述のうち、適当でないものはどれか。","a":["1号消火栓(易操作性1号消火栓を除く)は、開閉弁の開放と連動して加圧送水装置を起動させる方式とする。","1号消火栓は、ホースの延長と放水に原則として2人の操作員を要する。","易操作性1号消火栓と2号消火栓は、1人で操作でき、ノズルで放水の開閉ができる。","1号消火栓は、各階のいずれの部分からも1つのホース接続口までの水平距離が25m以下となるように設ける。"],"ans":0,"ex":"【1級頻出】従来型の1号消火栓は、消火栓箱に設けた<b>起動ボタン</b>で加圧送水装置を起動する。開閉弁の開放やホース延長に連動して自動起動するのは易操作性1号消火栓・2号消火栓である。水平距離は1号・易操作性1号が25m以下、2号は15m以下。"},
{"c":"給排水衛生","q":"浄化槽の処理対象人員算定基準(JIS A 3302)に関する記述のうち、適当でないものはどれか。","a":["公衆便所の処理対象人員は、1日の想定利用者数に定数を乗じて算定する。","小学校・中学校の処理対象人員は、定員に定数を乗じて算定する。","事務所の処理対象人員は、業務用厨房設備の有無によって定数が異なり、延べ面積に定数を乗じて算定する。","一般の飲食店の処理対象人員は、延べ面積に定数を乗じて算定する。"],"ans":0,"ex":"【1級頻出】公衆便所は<b>総便器数に定数16を乗じて</b>算定する(n=16c)。小中学校はn=0.20P(定員)、事務所は業務用厨房ありn=0.075A・なしn=0.06A、一般飲食店はn=0.72Aである。"},
{"c":"機器・材料","q":"吸収冷凍機に関する記述のうち、適当でないものはどれか。","a":["吸収冷凍機は、遠心冷凍機に比べ、起動から定格能力に達するまでの時間が短い。","二重効用吸収冷凍機では、高温再生器で発生した冷媒蒸気の凝縮熱を低温再生器の加熱に利用する。","吸収冷凍機の冷却塔は、同一冷凍能力の圧縮式冷凍機に比べ大きな容量が必要である。","蒸気だき吸収冷凍機の容量制御は、再生器への蒸気量を調節弁で加減して行う。"],"ans":0,"ex":"【1級頻出】吸収冷凍機は溶液濃度や温度が安定するまでに時間がかかり、<b>定格能力到達には遠心冷凍機より長い時間(20〜30分以上)</b>を要する。冷却塔容量は圧縮式の約1.5〜2倍、溶液熱交換器は高温側と低温側に分けて効率を高める。"},
{"c":"機器・材料","q":"温熱源機器に関する記述のうち、適当でないものはどれか。","a":["炉筒煙管ボイラーは、小型貫流ボイラーに比べ保有水量が少ないため、より高度な水処理が必要である。","真空式温水発生機は、缶体内を大気圧以下に保って運転するため、ボイラー取扱いの資格を要しない。","鋳鉄製ボイラーは、セクションに分割して搬入できるため既設建物への搬入が容易で、鋼製に比べ耐食性に優れる。","貫流ボイラーは保有水量が少ないため、起動から蒸気発生までの時間が短い。"],"ans":0,"ex":"高度な水処理が必要なのは<b>保有水量が少なく伝熱面の熱負荷が大きい貫流ボイラー</b>である。炉筒煙管ボイラーは保有水量が多く負荷変動に強いが、起動時間は長い。真空式・無圧式温水発生機は労働安全衛生法上のボイラーに該当しない。"},
{"c":"機器・材料","q":"配管材料及び配管附属品に関する記述のうち、適当でないものはどれか。","a":["排水用硬質塩化ビニルライニング鋼管用のねじ込み式排水管継手(MD継手)は、圧力変動の大きい圧送排水管にも使用できる。","圧力配管用炭素鋼鋼管(STPG)は、スケジュール番号によって管の肉厚が区分される。","合成ゴム製フレキシブルジョイントは、全長が長いものほど変位の吸収量が大きい。","絶縁フランジは、異種金属管の接続部に用いて異種金属接触腐食を防止する。"],"ans":0,"ex":"【1級頻出】MD継手は<b>無圧(重力式)の排水管用</b>で、継手内面にねじ部が露出しないよう受口を深くした構造である。ポンプ圧送管など圧力がかかる系統には使用せず、圧力配管用の継手を用いる。"},
{"c":"設計図書","q":"公共工事標準請負契約約款に関する記述のうち、適当でないものはどれか。","a":["現場代理人は、主任技術者又は監理技術者を兼ねることができない。","工事材料の品質は、設計図書に定めがない場合、中等の品質を有するものとする。","発注者は、受注者から工事完成の通知を受けた日から14日以内に完成検査を完了しなければならない。","受注者は、発注者が設計図書を変更したため請負代金額が3分の2以上減少したときは、契約を解除することができる。"],"ans":0,"ex":"【1級頻出】現場代理人、監理技術者等(監理技術者・監理技術者補佐・主任技術者)及び専門技術者は、<b>互いに兼ねることができる</b>と約款に定められている。完成検査は通知受領日から14日以内、代金支払は請求日から40日以内。"},
{"c":"機器・材料","q":"配管材料とその規格記号の組合せのうち、適当でないものはどれか。","a":["排水用硬質塩化ビニルライニング鋼管 ――― SGP-VD","一般配管用ステンレス鋼鋼管 ――― SUS304TPD","水道用硬質塩化ビニルライニング鋼管(外面一次防せい塗装) ――― SGP-VA","耐衝撃性硬質ポリ塩化ビニル管 ――― HIVP"],"ans":0,"ex":"【1級頻出】排水用硬質塩化ビニルライニング鋼管の記号は<b>D-VA</b>(WSP 042)である。SGP-VDは水道用硬質塩化ビニルライニング鋼管(JWWA K 116)のうち内外面ともに硬質塩ビをライニングしたもので、VBは外面亜鉛めっきである。"},
{"c":"施工管理","q":"施工計画に関する記述のうち、適当でないものはどれか。","a":["仮設物は工事期間中の一時的な設備であるため、火災予防や騒音対策を考慮する必要はない。","施工方法の決定は、設計図書に特別の定めがない限り、受注者の責任において行う。","搬入計画では、大型機器の搬入時期・経路・揚重方法を建築工程とあわせて検討する。","労務計画では、工種ごとの作業員数が極端に増減しないよう工程を調整する。"],"ans":0,"ex":"【1級頻出】仮設物であっても<b>火災予防、騒音・振動・粉じん対策、第三者災害の防止</b>を考慮して計画する。仮設計画は原則として受注者の責任で行い、関係法令や近隣環境を踏まえる。"},
{"c":"施工管理","q":"作業の危険防止に関する記述のうち、適当でないものはどれか。","a":["労働安全衛生法令上、酸素欠乏とは、空気中の酸素濃度が16%未満の状態をいう。","アーク溶接作業では、溶接ヒュームのばく露防止のため有効な呼吸用保護具を使用させる。","枠組足場以外の足場で高さ2m以上の作業床に設ける手すりは、高さ85cm以上とする。","墜落制止用器具は、使用前にその異常の有無を随時点検する。"],"ans":0,"ex":"【1級頻出】酸素欠乏とは空気中の酸素濃度が<b>18%未満</b>の状態をいう。酸素欠乏危険作業では作業開始前に濃度を測定し、換気により18%以上に保つ。手すりは85cm以上とし、中桟(35cm以上50cm以下)も設ける。"},
{"c":"施工管理","q":"配管材料とその接合方法の組合せのうち、適当でないものはどれか。","a":["一般配管用ステンレス鋼鋼管 ――― ねじ接合","配管用炭素鋼鋼管 ――― ねじ接合","水道用ポリエチレン二層管 ――― 金属継手によるメカニカル接合","耐火二層管 ――― 接着(TS)接合"],"ans":0,"ex":"【1級頻出】一般配管用ステンレス鋼鋼管(SUS-TPD)は薄肉のためねじ加工ができず、<b>メカニカル形・プレス式・拡管式・ハウジング形継手や溶接</b>で接合する。耐火二層管は内管の硬質塩ビ管を接着(TS)接合する。"},
{"c":"応用能力","q":"配管の施工に関する記述のうち、適当でないものはどれか。","a":["ポンプの吸込み管は、管内に空気がたまらないよう、ポンプに向かって下り勾配とする。","給湯配管を返湯管付きの複管式とする場合、各系統の循環量を均等にするためリバースリターン方式とすることがある。","冷媒配管の横走り管は、冷媒の流れ方向に下り勾配とし、冷凍機油が圧縮機に戻るようにする。","排水管は、勾配を確保する必要があるため、他の配管と共吊りしない。"],"ans":0,"ex":"【1級頻出】ポンプの吸込み管は<b>ポンプに向かって上り勾配</b>(1/100程度)とし、空気がたまって吸込み不良やキャビテーションを起こさないようにする。排水管は勾配確保のため単独支持とする。"},
{"c":"応用能力","q":"ダクトの施工に関する記述のうち、適当でないものはどれか。","a":["アングルフランジ工法の長方形ダクトで長辺が800mmの場合、ダクトの角の継目は1か所でよい。","共板フランジ工法のクリップ(フランジ押え金具)は、一度取り外したものを再使用してはならない。","風量調節ダンパーは、対向翼ダンパーの方が平行翼ダンパーより風量調節性能に優れる。","アングルフランジ工法のフランジへのダクト板の折返しは、5mm以上とする。"],"ans":0,"ex":"【1級頻出】長辺が750mmを超える長方形ダクトは、ねじれ防止と強度確保のため<b>角の継目を2か所以上</b>とする。クリップは変形して締付け力が落ちるため再使用禁止、フランジ折返しは5mm以上とする。"},
{"c":"応用能力","q":"ダクトの施工に関する記述のうち、適当でないものはどれか。","a":["共板フランジ工法のクリップは、ダクト寸法にかかわらず、各辺のコーナーボルト間に1か所取り付ければよい。","風量測定口は、ダクト幅に応じて測定点が均等に分布するよう個数と間隔を決める。","VAVユニットの上流側には、整流のため所定長さの直管部を設ける。","横走りダクトは、12m以下ごとに形鋼による振れ止め支持を行う。"],"ans":0,"ex":"【1級頻出】共板フランジ工法のクリップは、<b>ダクトの長辺寸法に応じて所定の個数・間隔で取り付ける</b>必要があり、寸法が大きくなるほど個数を増やす。VAVユニットの上流直管部が不足すると風量検出精度が低下する。"},
{"c":"応用能力","q":"保温及び塗装の施工に関する記述のうち、適当でないものはどれか。","a":["塗装は、気温が5℃以下の場合は施工できないが、相対湿度が85%以上であれば施工してよい。","保温を施した配管が床を貫通する部分は、床面から高さ150mm程度まで金属板などで保護する。","冷水管の保温では、保温材の外側にポリエチレンフィルムを巻いて防湿する。","グラスウール保温筒を鉄線で巻き締める場合、保温筒1本につき2か所以上とする。"],"ans":0,"ex":"【1級頻出】塗装は<b>気温5℃以下、相対湿度85%以上、換気が不十分で乾燥に不適な場合</b>には原則として行わない。ポリエチレンフィルムは冷水・冷温水管の防湿(結露防止)層として用い、床貫通部は保温材の損傷防止に金属板で保護する。"},
{"c":"応用能力","q":"配管の腐食及び防食に関する記述のうち、適当でないものはどれか。","a":["ステンレス鋼管に接続する青銅製仕切弁は、脱亜鉛腐食を防ぐため、弁棒を黄銅製とする。","ステンレス鋼管の突合せ溶接では、管内にアルゴンガスを流してバックシールドを行う。","給湯用銅管の潰食(エロージョン・コロージョン)を防ぐため、管内流速は1.2m/s以下程度に抑える。","埋設する鋼管の外面防食には、ポリエチレン被覆やプラスチックテープ巻きなどを用いる。"],"ans":0,"ex":"【1級頻出】黄銅は亜鉛を含むため<b>脱亜鉛腐食</b>を起こしやすく、弁棒は青銅製又はステンレス製とする。ステンレス溶接の裏面は酸化防止のためアルゴンガスでシールドし、銅管は高流速で潰食が進むため流速を抑える。"},
{"c":"法規","q":"労働安全衛生法上、建設業の安全衛生管理体制に関する記述のうち、誤っているものはどれか。","a":["統括安全衛生責任者を選任すべき事業者以外の請負人で、当該仕事を自ら行うものは、総括安全衛生管理者を選任しなければならない。","特定元方事業者は、その労働者及び関係請負人の労働者が同一の場所で常時50人以上作業する場合、統括安全衛生責任者を選任しなければならない。","元方安全衛生管理者は、その事業場に専属の者を選任しなければならない。","特定元方事業者は、作業場所を毎作業日に少なくとも1回巡視しなければならない。"],"ans":0,"ex":"【1級頻出】関係請負人(下請)が選任するのは<b>安全衛生責任者</b>であり、統括安全衛生責任者との連絡や調整を行う。総括安全衛生管理者は一定規模以上の単一事業場で選任する管理者で、建設現場の下請が選任するものではない。"},
{"c":"法規","q":"労働安全衛生法令上、通路等に関する記述のうち、誤っているものはどれか。","a":["屋内に設ける通路は、通路面から高さ1.5m以内に障害物を置かないようにしなければならない。","架設通路の勾配は、原則として30度以下としなければならない。","架設通路で勾配が15度を超えるものには、踏桟その他の滑止めを設けなければならない。","高さ8m以上の登り桟橋には、7m以内ごとに踊場を設けなければならない。"],"ans":0,"ex":"【1級頻出】屋内通路は<b>通路面から高さ1.8m以内</b>に障害物を置いてはならない(安衛則第542条)。架設通路は勾配30度以下(階段又は高さ2m未満で丈夫な手掛を設けたものを除く)、15度超で滑止め、墜落危険箇所に高さ85cm以上の手すりを設ける。"},
{"c":"法規","q":"労働基準法に関する記述のうち、誤っているものはどれか。","a":["労働者が業務上の負傷により療養のため労働できず賃金を受けない場合、使用者は平均賃金の100分の50の休業補償を行わなければならない。","使用者とは、事業主又は事業の経営担当者その他その事業の労働者に関する事項について、事業主のために行為をするすべての者をいう。","使用者は、満18歳に満たない者について、その年齢を証明する戸籍証明書を事業場に備え付けなければならない。","使用者は、満18歳に満たない者を、クレーンの運転など危険有害な業務に就かせてはならない。"],"ans":0,"ex":"【1級頻出】業務上の負傷・疾病による休業補償は<b>平均賃金の100分の60</b>(労基法第76条)。使用者の責に帰すべき事由による休業手当も100分の60以上であり、どちらも6割と覚える。"},
{"c":"法規","q":"建築基準法上の用語等に関する記述のうち、誤っているものはどれか。","a":["延焼のおそれのある部分には、防火上有効な公園、広場、川などに面する建築物の部分も含まれる。","地階で、倉庫・機械室などの用途に供する部分の水平投影面積の合計が建築面積の1/8以下のものは、階数に算入しない。","建築物の部分によって階数が異なる場合は、これらのうち最大のものをその建築物の階数とする。","地階とは、床が地盤面下にある階で、床面から地盤面までの高さがその階の天井の高さの1/3以上のものをいう。"],"ans":0,"ex":"【1級頻出】防火上有効な公園・広場・川等の空地や水面、耐火構造の壁等に面する部分は<b>延焼のおそれのある部分から除かれる</b>(法第2条第6号)。階数不算入となる地階は倉庫・機械室等の用途に限られ、居室や事務室は対象外。"},
{"c":"法規","q":"建築基準法令上、建築設備に関する記述のうち、誤っているものはどれか。","a":["排水槽の底には、吸込みピットに向かって1/20以上1/15以下の勾配を設ける。","非常用エレベーターの乗降ロビーには、屋内消火栓、連結送水管の放水口、非常コンセント設備等の消火設備を設置できるものとする。","自然換気設備の排気口は、給気口より高い位置に設け、常時開放された構造とする。","給水タンクの天井、底又は周壁は、建築物の他の部分と兼用してはならない。"],"ans":0,"ex":"【1級頻出】排水槽の底の勾配は吸込みピットに向かって<b>1/15以上1/10以下</b>とする(昭和50年建設省告示第1597号)。給水タンクは六面点検ができるよう建築物の他の部分と兼用せず、周囲に点検スペースを確保する。"},
{"c":"法規","q":"建設業法上、主任技術者及び監理技術者に関する記述のうち、誤っているものはどれか。","a":["国又は地方公共団体が発注する工事では、請負代金の額にかかわらず、主任技術者又は監理技術者を工事現場ごとに専任で置かなければならない。","公共性のある施設等に関する重要な建設工事で、請負代金の額が4,500万円(建築一式工事は9,000万円)以上のものは、工事現場ごとに専任の技術者を置かなければならない。","密接な関係のある2以上の建設工事を同一の建設業者が同一の場所又は近接した場所で施工する場合、同一の主任技術者がこれらの工事を管理することができる。","監理技術者補佐を専任で置いた場合、監理技術者は2つの工事現場を兼任することができる(特例監理技術者)。"],"ans":0,"ex":"【1級頻出】専任義務の対象は請負代金<b>4,500万円以上(建築一式は9,000万円以上)</b>の公共性のある重要な工事であり、国・地方公共団体の発注であっても金額未満なら専任を要しない。令和5年の政令改正で3,500万円から4,500万円に引き上げられた。"},
{"c":"法規","q":"建設業法上、管工事の監理技術者となることができる者として、正しいものはどれか。","a":["1級管工事施工管理技士の資格を有する者","2級管工事施工管理技士で、2年以上の指導監督的な実務経験を有する者","管工事に関して10年以上の実務経験と、2年以上の指導監督的な実務経験を有する者","一級建築士の免許を受けた者"],"ans":0,"ex":"【1級頻出】管工事業は<b>指定建設業</b>(土木一式・建築一式・電気・管・鋼構造物・舗装・造園の7業種)のため、監理技術者は1級国家資格者又は国土交通大臣の認定者に限られ、実務経験による要件は認められない。一級建築士は管工事業の技術者要件には該当しない。"},
{"c":"法規","q":"消防法令上、1号消火栓を用いる屋内消火栓設備に関する記述のうち、誤っているものはどれか。","a":["加圧送水装置のポンプには、吸込み側に圧力計、吐出し側に連成計を設ける。","ポンプには、締切運転時の水温上昇を防止するための逃し配管と、性能を試験するための性能試験配管を設ける。","ノズル先端の放水圧力が0.7MPaを超えないよう、減圧措置を講じる。","主配管のうち立上り管の管径は、呼び径50mm以上とする。"],"ans":0,"ex":"【1級頻出】ポンプの<b>吐出し側に圧力計、吸込み側に連成計</b>を設ける。連成計は正圧と負圧の両方を測定でき、吸込み側の状態確認に用いる。1号消火栓の放水圧力は0.17MPa以上0.7MPa以下、放水量130L/min以上。"},
{"c":"法規","q":"消防法令上、不活性ガス消火設備に関する記述のうち、誤っているものはどれか。","a":["常時人がいない駐車の用に供される部分や通信機器室には、局所放出方式を採用する。","非常電源は、当該設備を有効に1時間作動させることができる容量とする。","手動起動装置は、防護区画ごとに設ける。","貯蔵容器は、防護区画以外の場所で、温度40℃以下で温度変化が少なく、直射日光や雨水のかかるおそれの少ない場所に設ける。"],"ans":0,"ex":"【1級頻出】常時人がいない駐車部分、通信機器室、ボイラー室などは<b>全域放出方式</b>とする。局所放出方式は区画を形成できない部分の局所的な消火に用いる。非常電源は1時間、起動装置は防護区画ごとに設置。"},
{"c":"法規","q":"騒音規制法上、指定地域内における特定建設作業に関する記述のうち、誤っているものはどれか。","a":["特定建設作業を伴う建設工事を施工しようとする者は、作業開始の日の7日前までに都道府県知事に届け出なければならない。","特定建設作業の実施の届出は、災害などの緊急の場合を除き、作業開始の日の7日前までに行う。","特定建設作業は、その作業を開始した日に終わるものは除かれる。","特定建設作業の騒音は、同一場所において連続6日を超えて行われる作業に伴って発生するものであってはならない。"],"ans":0,"ex":"特定建設作業の届出先は<b>市町村長</b>である(騒音規制法・振動規制法ともに)。1号区域では1日10時間以内、午後7時から翌日午前7時までの夜間作業禁止、敷地境界で85dBを超えないことが規制基準となる。"},
{"c":"法規","q":"廃棄物の処理及び清掃に関する法律上、建設工事に伴って生じる産業廃棄物に関する記述のうち、誤っているものはどれか。","a":["建設工事が数次の請負によって行われる場合、産業廃棄物の排出事業者は、実際に廃棄物を発生させた下請負人である。","専ら再生利用の目的となる産業廃棄物(古紙、くず鉄、空きびん、古繊維)のみの処理を業として行う者に委託する場合は、産業廃棄物管理票の交付を要しない。","事業者が自ら産業廃棄物を運搬する場合は、産業廃棄物収集運搬業の許可を受ける必要がない。","管理票交付者は、前年度に交付した管理票の交付等の状況を、毎年6月30日までに都道府県知事に報告しなければならない。"],"ans":0,"ex":"【1級頻出】建設工事では<b>元請業者が排出事業者</b>となる(法第21条の3)。下請負人が元請の産業廃棄物を運搬・処分する場合は原則として収集運搬業等の許可が必要で、処分業の許可のみでは運搬を受託できない。"},
{"c":"原論・基礎","q":"地球環境に関する記述のうち、適当でないものはどれか。","a":["酸性雨は、大気中の二酸化炭素が雨水に溶け込むことが主な原因であり、pHが7未満の雨をいう。","HFC-134aは、オゾン層破壊係数はゼロであるが、地球温暖化係数は二酸化炭素の1,000倍を超える。","オゾン層は成層圏にあり、太陽からの有害な紫外線を吸収する働きをもつ。","温室効果ガスには、二酸化炭素のほかメタン、一酸化二窒素、フロン類などが含まれる。"],"ans":0,"ex":"【1級頻出】酸性雨は、化石燃料の燃焼で生じる<b>硫黄酸化物(SOx)や窒素酸化物(NOx)</b>が大気中で硫酸・硝酸となって雨に溶け込むもので、一般に<b>pH5.6以下</b>の雨をいう。二酸化炭素が溶けた通常の雨も弱酸性(pH約5.6)であり、これを酸性雨とはいわない。HFC系冷媒はODPがゼロでもGWPは大きく(HFC-134aで約1,430)、フロン排出抑制法による管理の対象である。"},
{"c":"原論・基礎","q":"排水の水質指標に関する記述のうち、適当でないものはどれか。","a":["ノルマルヘキサン抽出物質は、水中に浮遊する粒径2mm以下の固形物の量を表す指標である。","BODは、水中の有機物が好気性微生物によって分解されるときに消費される酸素量である。","TOCは、水中の有機物に含まれる炭素の総量を表す指標である。","SSは、水中に懸濁している不溶解性物質の量であり、ろ過して分離した固形物の質量で表す。"],"ans":0,"ex":"【1級頻出】ノルマルヘキサン抽出物質は、水中の<b>油分(動植物油・鉱物油)やグリース</b>など、ヘキサンに抽出される物質の量を表す指標で、厨房排水などの評価に用いる。浮遊する固形物の量を表すのは<b>SS(浮遊物質)</b>である。BODは微生物による生化学的な酸素消費量、CODは酸化剤による化学的な酸素消費量という違いも押さえておく。"},
{"c":"原論・基礎","q":"流体の性質に関する記述のうち、適当でないものはどれか。","a":["水の粘性係数は、水温が上昇するほど大きくなる。","水の密度は約4℃で最大となり、それより高温でも低温でも小さくなる。","水の表面張力は、水温の上昇とともに小さくなる。","一様な流れの中に置かれた円柱の下流側には、カルマン渦と呼ばれる周期的な渦が交互に発生する。"],"ans":0,"ex":"【1級頻出】液体の粘性係数は分子間の引力に起因するため、<b>温度が上がると小さくなる</b>。水では20℃から80℃で約3分の1に低下する。一方、気体の粘性係数は分子運動の活発化により<b>温度上昇とともに大きくなる</b>点が対照的で、問われやすい。密度の最大点(約4℃)、表面張力の温度依存性、カルマン渦は正しい記述である。"},
{"c":"原論・基礎","q":"蒸気圧縮式冷凍サイクルに関する記述のうち、適当でないものはどれか。","a":["蒸発器で冷媒が周囲から吸収する熱は、主として冷媒の温度上昇に使われる顕熱である。","凝縮器での放熱量は、蒸発器での吸熱量と圧縮機の仕事量の和にほぼ等しい。","膨張弁を通過する冷媒の状態変化は、比エンタルピーが一定の変化(等エンタルピー変化)として扱う。","モリエ線図(p-h線図)は、縦軸に圧力、横軸に比エンタルピーをとった冷媒の状態図である。"],"ans":0,"ex":"蒸発器では液冷媒が低温低圧で<b>蒸発(気化)</b>し、そのときの<b>蒸発潜熱</b>として周囲から熱を奪うことで冷却作用が得られる。顕熱ではなく潜熱の移動が主体であり、潜熱が大きい冷媒ほど単位質量当たりの冷凍効果が大きい。凝縮器放熱量=蒸発器吸熱量+圧縮仕事、膨張弁は等エンタルピー変化という基本関係も合わせて確認しておく。"},
{"c":"原論・基礎","q":"音に関する記述のうち、適当でないものはどれか。","a":["グラスウールなどの多孔質吸音材は、中高音域の音より低音域の音をよく吸収する。","空気中の音速は、気温が高くなるほど速くなる。","点音源からの距離が2倍になると、音圧レベルは約6dB低下する。","NC曲線による室内騒音の評価では、NC値が小さいほど静かな室である。"],"ans":0,"ex":"【1級頻出】グラスウールやロックウールなどの<b>多孔質吸音材</b>は、空気の粘性摩擦で音エネルギーを熱に変えるため、<b>中高音域の吸音率が高く、低音域は吸音しにくい</b>。低音域の吸音には、板振動型や共鳴型(孔あき板など)の吸音構造が用いられる。音速は約331+0.6t[m/s](tは気温℃)で温度とともに増加し、点音源は距離2倍で約6dB減衰する。"},
{"c":"原論・基礎","q":"低圧屋内配線に関する記述のうち、適当でないものはどれか。","a":["使用電圧400Vの金属管工事において、乾燥した場所に施設する場合は、金属管の接地工事を省略できる。","使用電圧200Vの金属管工事で、管の長さが4m以下のものを乾燥した場所に施設する場合は、D種接地工事を省略できる。","300Vを超える低圧用機器の金属製外箱には、C種接地工事を施し、接地抵抗値は原則として10Ω以下とする。","低圧屋内配線の電線は、特別な場合を除き、直径1.6mm以上の軟銅線又はこれと同等以上の強さ・太さのものを用いる。"],"ans":0,"ex":"【1級頻出】300Vを超える低圧(400V配線など)の金属管・金属製ボックスには<b>C種接地工事</b>が必要であり、乾燥した場所であっても<b>省略は認められない</b>(接触防護措置を施した場合にD種接地工事へ緩和できるだけ)。接地工事の省略が認められるのは300V以下の場合で、管長4m以下を乾燥した場所に施設するときなどに限られる。"},
{"c":"原論・基礎","q":"三相誘導電動機の始動・制御に関する記述のうち、適当でないものはどれか。","a":["三相誘導電動機をじか入れ(全電圧)始動すると、始動電流は定格電流の1.5倍程度に抑えられる。","スターデルタ始動では、始動電流・始動トルクともにじか入れ始動の約1/3になる。","インバータ制御は、電源の周波数と電圧を変えて回転速度を制御するもので、送風機やポンプの省エネルギーに有効である。","定格出力が0.2kW以下の電動機は、過負荷保護装置を省略することができる。"],"ans":0,"ex":"【1級頻出】三相誘導電動機をじか入れ始動すると、始動電流は<b>定格電流の5〜7倍程度</b>に達し、電圧降下や電源容量への影響が問題となる。このため中容量以上ではスターデルタ始動(電流・トルクとも1/3)やインバータによるソフトスタートを採用する。インバータは周波数に比例して回転速度を変えられ、部分負荷時の軸動力低減に大きく寄与する。"},
{"c":"原論・基礎","q":"鉄筋コンクリート造の配筋等に関する記述のうち、適当でないものはどれか。","a":["配管用スリーブは、位置がずれないように柱や梁の主筋に直接溶接して固定する。","柱の帯筋(フープ)は、柱のせん断補強と主筋の座屈防止を目的として配置する。","梁のあばら筋(スターラップ)は、梁のせん断力に対する補強を目的として配置する。","梁に設ける貫通孔は、孔の周囲を補強筋で補強し、孔径は原則として梁せいの1/3以下とする。"],"ans":0,"ex":"【1級頻出】配管用スリーブを<b>鉄筋に直接溶接すると鉄筋の強度低下</b>を招くため禁止されている。スリーブは鉄筋との間に所定の<b>かぶり厚さ</b>を確保し、支持材(型枠への取付けや補助材)で位置を保持して固定する。帯筋・あばら筋はいずれもせん断補強筋で、梁貫通孔は梁せいの1/3以下、補強筋を配置するのが原則である。"},
{"c":"原論・基礎","q":"コンクリートに関する記述のうち、適当でないものはどれか。","a":["スランプ値が大きいコンクリートは流動性が低く、打込みや締固めが困難になる。","水セメント比が小さいほど、コンクリートの圧縮強度は大きくなる。","単位水量が多いコンクリートは、乾燥収縮が大きくなりひび割れが生じやすい。","AE剤を用いると、ワーカビリティが改善されるとともに凍結融解に対する抵抗性が向上する。"],"ans":0,"ex":"【1級頻出】スランプ値は<b>フレッシュコンクリートの軟らかさ(流動性)</b>を表し、値が大きいほど流動性が高く打込みは容易になるが、<b>材料分離を生じやすく</b>強度・耐久性の低下につながる。このため必要以上に大きなスランプは避ける。水セメント比の低減は強度と耐久性の向上に、単位水量の低減は乾燥収縮の抑制にそれぞれ有効である。"},
{"c":"空調","q":"空気調和設備の省エネルギーに有効な建築的手法に関する記述のうち、適当でないものはどれか。","a":["窓ガラスには、日射遮へい係数の大きいものを採用すると冷房負荷を低減できる。","外皮面積を小さくするため、建物の平面形状はなるべく正方形に近いものとする。","廊下・倉庫などの非空調室を外周部(特に西側)に配置し、空調室の外壁負荷を軽減する。","外壁に対する窓面積比を小さくし、窓にはLow-E複層ガラスなど断熱・遮熱性の高いものを用いる。"],"ans":0,"ex":"【1級頻出】日射遮へい係数(SC)は、透明板ガラスの日射熱取得を1としたときの比率であり、値が<b>小さいほど日射を遮る性能が高い</b>。冷房負荷を低減するには遮へい係数の<b>小さい</b>ガラス(熱線反射・Low-Eガラスなど)を選定する。平面形状の正方形化、非空調室の外周配置、窓面積比の低減はいずれも外皮負荷を減らす有効な手法である。"},
{"c":"空調","q":"空気調和方式に関する記述のうち、適当でないものはどれか。","a":["負荷変動の異なる多数のゾーンへの対応は、定風量(CAV)単一ダクト方式の方が変風量(VAV)方式より容易である。","床吹出し空調方式は、二重床を給気経路に利用するため、OA機器のレイアウト変更に対応しやすい。","ファンコイルユニット・ダクト併用方式は、ペリメータ負荷をファンコイルユニットで処理し、外気負荷や内部負荷をダクト系で処理する。","変風量(VAV)方式は、低負荷時に送風量が減少するため送風機動力を低減できる。"],"ans":0,"ex":"【1級頻出】定風量(CAV)単一ダクト方式は、各ゾーンへ同一温度の空気を一定風量で送るため、<b>ゾーンごとの負荷変動には対応しにくい</b>。各ゾーンにVAVユニットを設けて風量を個別に制御する<b>VAV方式の方が多ゾーン対応は容易</b>である。ただしVAV方式は低負荷時に外気量不足や気流分布の悪化を生じやすい点に注意する。"},
{"c":"空調","q":"空気調和機に組み込む加湿装置に関する記述のうち、適当でないものはどれか。","a":["気化式加湿器では、加湿前後で通過する空気の乾球温度はほとんど変化しない。","蒸気式加湿器は、加湿による空気温度の低下がほとんどなく、衛生的で制御性もよい。","水噴霧式加湿器は、水中の不純物が室内に飛散しないよう、給水の水質管理が必要である。","気化式加湿器は飽和効率が100%とはならないため、必要加湿量に対して十分な通風面積が必要である。"],"ans":0,"ex":"【1級頻出】気化式(滴下式・透湿膜式など)の加湿は<b>断熱加湿</b>であり、水の蒸発潜熱を空気から奪うため、<b>空気の乾球温度は低下</b>する(湿球温度はほぼ一定)。このため暖房時には再熱が必要になることがある。蒸気式は等温に近い加湿で温度低下が小さく、病院などの衛生面が重視される用途に適する。"},
{"c":"空調","q":"コージェネレーションシステムに関する記述のうち、適当でないものはどれか。","a":["ガスタービン発電機の発電効率は、同容量のガスエンジンやディーゼルエンジンに比べて高い。","ガスタービンの排ガス温度は高いため、排熱ボイラーによる蒸気回収に適している。","商用電力と系統連系する場合は、電力会社との協議を行い、所定の保護装置を設ける必要がある。","燃料電池は、原動機方式に比べて発電効率が高く、騒音や振動が小さい。"],"ans":0,"ex":"【1級頻出】中小容量のコージェネレーションでは、発電効率は<b>ディーゼルエンジン>ガスエンジン>ガスタービン</b>の順であり、ガスタービンは発電効率が低い反面、排ガス温度が高く<b>排熱回収率が高い</b>のが特徴である。したがって蒸気需要が大きい施設にはガスタービン、電力需要主体ならエンジン方式や燃料電池が有利となる。"},
{"c":"空調","q":"機械排煙設備に関する記述のうち、適当でないものはどれか。","a":["天井から吊り下げて設ける排煙口の手動開放装置の操作部は、床面からおおむね1.2mの高さとする。","排煙ダクト内の風速は20m/s以下、排煙口の風速は10m/s以下とする。","排煙機は、最も高い位置にある排煙口よりも高い位置に設ける。","壁に取り付ける排煙口の手動開放装置の操作部は、床面から0.8m以上1.5m以下の高さに設ける。"],"ans":0,"ex":"【1級頻出】排煙口の手動開放装置は、<b>壁付の場合は床面から0.8m以上1.5m以下</b>、天井から<b>吊り下げる場合は床面からおおむね1.8m</b>の高さに操作部を設ける(建築基準法施行令第126条の3)。1.2mでは吊下げ式として低すぎ、通行の支障にもなる。排煙機を最上部排煙口より高い位置に置くのは、ダクト内に煙がたまらないようにするためである。"},
{"c":"給排水衛生","q":"上水道に関する記述のうち、適当でないものはどれか。","a":["緩速ろ過方式は、急速ろ過方式に比べろ過速度が大きく、ろ過池の面積を小さくできる。","導水施設は、取水施設で取り入れた原水を浄水施設まで送る施設である。","給水栓における水は、遊離残留塩素を0.1mg/L以上保持しなければならない。","計画送水量は、計画1日最大給水量を基準として定める。"],"ans":0,"ex":"【1級頻出】緩速ろ過は、砂層表面の生物膜によって浄化する方式で、ろ過速度は<b>4〜5m/日</b>程度と遅く、<b>広大な敷地</b>を必要とする。これに対し急速ろ過は凝集沈殿を前処理とし、ろ過速度<b>120〜150m/日</b>と大きいため敷地が限られる都市部に適する。残留塩素の基準値(遊離0.1mg/L以上)と送水量の基準(1日最大給水量)も頻出である。"},
{"c":"給排水衛生","q":"下水道に関する記述のうち、適当でないものはどれか。","a":["管きょ内の計画流速の最小値は、汚水管きょで0.8m/s、雨水管きょ及び合流管きょで0.6m/sとする。","上流管と下流管の管底高に0.6m以上の段差がある場合は、副管を用いた段差接合とする。","管きょが河川や鉄道などを横断する場合には、伏越しを用いることがある。","取付管の管径は、150mmを標準とする。"],"ans":0,"ex":"【1級頻出】管きょ内の計画流速は、汚水管きょで<b>0.6〜3.0m/s</b>、雨水管きょ・合流管きょで<b>0.8〜3.0m/s</b>とされ、最小流速は<b>雨水管きょの方が大きい</b>。雨水には土砂が多く含まれ、沈殿・堆積を防ぐためより大きな流速が必要になるからである。段差接合(0.6m以上は副管)や取付管150mmも定番の論点である。"},
{"c":"給排水衛生","q":"給水設備に関する記述のうち、適当でないものはどれか。","a":["給水管内の流速は、ウォーターハンマー防止の観点から3.5〜4.0m/s程度とする。","事務所ビルにおける一般の給水器具の給水圧力の上限は、0.4〜0.5MPa程度とする。","直結増圧方式の給水立て管最頂部には、吸排気弁を設ける。","受水タンクは、保守点検のため周囲及び下部に60cm以上、上部に100cm以上の空間を確保する。"],"ans":0,"ex":"【1級頻出】給水管内の流速は、ウォーターハンマーや流水騒音、管の浸食を防ぐため<b>2.0m/s程度以下</b>に抑える。3.5〜4.0m/sは明らかに過大で、弁の急閉止時に大きな水撃圧を生じる。給水圧力は上限0.4〜0.5MPa、器具の最低必要圧力は一般水栓30kPa・シャワー70kPaなどの数値も合わせて覚えておく。"},
{"c":"給排水衛生","q":"中央式給湯設備に関する記述のうち、適当でないものはどれか。","a":["給湯循環ポンプは、貯湯タンク出口側の給湯管(往き管)に設ける。","循環流量は、給湯配管からの熱損失を給湯温度と返湯温度の差(5℃程度)で除して求める。","貯湯温度は、レジオネラ属菌の繁殖を防ぐため60℃以上に保つ。","返湯管の管径は、給湯管より小さくてよく、給湯管径の1/2程度とすることが多い。"],"ans":0,"ex":"【1級頻出】給湯循環ポンプは<b>返湯管側(貯湯タンクへの戻り入口側)</b>に設ける。返湯管側の方が水温が低くポンプの耐久性に有利であり、往き管側に設けると給湯管内の圧力上昇や高温水の取扱いの問題が生じる。循環流量は配管熱損失÷(比熱×密度×温度差)で算定し、貯湯60℃以上・給湯栓55℃以上の管理が衛生面の基本である。"},
{"c":"給排水衛生","q":"排水設備に関する記述のうち、適当でないものはどれか。","a":["排水槽への流入量の変動が著しい場合、排水ポンプの揚水量は時間平均排水量を基準に決定する。","厨房排水など油脂類を多く含む排水は、グリース阻集器を通してから排水系統に接続する。","定常流量法では、器具平均排水流量と器具平均排水間隔から負荷流量を求めて管径を決定する。","排水ポンプは原則として2台設置し、自動交互運転とする。"],"ans":0,"ex":"【1級頻出】排水槽に流入する排水量の変動が大きい場合、排水ポンプの揚水量は<b>時間最大排水量</b>を基準にしないと槽が満水となるおそれがある。時間平均排水量を基準にするのは、流入量がおおむね一定とみなせる場合に限られる。グリース阻集器や2台交互運転は排水設備の基本で、ポンプは異常時に同時運転となる仕様とする。"},
{"c":"給排水衛生","q":"排水設備に関する記述のうち、適当でないものはどれか。","a":["管径65mm以上の間接排水管の排水口空間は、最小100mmとする。","排水立て管のオフセットが垂直に対して45度以内であれば、立て管とみなして管径を決定する。","雑排水用水中ポンプの口径は50mm以上、汚物用水中ポンプの口径は80mm以上とする。","排水槽の底部には、吸込みピットに向かって1/15以上1/10以下の勾配を設ける。"],"ans":0,"ex":"【1級頻出】間接排水の排水口空間は、間接排水管の管径が<b>25mm以下で最小50mm、30〜50mmで最小100mm、65mm以上で最小150mm</b>と定められている。飲料用タンクのオーバーフロー管などは管径に関係なく150mm以上とする。排水槽の底勾配1/15〜1/10、排水ポンプ口径(雑排水50mm以上、汚水80mm以上)も頻出の数値である。"},
{"c":"給排水衛生","q":"消火設備の消火原理に関する記述のうち、適当でないものはどれか。","a":["不活性ガス消火設備は、消火剤が燃焼物と化学反応して燃焼の連鎖反応を抑制することにより消火する。","泡消火設備は、泡で燃焼面を覆う窒息効果と、泡に含まれる水分による冷却効果により消火する。","粉末消火設備は、燃焼の連鎖反応を抑える負触媒(抑制)効果を主として消火する。","水噴霧消火設備は、噴霧水の冷却効果と、発生した水蒸気による窒息効果により消火する。"],"ans":0,"ex":"不活性ガス(二酸化炭素・窒素・IG-55など)消火設備は、防護区画内に放出して<b>酸素濃度を低下させる窒息(希釈)効果</b>で消火するもので、化学反応による抑制効果は利用しない。化学的な負触媒効果を主とするのは粉末消火設備やハロゲン化物消火設備である。泡は窒息+冷却、水噴霧は冷却+窒息(油面上ではエマルション効果も)と、方式ごとの原理を整理しておく。"},
{"c":"機器・材料","q":"冷凍機に関する記述のうち、適当でないものはどれか。","a":["往復動冷凍機は、遠心冷凍機に比べて容量制御が容易で、部分負荷時の追従性に優れる。","二重効用吸収冷凍機は、高温再生器で発生した冷媒蒸気の熱で低温再生器を加熱するため、単効用に比べ熱効率が高い。","スクリュー冷凍機は容積式の圧縮機を用い、スライド弁により連続的な容量制御ができる。","吸収冷凍機は、圧縮式冷凍機に比べて始動から定格能力に達するまでの立上り時間が長い。"],"ans":0,"ex":"【1級頻出】遠心(ターボ)冷凍機は吸込みベーンの開度調整などにより<b>連続的で滑らかな容量制御</b>ができ、負荷追従性に優れる。往復動冷凍機は気筒数の切替えによる段階的な制御が主で、大容量機では制御性に劣る。二重効用吸収式はCOPが約1.2〜1.3(単効用約0.7)、スクリュー式はスライド弁による無段階制御という各方式の特徴も押さえておく。"},
{"c":"機器・材料","q":"ボイラー等に関する記述のうち、適当でないものはどれか。","a":["炉筒煙管ボイラーは、保有水量が少ないため予熱時間が短く、負荷変動に速やかに追従できる。","鋳鉄製ボイラーは、セクションに分割して搬入・組立てができ、低圧の蒸気又は温水用に用いられる。","小型貫流ボイラーは、保有水量が少なく起動時間が短いが、給水の水処理が重要である。","真空式温水発生機は、缶体内を大気圧以下に保って運転するため、ボイラー及び圧力容器安全規則の適用を受けない。"],"ans":0,"ex":"炉筒煙管ボイラーは、円筒形の胴内に炉筒と多数の煙管を納めた構造で<b>保有水量が多い</b>。そのため<b>予熱(立上り)時間は長い</b>が、負荷変動に対して圧力・水位が安定しやすく、取扱いが容易という特徴がある。これと対照的に小型貫流ボイラーは保有水量が少なく、起動が速い反面スケール障害を受けやすい。真空式・無圧式温水発生機はボイラー法規の適用外で、取扱資格が不要である。"},
{"c":"機器・材料","q":"空気清浄装置に関する記述のうち、適当でないものはどれか。","a":["静電式空気清浄装置の粒子捕集率は、通過する空気の面風速に影響されない。","自動巻取形エアフィルタは、ろ材の圧力損失が設定値に達するとろ材を自動的に巻き取る。","活性炭フィルタは、臭気や有害ガスなどガス状汚染物質の除去に用いる。","HEPAフィルタは、粒径0.3μmの粒子を99.97%以上捕集できる性能をもつ。"],"ans":0,"ex":"静電式空気清浄装置は、高電圧で粒子を帯電させ集じん極板に吸着させる方式であり、面風速が大きくなると粒子が極板に到達する前に通過してしまうため、<b>捕集率は面風速の影響を受ける</b>。所定の性能を得るには設計風速の範囲内で使用する必要がある。HEPAフィルタの定義(0.3μm・99.97%以上)、活性炭のガス吸着、自動巻取形の差圧制御も基本事項である。"},
{"c":"機器・材料","q":"配管附属品に関する記述のうち、適当でないものはどれか。","a":["フロート分離型(パイロット式)の定水位調整弁は、主弁が故障したときに副弁のボールタップが代わって給水する構造である。","減圧弁は、一次側の圧力が変動しても二次側の圧力をほぼ一定に保つ弁である。","温度調整弁は、感温部で検出した温度に応じて弁を開閉し、給湯温度などを一定に保つ。","定流量弁は、弁前後の差圧が変動しても通過流量をほぼ一定に保つ。"],"ans":0,"ex":"【1級頻出】フロート分離型の定水位調整弁は、タンク内の小型ボールタップ(<b>副弁</b>)が水位に応じて開閉し、その圧力変化を利用して<b>主弁を開閉させる</b>パイロット式の弁である。副弁は主弁を動かすための操作弁であり、主弁故障時の代替給水装置ではない。主弁をタンク外に設置できるため大容量の受水タンクへの給水に適する。"},
{"c":"機器・材料","q":"ダクトに関する記述のうち、適当でないものはどれか。","a":["共板フランジ工法は、アングルフランジ工法に比べてフランジ部の締付け力が大きい。","低圧ダクトの常用圧力は、正圧・負圧ともに500Pa以内である。","フレキシブルダクトは、吹出口との接続などに用い、過度に曲げたりつぶしたりしないよう施工する。","高圧1ダクトの常用圧力は、正圧で500Paを超え1,000Pa以下である。"],"ans":0,"ex":"【1級頻出】共板フランジ工法やスライドオンフランジ工法などの<b>コーナーボルト工法</b>は、四隅のボルトとフランジ押え金具(クリップ)で接合するため、全周をボルト締めする<b>アングルフランジ工法の方が締付け力は大きい</b>。コーナーボルト工法はこれを補うため、ガスケットの選定とコーナー部のシールが重要になる。ダクトの圧力区分(低圧±500Pa、高圧1 +1,000Pa、高圧2 +2,500Pa)も頻出である。"},
{"c":"設計図書","q":"公共工事標準請負契約約款に関する記述のうち、適当でないものはどれか。","a":["監督員が必要と認めて行う破壊検査に要する費用及び復旧に要する費用は、発注者の負担とする。","受注者は、設計図書に定めるところにより、工事目的物及び工事材料等に火災保険等を付さなければならない。","受注者が発注者に対して行う通知・請求等は、原則として監督員を経由して行う。","発注者は、必要があると認めるときは、設計図書の変更内容を受注者に通知して設計図書を変更することができる。"],"ans":0,"ex":"【1級頻出】約款では、監督員が設計図書の記載に適合しないおそれがあると認める相当の理由がある場合、必要に応じて工事目的物を最小限度破壊して検査でき、その<b>検査及び復旧に直接要する費用は受注者の負担</b>とされている。火災保険の付保義務、監督員経由の原則、発注者による設計図書変更権はいずれも約款の規定どおりである。"},
{"c":"機器・材料","q":"JISに規定する配管材料に関する記述のうち、適当でないものはどれか。","a":["銅管のMタイプは、Lタイプより肉厚が厚い。","硬質ポリ塩化ビニル管のVU管はVP管より肉厚が薄く、主に排水用に用いられる。","水道用亜鉛めっき鋼管(SGPW)は、静水頭100m以下の水道用に用いられる。","配管用ステンレス鋼鋼管などのスケジュール番号は、番号が大きいほど肉厚が厚い。"],"ans":0,"ex":"【1級頻出】銅管(JIS H 3300)の肉厚区分は<b>K>L>M</b>の順で、Kタイプが最も厚く、Mタイプが最も薄い。建築設備の給水・給湯にはLタイプ又はMタイプが多く用いられる。VU管は薄肉で排水・通気用、VP管は給水等の圧力配管用、スケジュール番号(Sch)は数字が大きいほど厚肉という材料の基本区分を整理しておく。"},
{"c":"施工管理","q":"品質管理に関する記述のうち、適当でないものはどれか。","a":["品質管理を徹底すると手直しや手戻りは減少するが、工事費は必ず増加する。","QC工程図は、工程の順序に沿って管理項目・管理方法・管理基準・担当などを明示したものである。","品質管理は、計画(Plan)・実施(Do)・確認(Check)・処置(Act)のサイクルを繰り返して進める。","配管の水圧試験や機器の試運転調整も、品質管理の行為に含まれる。"],"ans":0,"ex":"【1級頻出】品質管理の目的は、要求品質を経済的に実現することであり、適切に行えば<b>手直し・手戻り・クレームの減少によってコストは低減</b>する方向に働く。工事費の増加が必然的なデメリットになるわけではない。品質管理のメリットには、品質の向上と均一化、信頼性の確保、無駄な作業の削減、技術者の意識向上などがある。"},
{"c":"施工管理","q":"安全管理に関する用語の記述のうち、適当でないものはどれか。","a":["ZD(ゼロディフェクト)運動とは、作業手順をマニュアル化し、管理者が作業者を監視することによってミスをなくす活動である。","不安全行動とは、本人や他人の安全を阻害する可能性のある行動を意図的に行うことをいう。","指差呼称は、対象を指で差し声に出して確認することで、意識レベルを高め誤操作を防ぐ手法である。","4Sとは、整理・整頓・清掃・清潔を徹底し、安全で快適な職場環境をつくる活動である。"],"ans":0,"ex":"【1級頻出】ZD運動は、<b>作業者一人ひとりの自主的な注意と工夫</b>によって仕事の欠陥(ディフェクト)をゼロにしようとする運動であり、管理者による監視やマニュアルの強制によるものではない。不安全行動は意図的な危険行動、ヒューマンエラーは意図しない誤りという区別も合わせて覚える。"},
{"c":"応用能力","q":"機器の据付けに関する記述のうち、適当でないものはどれか。","a":["大型のボイラーや冷凍機の基礎は、コンクリート打設後3日程度養生すれば機器を据え付けてよい。","屋外に設置する空気熱源ヒートポンプの屋外機は、冬期の季節風の影響を受けにくい位置に設置する。","冷却塔は、煙突や厨房排気口などからの排気を吸い込まない位置に設置する。","天井から吊り下げる送風機には、地震時の揺れを防ぐため振れ止めを設ける。"],"ans":0,"ex":"【1級頻出】大型機器の基礎コンクリートは、所要の強度が発現するまで養生する必要があり、<b>打設後10日以上</b>経過してから機器を据え付けるのが標準である。養生不足のまま据え付けると、アンカーボルト周辺のひび割れや基礎の沈下を招く。屋外機のショートサーキット防止や冷却塔の排気吸込み防止、吊り機器の振れ止めは据付け計画の基本事項である。"},
{"c":"応用能力","q":"機器の据付けに関する記述のうち、適当でないものはどれか。","a":["ボイラーの最上部から天井や配管などの上部構造物までの距離は、0.8m以上としなければならない。","メカニカルシール方式のポンプは、グランドパッキン方式と異なり、シール部からの排水管を省略できる。","機器をワイヤロープで吊り上げる場合、ワイヤロープの吊り角度は60度以内とする。","機器の設計用水平地震力は、機器の重要度や設置される階によって異なる値を用いる。"],"ans":0,"ex":"【1級頻出】ボイラー及び圧力容器安全規則により、ボイラーの最上部から天井・配管その他の上部構造物までの距離は<b>1.2m以上</b>としなければならない(安全弁などの附属品の検査・取扱いに支障がない場合を除く)。また、ボイラー側面と壁との距離は原則0.45m以上である。吊り角度60度以内、メカニカルシールの排水不要も据付けの定番論点である。"},
{"c":"施工管理","q":"配管の施工に関する記述のうち、適当でないものはどれか。","a":["青銅製仕切弁の最高許容圧力は、流体が脈動水であっても静流水であっても同じ値である。","転造ねじは、切削ねじに比べてねじ部の強度が高い。","ステンレス鋼管のTIG溶接では、裏波を確保するため管内にアルゴンガスを流してバックシールドを行う。","中心型バタフライ弁は、弁箱内面の弁座ゴムシートに弁体を密着させて止水する。"],"ans":0,"ex":"【1級頻出】JISの青銅弁(JIS B 2011)は、流体の種類によって最高許容圧力が区分されており、<b>静流水(静水)に対しては高く、脈動水・蒸気・空気等に対しては低い</b>値が定められている。ポンプ吐出し側など脈動を伴う系統では、低い方の値で選定する必要がある。転造ねじの強度、TIG溶接のバックシールド、バタフライ弁の止水構造は正しい。"},
{"c":"応用能力","q":"保温・塗装の施工に関する記述のうち、適当でないものはどれか。","a":["立て管の外装テープ巻きは、上部から下方に向かって巻き下げる。","ポリスチレンフォーム保温材は耐熱性が低いため、冷水管やブライン管などの保冷に用いる。","塗装を塗り重ねる場合は、塗料の種類と気温に応じた所定の放置時間(乾燥時間)を確保する。","保温筒を2層以上重ねて施工する場合は、各層の継目が同一箇所にならないようにずらす。"],"ans":0,"ex":"【1級頻出】立て管の外装テープやアルミガラスクロスなどの巻き付けは、<b>下方から上方に向かって巻き上げる</b>。上から巻き下げると重ね部の開口が上を向き、雨水や結露水が重ね目から保温材に浸入するためである。ポリスチレンフォームの使用温度上限は約70℃と低く保冷専用、保温筒の継目ずらしは熱橋防止と強度確保のためである。"},
{"c":"施工管理","q":"設備機器・配管の騒音・振動に関する記述のうち、適当でないものはどれか。","a":["給水管の流水音は、給水圧力が低すぎることが主な原因である。","ウォーターハンマーは、弁の急閉止などによって生じ、水撃防止器の設置などで低減できる。","ポンプのキャビテーションは、吸込み側の圧力が水の飽和蒸気圧以下に低下することによって発生する。","ダクトの振動音は、風速の過大や板厚不足が原因となることが多く、補強や風速の見直しで低減できる。"],"ans":0,"ex":"【1級頻出】給水管の流水音は、<b>給水圧力が高すぎて管内流速が大きくなる</b>ことや、弁・器具部での乱流が主な原因である。対策としては減圧弁で適正圧力(0.4〜0.5MPa以下)に調整し、管内流速を2.0m/s程度以下に抑える。キャビテーションは吸込揚程過大や吸込み配管の抵抗過大で生じ、ウォーターハンマーは急閉止弁の採用を避けることが基本対策である。"},
{"c":"法規","q":"労働安全衛生法上、統括安全衛生責任者が統括管理しなければならない事項として、定められていないものはどれか。","a":["労働災害の原因の調査及び再発防止対策の実施","協議組織の設置及び運営","作業間の連絡及び調整","作業場所の巡視"],"ans":0,"ex":"【1級頻出】統括安全衛生責任者が統括管理する事項(法第30条第1項)は、<b>協議組織の設置・運営、作業間の連絡・調整、作業場所の巡視、関係請負人が行う安全衛生教育に対する指導・援助、工程・機械設備等の配置計画の作成と指導、その他労働災害防止に必要な事項</b>である。災害の原因調査・再発防止対策は、総括安全衛生管理者が統括管理する業務(法第10条)として規定されている。"},
{"c":"法規","q":"労働安全衛生法上、クレーン等の運転及び玉掛けの業務に関する記述のうち、誤っているものはどれか。","a":["つり上げ荷重1t以上5t未満の移動式クレーンの運転は、特別教育を修了した者が行うことができる。","つり上げ荷重1t未満の移動式クレーンの運転は、特別教育を修了した者が行うことができる。","つり上げ荷重1t未満のクレーンの玉掛けの業務は、特別教育を修了した者が行うことができる。","つり上げ荷重5t以上の移動式クレーンの運転は、移動式クレーン運転士免許を受けた者でなければ行えない。"],"ans":0,"ex":"【1級頻出】移動式クレーンの運転は、つり上げ荷重<b>1t未満は特別教育</b>、<b>1t以上5t未満は小型移動式クレーン運転技能講習</b>の修了、<b>5t以上は移動式クレーン運転士免許</b>が必要である。玉掛け業務は、つり上げ荷重1t未満のクレーン等では特別教育、1t以上では玉掛け技能講習の修了が必要となる。"},
{"c":"法規","q":"労働基準法に関する記述のうち、誤っているものはどれか。","a":["常時20人以上の労働者を使用する使用者は、就業規則を作成し、行政官庁に届け出なければならない。","使用者の責に帰すべき事由による休業の場合、使用者は休業期間中、平均賃金の60%以上の休業手当を支払わなければならない。","使用者は、満18歳に満たない者をクレーンの玉掛けの業務(2人以上で行う玉掛けの補助作業を除く)に就かせてはならない。","時間外労働の上限は、労使協定(36協定)を締結した場合でも原則として月45時間・年360時間である。"],"ans":0,"ex":"【1級頻出】就業規則の作成・届出義務があるのは、<b>常時10人以上</b>の労働者を使用する使用者である(法第89条)。変更したときも同様に届出が必要で、作成・変更には労働者の過半数代表の意見を聴かなければならない。休業手当60%、年少者の玉掛け業務禁止、働き方改革による時間外労働の上限規制(月45時間・年360時間)も合わせて確認する。"},
{"c":"法規","q":"建築基準法に関する記述のうち、誤っているものはどれか。","a":["特殊建築物への用途変更で確認申請が必要となるのは、その用途に供する部分の床面積の合計が100m2を超えるものである。","エレベーターの昇降路の部分の床面積は、容積率の算定の基礎となる延べ面積に算入しない。","劇場を映画館にするような類似の用途相互間の用途変更は、確認申請を要しない。","3階を学校の用途に供する建築物であっても、所定の要件を満たせば耐火建築物とせず、1時間準耐火構造等により建築することができる。"],"ans":0,"ex":"【1級頻出】平成30年改正(2019年施行)により、用途変更で確認申請が必要となる特殊建築物の規模は<b>床面積の合計200m2超</b>に引き上げられた(以前は100m2超)。昇降路部分の容積率不算入は平成26年改正、3階建て学校を準耐火構造とできる規定は平成26年改正(法第27条)によるもので、法改正の経緯も含めて現行規定で整理しておく。"},
{"c":"法規","q":"建築基準法上、建築設備に関する記述のうち、誤っているものはどれか。","a":["雨水排水管(雨水排水立て管を除く)を汚水排水管に連結する場合は、排水トラップを設けなくてよい。","給水管や配電管が防火区画を貫通する場合は、管と防火区画とのすき間をモルタルその他の不燃材料で埋めなければならない。","空気調和設備のダクトが防火区画を貫通する部分には、所定の性能をもつ防火ダンパーを設ける。","排水トラップの封水深は、5cm以上10cm以下(阻集器を兼ねる排水トラップは5cm以上)とする。"],"ans":0,"ex":"【1級頻出】雨水排水管(立て管を除く)を汚水排水のための配管設備に連結する場合は、臭気や衛生害虫の逆流を防ぐため、その雨水排水管に<b>排水トラップを設けなければならない</b>(告示第1597号)。なお雨水排水立て管は、汚水排水管や通気管と兼用・連結してはならない。防火区画貫通部の不燃材料充填、防火ダンパー、封水深5〜10cmは正しい記述である。"},
{"c":"法規","q":"建設業法上、技術者制度に関する記述のうち、誤っているものはどれか。","a":["管工事業など指定建設業の監理技術者には、一定年数の実務経験を有する者を選任することができる。","発注者から直接請け負った建設工事を施工するために締結した下請契約の請負代金の総額が5,000万円(建築一式工事は8,000万円)以上の場合は、監理技術者を置かなければならない。","請負代金の額が4,500万円(建築一式工事は9,000万円)以上の公共性のある工事では、主任技術者又は監理技術者を工事現場ごとに専任で置かなければならない。","監理技術者資格者証の交付を受けている者は、5年ごとに監理技術者講習を受講しなければならない。"],"ans":0,"ex":"【1級頻出】土木一式・建築一式・電気・管・鋼構造物・舗装・造園の<b>指定建設業7業種</b>の監理技術者は、<b>1級国家資格者又は国土交通大臣の認定を受けた者に限られ</b>、実務経験のみでは監理技術者になれない。監理技術者設置の下請金額(5,000万円/8,000万円)と専任の請負金額(4,500万円/9,000万円)は令和5年改正後の現行値であり、旧数値と混同しないよう注意する。"},
{"c":"法規","q":"消防法上、スプリンクラー設備に関する記述のうち、誤っているものはどれか。","a":["閉鎖型スプリンクラーヘッドの放水圧力は、1.2MPaを超えないように措置しなければならない。","スプリンクラー設備には、消防ポンプ自動車が容易に接近できる位置に双口形の送水口を設ける。","閉鎖型スプリンクラーヘッドを用いる設備の配管の末端には、末端試験弁を設ける。","予作動式の流水検知装置を用いる設備は、火災感知器の作動から1分以内にヘッドから放水できるものとする。"],"ans":0,"ex":"【1級頻出】閉鎖型スプリンクラーヘッドの放水圧力は<b>0.1MPa以上1.0MPa以下</b>とされ、1.0MPaを超えないように減圧措置を講じる。放水量は1個あたり80L/min以上(小区画型ヘッドは50L/min以上)である。送水口は双口形、末端試験弁は閉鎖型ヘッド用設備に設置、予作動式は1分以内放水という規定も合わせて押さえる。"},
{"c":"法規","q":"消防法上、1号消火栓を用いる屋内消火栓設備の加圧送水装置に関する記述のうち、誤っているものはどれか。","a":["加圧送水装置のポンプは、消火栓箱の操作部からの遠隔操作で停止できる構造とする。","ポンプの原動機には、電動機を用いる。","水源の水位がポンプより低い位置にある場合は、有効水量100L以上の呼水槽を備えた呼水装置を設ける。","加圧送水装置の始動を明示する表示灯は、赤色とし、屋内消火栓箱の内部又はその直近に設ける。"],"ans":0,"ex":"【1級頻出】屋内消火栓設備の加圧送水装置は、消火活動中に誤って停止されることを防ぐため、<b>直接操作によってのみ停止できる</b>構造としなければならず、遠隔操作による停止は認められない。始動は消火栓箱の起動ボタン等で遠隔操作できる。電動機原動機、呼水槽100L以上、赤色の始動表示灯は規定どおりである。"},
{"c":"法規","q":"建設工事に係る資材の再資源化等に関する法律(建設リサイクル法)に関する記述のうち、誤っているものはどれか。","a":["建築物の解体工事では、床面積の合計が100m2以上のものが分別解体等の実施義務の対象となる。","特定建設資材である木材は、工事現場から50km以内に再資源化施設がない場合などには、再資源化に代えて縮減(焼却)を行えばよい。","対象建設工事の元請業者は、再資源化等が完了したときは、その旨を発注者に書面で報告しなければならない。","対象建設工事の請負契約の書面には、分別解体等の方法、解体工事に要する費用、再資源化等をするための施設の名称及び所在地などを記載しなければならない。"],"ans":0,"ex":"【1級頻出】分別解体等が義務となる対象建設工事の規模は、<b>解体工事は床面積の合計80m2以上</b>、新築・増築工事は床面積の合計500m2以上、修繕・模様替等は請負代金1億円以上、その他の工作物(土木工事等)は請負代金500万円以上である。木材の縮減特例(50km)、発注者への完了報告、契約書面の記載事項は正しい。"},
{"c":"法規","q":"高齢者、障害者等の移動等の円滑化の促進に関する法律(バリアフリー法)に関する記述のうち、誤っているものはどれか。","a":["特別特定建築物の建築で建築物移動等円滑化基準への適合が義務付けられる規模は、原則として床面積の合計1,000m2以上である。","図書館は、特別特定建築物に該当する。","特別特定建築物の建築主等は、床面積が所定の規模以上の建築をしようとするときは、建築物移動等円滑化基準に適合させなければならない。","地方公共団体は、条例により、適合義務の対象となる特別特定建築物の規模を引き下げることができる。"],"ans":0,"ex":"バリアフリー法で特別特定建築物(図書館、病院、劇場、百貨店、ホテル、官公署など)の建築に建築物移動等円滑化基準への適合義務が課されるのは、原則として<b>床面積の合計2,000m2以上</b>(公衆便所は50m2以上)の場合である。より高い水準の建築物移動等円滑化誘導基準は任意の認定制度であり、適合義務とは区別する。地方公共団体は条例で対象規模の引下げや対象用途の追加ができる。"},
{"c":"原論・基礎","q":"地球環境及び環境配慮建築に関する記述のうち、適当でないものはどれか。","a":["事務所建築のライフサイクルCO2(LCCO2)は、設計・建設段階の排出量が全体の過半を占め、運用段階の排出量は比較的小さい。","HFC(ハイドロフルオロカーボン)は、オゾン層破壊係数はゼロであるが、地球温暖化係数が二酸化炭素より大きい。","酸性雨は、化石燃料の燃焼で生じた硫黄酸化物や窒素酸化物が大気中で硫酸・硝酸となり、雨水に溶け込むことで生じる。","ZEB(ネット・ゼロ・エネルギー・ビル)は、省エネルギーと再生可能エネルギーの活用により、年間の一次エネルギー消費量の収支ゼロを目指す建築物である。"],"ans":0,"ex":"【1級頻出】事務所建築のLCCO2は<b>運用段階(空調・照明等のエネルギー消費)が全体の過半</b>を占め、設計・建設段階は2~3割程度にとどまる。したがって運用時の省エネルギーがLCCO2削減に最も効果的である。HFCはODP=0だがGWPが大きく、フロン排出抑制法の規制対象となっている。"},
{"c":"原論・基礎","q":"排水の水質に関する記述のうち、適当でないものはどれか。","a":["BOD(生物化学的酸素要求量)は、水中の有機物を酸化剤で化学的に酸化する際に消費される酸素量を表す指標である。","COD(化学的酸素要求量)は、水中の被酸化性物質を過マンガン酸カリウムなどの酸化剤で酸化したときに消費される酸素量に相当する値である。","ノルマルヘキサン抽出物質は、排水中に含まれる油脂類などの量を表す指標である。","TOC(全有機炭素)は、水中の有機物に含まれる炭素の総量を表す指標である。"],"ans":0,"ex":"【1級頻出】BODは<b>微生物が有機物を分解する際に消費する酸素量</b>(20℃・5日間)で、生物化学的な指標である。酸化剤を用いて化学的に酸化するのはCODである。n-ヘキサン抽出物質は厨房排水などの油分管理に用いられる。"},
{"c":"原論・基礎","q":"ダクト内を空気が流れており、上流側A点の全圧が120Pa、下流側B点の静圧が30Pa、B点の風速が10m/sであった。A-B間の圧力損失として、適当なものはどれか。ただし、空気の密度は1.2kg/m³とする。","a":["30Pa","60Pa","90Pa","150Pa"],"ans":0,"ex":"【1級頻出】B点の動圧は ρv²/2=0.5×1.2×10²=<b>60Pa</b>、B点の全圧は静圧30Pa+動圧60Pa=90Paとなる。圧力損失は全圧の差で求めるので、120−90=<b>30Pa</b>である。静圧の差だけで求めないよう注意する。"},
{"c":"原論・基礎","q":"熱に関する記述のうち、適当でないものはどれか。","a":["蒸気圧縮冷凍サイクルにおいて、凝縮温度を一定とし蒸発温度を低くすると、成績係数(COP)は大きくなる。","気体を断熱圧縮すると、外部との熱の授受がなくても気体の温度は上昇する。","水の比熱は約4.2kJ/(kg・K)で、空気の定圧比熱(約1.0kJ/(kg・K))より大きい。","液体の体膨張係数は、一般に固体の体膨張係数より大きい。"],"ans":0,"ex":"【1級頻出】蒸発温度を下げる(または凝縮温度を上げる)と圧縮機の仕事が増え、<b>COPは小さくなる</b>。逆カルノーサイクルの理論COPは Te/(Tc−Te) で表され、蒸発温度Teと凝縮温度Tcの差が小さいほど大きい。断熱圧縮では外部から与えた仕事が内部エネルギーに変わり温度が上昇する。"},
{"c":"原論・基礎","q":"湿り空気の状態変化に関する記述のうち、適当でないものはどれか。","a":["シリカゲルなどの固体吸着剤による減湿では、絶対湿度の低下とともに乾球温度も低下する。","水を噴霧して加湿すると、空気の状態は湿球温度がほぼ一定(近似的に等エンタルピー)の線上を変化する。","蒸気加湿では、乾球温度はほとんど変化せず、絶対湿度が増加する。","熱水分比は、空気の比エンタルピーの変化量を絶対湿度の変化量で除した値である。"],"ans":0,"ex":"【1級頻出】吸着減湿では水蒸気が吸着される際の吸着熱で空気が加熱され、<b>湿球温度(エンタルピー)がほぼ一定のまま乾球温度は上昇</b>する。水噴霧加湿(断熱加湿)も等エンタルピー変化だが乾球温度は低下する。蒸気加湿の熱水分比は加湿蒸気の比エンタルピーに等しく、線図上ではほぼ垂直に近い変化となる。"},
{"c":"原論・基礎","q":"音に関する記述のうち、適当でないものはどれか。","a":["NC曲線では、周波数が高い帯域ほど許容される音圧レベルが大きく設定されている。","同じ音圧レベルの音源が2つ同時に存在すると、合成音圧レベルは単独の場合より約3dB大きくなる。","人間の可聴周波数範囲は、おおむね20Hzから20,000Hzである。","点音源からの距離が2倍になると、音圧レベルは約6dB減衰する。"],"ans":0,"ex":"【1級頻出】NC曲線は人間の聴感が高い周波数に敏感であることを反映し、<b>周波数が高いほど許容音圧レベルは小さく</b>なる(右下がりの曲線)。等しいレベルの音を2つ合成すると+3dB、点音源の距離減衰は距離2倍で−6dBが基本である。"},
{"c":"原論・基礎","q":"低圧屋内配線工事に関する記述のうち、適当でないものはどれか。","a":["金属管工事において、金属管と金属製ボックスとの電気的接続のためのボンド線は、省略することができる。","使用電圧300V以下の低圧用機械器具の金属製外箱には、D種接地工事を施す。","水気のある場所以外に施設する使用電圧300V以下の機械器具に簡易接触防護措置を施した場合は、その電路の漏電遮断器の設置を省略することができる。","CD管(合成樹脂製可とう電線管)は、直接コンクリートに埋め込んで施設する場合に用いる。"],"ans":0,"ex":"【1級頻出】金属管と金属製ボックス等との接続部は、接地の連続性を確保するため<b>ボンド線で電気的に接続しなければならず、省略できない</b>。CD管は自己消火性がないためコンクリート埋設など不燃性の物で覆って施設し、露出・隠ぺい配管にはPF管を用いる。"},
{"c":"空調","q":"省エネルギーに効果のある建築的な手法に関する記述のうち、適当でないものはどれか。","a":["建物の平面形状を長方形とする場合、東西面を長辺とすると冷房時の日射負荷を低減できる。","窓の外側に水平ルーバーや庇を設けることは、室内側のブラインドより日射遮へい効果が大きい。","屋上緑化は、屋根面の日射による熱負荷の低減に効果がある。","屋根面に高反射率(遮熱)塗料を施すことは、夏期の屋根面温度の上昇抑制に効果がある。"],"ans":0,"ex":"【1級頻出】夏期は東西面の受ける日射量が大きいため、<b>南北面を長辺とし東西面の面積を小さく</b>するのが日射負荷低減の基本である。日射は室内側で遮るより窓の外側で遮る方が効果が高い。"},
{"c":"空調","q":"空気調和方式に関する記述のうち、適当でないものはどれか。","a":["定風量単一ダクト方式は、負荷変動のパターンが異なる多数の室を同一系統で空調する場合に適している。","大温度差送風方式は、送風量を少なくできるため、ダクト寸法や送風機動力を低減できる。","床吹出し空調方式は、二重床(フリーアクセスフロア)を給気経路として利用でき、OA機器の配置変更に対応しやすい。","天井放射冷房方式は、気流感が少なく静穏な室内環境が得られるが、放射パネルの結露防止のため除湿を行う別系統が必要となる。"],"ans":0,"ex":"【1級頻出】定風量単一ダクト(CAV)方式は系統内の全室に同一温度の空気を送るため、<b>負荷変動パターンが異なる室が混在する場合は各室の温度制御ができない</b>。このような場合はVAV方式やゾーン別系統とする。大温度差送風は送風量削減により搬送動力を減らせる。"},
{"c":"空調","q":"コージェネレーションシステムに関する記述のうち、適当でないものはどれか。","a":["ガスエンジン方式は、ガスタービン方式に比べて排熱のうち高温の排ガスとして回収できる割合が大きく、蒸気としての排熱利用に有利である。","商用電力系統と連系する場合は、系統連系に関する技術要件を満たし、電力会社との協議が必要である。","燃料電池は、燃料から得た水素と空気中の酸素を電気化学反応させて直流電力を得るため、交流で使用するにはインバータが必要である。","排熱は、蒸気・高温水・温水など温度レベルの高いものから順に多段的に利用すると、総合効率を高めることができる。"],"ans":0,"ex":"【1級頻出】ガスエンジンは排熱の多くがジャケット冷却水の<b>温水(80~90℃程度)</b>として回収され、高温排ガスの割合が大きいのはガスタービン方式である。したがって蒸気需要が大きい場合はガスタービン、温水需要が主の場合はガスエンジンが適する。排熱はカスケード利用が基本である。"},
{"c":"空調","q":"蓄熱方式に関する記述のうち、適当でないものはどれか。","a":["氷蓄熱方式は、水の融解潜熱を利用するため、同じ蓄熱量に対する蓄熱槽の容積が水蓄熱方式より大きくなる。","蓄熱方式を採用すると、熱源機器を定格に近い高効率の状態で長時間運転することができる。","夜間電力を利用した蓄熱運転により、昼間の電力ピークカットに寄与する。","水蓄熱槽を建物の二重スラブ内に設ける場合、二次側は開放回路となるため、ポンプ揚程に押上げ分の静水頭を加える必要がある。"],"ans":0,"ex":"【1級頻出】氷蓄熱は水の融解潜熱(約334kJ/kg)を利用するため、<b>蓄熱槽容積は水蓄熱の1/5~1/10程度に小型化</b>できる。ただし製氷時の蒸発温度が低くなるため熱源機のCOPは低下する。開放回路では高置側への押上げ揚程が必要になる。"},
{"c":"空調","q":"排煙設備に関する記述のうち、適当でないものはどれか。","a":["1台の排煙機で複数の防煙区画を受け持つ場合、各防煙区画の排煙口は常時開放型とする。","排煙ダクトに設ける防火ダンパーの温度ヒューズの作動温度は、280℃程度のものとする。","自然排煙と機械排煙は、同一防煙区画内で併用しない。","可動間仕切りで区画を変更できる室では、変更後の区画ごとに排煙口が有効に機能するよう計画する。"],"ans":0,"ex":"【1級頻出】複数の防煙区画を1台の排煙機が受け持つ場合、火災区画以外から空気を吸い込まないよう<b>排煙口は常時閉鎖型</b>とし、火災区画の排煙口のみを開放させる。常時開放型は1防煙区画を1排煙機で受け持つ場合に用いる。排煙ダクトのFDは一般の72℃ではなく280℃作動のものを使用する。"},
{"c":"空調","q":"排煙設備に関する記述のうち、適当でないものはどれか。","a":["防煙区画は、防煙壁によって床面積1,000m²以内ごとに区画する。","排煙口は、防煙区画の各部分から水平距離で30m以下となるように設ける。","高さ31mを超える建築物の排煙設備は、その制御及び作動状態の監視を中央管理室で行うことができるものとする。","排煙口は、天井面又は天井から80cm以内の壁面で、防煙垂れ壁の下端より上の部分に設ける。"],"ans":0,"ex":"【1級頻出】排煙設備を設ける場合の防煙区画は<b>床面積500m²以内</b>ごとに防煙壁で区画する。排煙口は各部から水平距離30m以下、天井又は天井から80cm以内(かつ防煙垂れ壁の下端より上方)の位置に設ける。高さ31m超の建築物では中央管理室での監視・制御が求められる。"},
{"c":"給排水衛生","q":"下水道に関する記述のうち、適当でないものはどれか。","a":["汚水管きょの計画下水量に対する最小流速は、雨水管きょの最小流速より大きい値とする。","合流式では、汚水と雨水を同一の管きょで排除するため、雨天時に未処理の下水が公共用水域に放流されることがある。","地表勾配が急な場合の管きょの接合には、地表勾配に応じて段差接合や階段接合を用いる。","軟弱地盤に管きょを布設する場合は、不同沈下に追従できる可とう性のある継手・基礎とする。"],"ans":0,"ex":"【1級頻出】下水道の管きょ内流速は、汚物の沈殿を防ぐため<b>汚水管きょで0.6~3.0m/s、雨水・合流管きょで0.8~3.0m/s</b>とされ、雨水管きょの最小流速の方が大きい。下流ほど流速が漸増するよう、勾配は下流にいくほど緩くする。"},
{"c":"給排水衛生","q":"給水設備の計画に関する記述のうち、適当でないものはどれか。","a":["1人1日当たりの設計給水量は、一般に事務所ビルの在勤者の方が集合住宅の居住者より多い。","受水タンクの有効容量は、一般に1日予想給水量の1/2程度とする。","揚水ポンプの揚水量は、一般に時間最大予想給水量を基準として決定する。","地震時の二次災害防止と飲料水確保のため、受水タンクの出口側に緊急遮断弁を設けることがある。"],"ans":0,"ex":"【1級頻出】設計給水量は<b>集合住宅200~350L/(人・日)、事務所60~100L/(人・日)</b>程度で、集合住宅の方が多い。受水タンク容量は1日予想給水量の1/2、高置タンクは1/10程度、揚水ポンプは時間最大予想給水量が目安である。"},
{"c":"給排水衛生","q":"給水設備に関する記述のうち、適当でないものはどれか。","a":["大気圧式バキュームブレーカーは、常時水圧がかかる配管部分に設ける。","高層建築物の給水系統は、給水器具の最高使用圧力を超えないよう、適切な圧力範囲ごとにゾーニングを行う。","ウォーターハンマーの防止策として、衝撃吸収式逆止弁や水撃防止器を設けることがある。","上水の給水管と井水などの他系統の配管を直接接続するクロスコネクションは、弁を介した場合でも禁止されている。"],"ans":0,"ex":"【1級頻出】大気圧式バキュームブレーカーは<b>常時水圧がかからない部分(大便器洗浄弁の下流側など)</b>に設け、常時水圧がかかる部分には圧力式を用いる。ゾーニングは事務所で給水圧力0.5MPa以下程度、ホテル・住宅で0.3~0.4MPa以下程度を上限の目安とする。クロスコネクションは逆止弁を設けても認められない。"},
{"c":"給排水衛生","q":"給湯設備に関する記述のうち、適当でないものはどれか。","a":["住宅のセントラル給湯(台所・浴室・洗面の同時使用)に用いるガス瞬間湯沸器は、一般に10号程度の能力で十分である。","ガス瞬間湯沸器の能力を表す「号」は、水温を25℃上昇させた湯を毎分1L供給できる能力を1号とする。","中央式給湯設備の返湯管の管径は、給湯管の管径より小さくすることができる。","開放式膨張タンクに接続する逃し管(膨張管)には、弁を設けてはならない。"],"ans":0,"ex":"【1級頻出】住宅で台所・浴室・洗面を同時に使うセントラル給湯には<b>24号程度</b>の能力が必要で、10号程度では不足する。1号は25K上昇の湯を1L/min(約1.74kW)供給する能力である。返湯管は循環量が小さいため給湯管より細くでき、逃し管に弁を設けると膨張時に危険なため禁止されている。"},
{"c":"給排水衛生","q":"排水設備に関する記述のうち、適当でないものはどれか。","a":["器具排水負荷単位は、洗浄弁式大便器の排水流量を基準の1単位として、各器具の排水量を相対的に表したものである。","排水横枝管から排水立て管へのブランチ間隔は、2.5mを超える間隔とする。","飲料用受水タンクの間接排水管の排水口空間は、最小150mmとする。","営業用厨房の排水系統には、油脂分を阻集するためグリース阻集器を設ける。"],"ans":0,"ex":"【1級頻出】器具排水負荷単位(fu)は<b>洗面器の排水量(約28.5L/min)を1単位</b>とし、他の器具の排水量を相対的に表したものである。ブランチ間隔は2.5mを超える間隔、飲料用タンクの排水口空間は管径にかかわらず最小150mmとする。"},
{"c":"給排水衛生","q":"消火設備の消火原理に関する記述のうち、適当でないものはどれか。","a":["不活性ガス消火設備は、燃焼の連鎖反応を抑制する負触媒効果を主な消火原理とする。","水噴霧消火設備は、水の冷却効果と、発生した水蒸気による窒息効果により消火する。","粉末消火設備は、粉末薬剤の負触媒効果と窒息効果により消火する。","泡消火設備は、泡が燃焼面を覆う窒息効果と、泡に含まれる水の冷却効果により消火する。"],"ans":0,"ex":"不活性ガス(二酸化炭素・窒素など)消火設備は、放出により<b>酸素濃度を低下させる窒息効果</b>を主体とした消火原理である。負触媒(抑制)効果を主とするのはハロゲン化物消火設備や粉末消火設備である。水噴霧は油火災に対して油面に乳化層(エマルション)を作る効果も持つ。"},
{"c":"給排水衛生","q":"FRP製浄化槽の設置に関する記述のうち、適当でないものはどれか。","a":["浄化槽の据付け高さの調整は、基礎コンクリートの上に山砂を敷いて行う。","地下水位が高い場所では、浮上防止のため槽を固定バンドなどで基礎に固定する。","槽の据付け後に水張りを行い、水平であることを確認してから周囲の埋戻しを行う。","浄化槽工事は、浄化槽設備士の資格を有する者が実地に監督しなければならない。"],"ans":0,"ex":"【1級頻出】据付け高さの調整は<b>基礎コンクリートの天端で行い、山砂などで嵩上げして調整してはならない</b>(不同沈下や水平不良の原因となる)。埋戻しは槽内に水を張った状態で、良質土を用いて均等に行う。浄化槽工事は浄化槽設備士が実地に監督することが浄化槽法で定められている。"},
{"c":"機器・材料","q":"ボイラー及び温水発生機に関する記述のうち、適当でないものはどれか。","a":["鋳鉄製ボイラーは、セクションを組み合わせて容量を増やせるため、高温・高圧・大容量のボイラーにも適している。","炉筒煙管ボイラーは、保有水量が多いため負荷変動に対して安定しているが、起動に時間がかかる。","真空式温水発生機は、缶体内を大気圧以下に保って水を沸騰させ、その蒸気で熱交換器内の水を加熱するもので、ボイラーとしての法規制を受けない。","ボイラー本体は、燃料を燃焼させる火炉と、水・蒸気を保有する缶体を主要部分として構成される。"],"ans":0,"ex":"鋳鉄製ボイラーは鋳鉄の強度上の制約から<b>低圧(蒸気0.1MPa以下、温水0.5MPa以下程度)の小~中容量</b>に限られ、高温・高圧・大容量のものは製作できない。真空式温水発生機は缶体内が大気圧未満のため労働安全衛生法上のボイラーに該当せず、取扱資格も不要である。"},
{"c":"機器・材料","q":"配管材料に関する記述のうち、適当でないものはどれか。","a":["排水用硬質塩化ビニルライニング鋼管は、管端にねじを切ってねじ込み式排水管継手で接合する。","鋼管とステンレス鋼管など異種金属管を接続する場合は、絶縁フランジや絶縁継手を用いて異種金属接触腐食を防止する。","架橋ポリエチレン管は、耐熱性・耐食性に優れ、給湯配管やさや管ヘッダー方式の給水配管に用いられる。","圧力配管用炭素鋼鋼管(STPG)は、350℃以下の圧力配管に用いられ、スケジュール番号で肉厚が区分される。"],"ans":0,"ex":"【1級頻出】排水用硬質塩化ビニルライニング鋼管(D-VA)は<b>管の肉厚が薄くねじ切りができないため、専用のメカニカル形排水管継手(MD継手)</b>で接合する。給水用の塩ビライニング鋼管(SGP-VA等)は管端防食継手でねじ接合する。"},
{"c":"機器・材料","q":"ダクト及びダクト附属品に関する記述のうち、適当でないものはどれか。","a":["等摩擦法(定圧法)によるダクト設計では、各吹出口までのダクト長さが著しく異なっても、各吹出口の圧力はほぼ均等になる。","吸込口の気流は吹出口の気流に比べて指向性が弱く、吸込口から離れると急速に風速が低下する。","スパイラルダクトは、帯状の板をらせん状に巻いてはぜで接合したもので、はぜが補強の役割を果たすため一般に補強が不要である。","送風機とダクトの接続部には、送風機の振動がダクトに伝わらないよう、たわみ継手(キャンバス継手)を設ける。"],"ans":0,"ex":"【1級頻出】等摩擦法は単位長さ当たりの摩擦損失を一定として管径を決める方法で、<b>ダクト長が著しく異なる系統では吹出口間に圧力差が生じ風量のアンバランス</b>を招くため、ダンパーによる調整や静圧再取得法の併用が必要となる。吸込口付近の気流は吹出気流より速度の減衰が急である。"},
{"c":"設計図書","q":"JISに定める配管材料に関する記述のうち、適当でないものはどれか。","a":["硬質ポリ塩化ビニル管のVP・VM・VUのうち、肉厚が最も厚く設計圧力の上限が最も高いのはVUである。","一般配管用ステンレス鋼鋼管(SUS-TPD)は、配管用ステンレス鋼鋼管(SUS-TP)より肉厚が薄く、給水・給湯などの一般配管に用いられる。","耐衝撃性硬質ポリ塩化ビニル管(HIVP)は、VPと同じ外径・肉厚で耐衝撃性を高めたものである。","配管用ステンレス鋼鋼管は、呼び厚さをスケジュール番号で表し、高温・高圧の配管にも用いられる。"],"ans":0,"ex":"【1級頻出】硬質塩ビ管の肉厚はVP>VM>VUの順で、設計圧力の上限はVP:1.0MPa、VM:0.8MPa、<b>VU:0.6MPaとVUが最も低い</b>。一般配管用ステンレス鋼鋼管は薄肉で、メカニカル継手やプレス式継手で接合する。"},
{"c":"施工管理","q":"公共工事における施工計画に関する記述のうち、適当でないものはどれか。","a":["実行予算書は、工事原価を管理するための重要な書類であるため、工事着手前に発注者に提出して承諾を受けなければならない。","設計図書に特別の定めがない仮設及び施工方法は、受注者がその責任において定める。","設計図書に示されていない予測不能な地下埋設物の処理に要した費用は、発注者と協議のうえ、必要に応じて設計変更の対象とする。","総合施工計画書は、工事全体の施工方針・工程・安全衛生管理などの基本事項を定めるもので、工種別の施工計画書に先行して作成する。"],"ans":0,"ex":"【1級頻出】実行予算書は受注者が原価管理のために作成する<b>社内資料であり、発注者への提出義務はない</b>。発注者に提出(承諾)するのは施工計画書や施工体制台帳の写しなどである。予測不能な地下埋設物は設計図書と現場の不一致(条件変更)に該当し、協議・設計変更の対象となる。"},
{"c":"施工管理","q":"工事に関する申請・届出書類とその提出先の組合せのうち、適当でないものはどれか。","a":["危険物貯蔵所設置許可申請書 ―― 消防署長","第一種圧力容器設置届 ―― 労働基準監督署長","道路占用許可申請書 ―― 道路管理者","特定建設作業実施届出書 ―― 市町村長"],"ans":0,"ex":"【1級頻出】危険物貯蔵所・取扱所の設置許可申請は<b>市町村長等(消防本部を置く市町村は市町村長、それ以外は都道府県知事)</b>に行い、消防署長ではない。圧力容器・ボイラー関係は労働基準監督署長、道路占用は道路管理者、道路使用は警察署長、特定建設作業は市町村長に届け出る。"},
{"c":"施工管理","q":"品質管理に関する記述のうち、適当でないものはどれか。","a":["品質の向上と原価の低減は常に相反する関係にあるため、品質管理の徹底は必ず工事原価の増加を招く。","品質管理は、計画(Plan)・実施(Do)・確認(Check)・処置(Act)のサイクルを繰り返して行う。","不良品を見逃すと人命に関わるような重要な項目は、全数検査とする。","抜取検査は、検査費用や時間を節約できるが、ある程度の不良品の混入を許容することが前提となる。"],"ans":0,"ex":"【1級頻出】品質管理の徹底により手戻り・補修・クレームが減り、<b>結果的に原価低減につながる</b>ことが多いため、品質向上と原価低減は常にトレードオフの関係ではない。全数検査は不良が重大な影響を及ぼす場合や検査が容易な場合に、抜取検査は破壊検査や連続体などに適用する。"},
{"c":"施工管理","q":"安全管理に関する記述のうち、適当でないものはどれか。","a":["ZD(ゼロ・ディフェクト)運動は、作業手順を細部までマニュアル化し、管理者が作業員の作業を常時監視することで無欠点を達成しようとする活動である。","墜落制止用器具は、高さ6.75mを超える箇所ではフルハーネス型を使用し、胴ベルト型は使用できない。","ヒヤリ・ハット活動は、災害には至らなかったが危険を感じた事例を収集・共有し、災害の未然防止に役立てる活動である。","安全施工サイクルは、安全朝礼、KY活動、作業中の巡視、作業終了時の確認など、日々の安全活動を定型化して繰り返すものである。"],"ans":0,"ex":"【1級頻出】ZD運動は<b>作業員一人ひとりの自主的な参加と注意・工夫によって無欠点を目指す</b>活動であり、監視や強制によって達成するものではない。墜落制止用器具は原則フルハーネス型とし、高さ6.75m以下(建設業では5m以下が目安)で墜落時に地面に到達する恐れがある場合に胴ベルト型が認められる。"},
{"c":"施工管理","q":"安全管理に関する記述のうち、適当でないものはどれか。","a":["ツールボックスミーティング(TBM)は、1日の作業終了後に当日の作業を振り返り、翌日の作業内容を確認する打合せである。","WBGT(暑さ指数)は、気温・湿度・放射熱を考慮した指標で、熱中症予防の目安として用いられる。","労働災害の多くは、不安全な状態と不安全な行動が重なって発生しており、不安全行動の防止には安全教育が重要である。","4S活動とは、整理・整頓・清掃・清潔を徹底し、安全で効率的な作業環境を維持する活動である。"],"ans":0,"ex":"【1級頻出】TBMは<b>作業開始前</b>に職長と作業員が作業内容・手順・危険箇所を短時間で確認する打合せで、KY(危険予知)活動と組み合わせて行われる。WBGTは湿球黒球温度の略で、暑さ指数に応じた作業の中断・休憩や水分・塩分補給が求められる。"},
{"c":"施工管理","q":"配管の施工に関する記述のうち、適当でないものはどれか。","a":["冷温水の横走り管で管径を変える場合、偏心レジューサーは管の下面が揃うように取り付ける。","冷温水配管の最上部など空気が溜まりやすい箇所には、自動空気抜き弁を設ける。","伸縮する主管から分岐する枝管には、スイベルジョイントなどにより主管の伸縮を吸収できる余裕をもたせる。","排水立て管にオフセットを設ける場合、オフセット部の上下600mm以内には排水横枝管を接続しない。"],"ans":0,"ex":"【1級頻出】冷温水の横走り管では管内に<b>空気が溜まらないよう、偏心レジューサーは管の上面を揃えて</b>取り付ける。ポンプ吸込み側の横走り管も同様に上面揃えとするのが原則である。排水立て管のオフセット部では、上下600mm以内の横枝管接続を避ける。"},
{"c":"施工管理","q":"配管の施工に関する記述のうち、適当でないものはどれか。","a":["ポンプの吸込み管は、ポンプに向かって下り勾配とし、管内に空気が滞留しないようにする。","屋外排水管に設ける排水ますは、管径の120倍以内の間隔で設ける。","ステンレス鋼管のTIG溶接では、溶接部の裏側(管内側)にアルゴンガスを流してバックシールドを行う。","鋼管の突合せ溶接における余盛りは、過大にならないよう規定の高さ以内に仕上げる。"],"ans":0,"ex":"【1級頻出】ポンプの吸込み管は<b>ポンプに向かって上り勾配</b>とし、空気溜まりができないよう偏心レジューサーも上面揃えとする。下り勾配や山形の配管では空気が溜まり、キャビテーションや揚水不良の原因となる。排水ますは管径の120倍以内、かつ合流点・曲がり点・勾配変化点に設ける。"},
{"c":"施工管理","q":"保温・保冷の施工に関する記述のうち、適当でないものはどれか。","a":["垂直配管の外装テープ巻きは、上方から下方に向かって巻き下げる。","帯状保温材を配管に巻く場合、鉄線は50mm以下のピッチでらせん巻き締めとする。","保温筒の継目は、1か所に集中しないよう千鳥に配置する。","点検口の周囲など保温の端部は、水や空気が浸入しないようテープなどで端末処理を行う。"],"ans":0,"ex":"【1級頻出】垂直配管の外装テープやラッキングは、重ね部から水が浸入しないよう<b>下方から上方へ巻き上げる</b>。保温筒は1本につき鉄線2か所以上、帯状材は50mm以下のピッチでらせん巻きとし、継目は千鳥に配置する。"},
{"c":"施工管理","q":"ボイラーの単体試運転調整に関する記述のうち、適当でないものはどれか。","a":["点火前には、ボイラーの主蒸気弁を全開にして蒸気の流路を確保しておく。","ガス焚きボイラーでは、ガス供給圧力を規定値に調整したうえで点火試験を行う。","重油焚きボイラーでは、点火前にオイルヒーターを運転して燃料油を所定の温度・粘度にする。","燃焼安全装置の確認として、火炎検出器(フレームアイ)を遮光し、燃料遮断弁が作動して燃焼が停止することを確認する。"],"ans":0,"ex":"【1級頻出】ボイラーの点火・昇圧時は<b>主蒸気弁を閉じておき</b>、所定圧力に達した後に徐々に開いて送気する。弁を開けたまま点火すると配管側へ低圧蒸気やドレンが流れ、ウォーターハンマーなどの原因となる。フレームアイの遮光試験は不着火・断火時の安全確認として重要である。"},
{"c":"施工管理","q":"機器の防振に関する記述のうち、適当でないものはどれか。","a":["金属バネは防振ゴムに比べて減衰比が大きいため、共振時の振幅が小さく、サージングを起こしにくい。","共通架台上に回転数の異なる複数の機器を設置する場合、防振材は最も低い回転数(最も低い強制振動数)の機器に合わせて選定する。","防振材の固有振動数は、機器の強制振動数より十分小さくなるように選定する。","低い振動数の振動を防振する場合は、たわみ量を大きくとれる金属バネが適している。"],"ans":0,"ex":"【1級頻出】金属バネは<b>減衰比が小さく、共振時の振幅が大きくなりやすいうえ、高周波域でサージング(バネ自身の共振)</b>を起こしやすい。防振ゴムは減衰が大きいがたわみ量が小さく、低振動数の防振には不向きである。防振効果を得るには強制振動数/固有振動数を√2以上(一般に3程度以上)とする。"},
{"c":"法規","q":"労働安全衛生法上、労働者の就業等に関する記述のうち、誤っているものはどれか。","a":["作業床の高さが10m以上の高所作業車を用いる作業では、高所作業車作業主任者を選任しなければならない。","高さが2m以上の箇所で作業床を設けることが困難な場所において、フルハーネス型墜落制止用器具を用いて行う作業の業務には、特別教育が必要である。","研削といしの取替え又は取替え時の試運転の業務には、特別教育が必要である。","作業床の高さが10m以上の高所作業車の運転(道路上を走行させる運転を除く)の業務は、技能講習を修了した者等でなければ就かせてはならない。"],"ans":0,"ex":"【1級頻出】高所作業車には<b>作業主任者の制度はなく</b>、作業床高さ10m以上の運転業務は技能講習、10m未満は特別教育の対象である。作業主任者の選任が必要なのはボイラー取扱、酸素欠乏危険作業、足場の組立て等(高さ5m以上)、型枠支保工の組立て等である。"},
